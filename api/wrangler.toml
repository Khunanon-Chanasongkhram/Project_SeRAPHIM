name = "seraphim-sos"
main = "src/index.js"
compatibility_date = "2026-01-01"

# D1 free tier: 500 MB. Only SOS lives here — gauge history is archived to R2 and
# never touches this database.
[[d1_databases]]
binding = "DB"
database_name = "seraphim-sos"
database_id = "PUT-YOUR-D1-DATABASE-ID-HERE"

# PDPA storage limitation: purge expired requests nightly.
[triggers]
crons = ["17 3 * * *"]

[vars]
# Override with a real secret:  npx wrangler secret put IP_SALT
IP_SALT = "change-me-before-deploy"
