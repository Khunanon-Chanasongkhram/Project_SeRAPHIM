<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://tilecache.rainviewer.com; connect-src 'self' https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://api.rainviewer.com https://*.api.radio-browser.info https://gibs.earthdata.nasa.gov; media-src https: blob:; worker-src 'self' blob:; base-uri 'self'; form-action 'self'">
<title>SeRAPHIM</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="./config.js"></script>
<style>
  :root{
    --bg:#07090c; --panel:rgba(12,16,22,.86); --panel-solid:#0c1016;
    --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.18);
    --fg:#e9eef5; --dim:#8c98a8; --faint:#5c6672;
    --l1:#2f81f7; --l2:#d99e0b; --l3:#e8590c; --l4:#e5484d; --l5:#ff2d55;
    --ok:#3fb950;
    --sheet-collapsed:74px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Noto Sans Thai",sans-serif}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  #map{position:absolute;inset:0}
  .maplibregl-ctrl-attrib{font-size:9px;background:rgba(0,0,0,.5)!important}
  .maplibregl-ctrl-attrib a{color:var(--faint)!important}

  /* ---------- top bar ---------- */
  #top{position:absolute;z-index:5;top:0;left:0;right:0;
    padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;
    display:flex;align-items:center;gap:8px;
    background:linear-gradient(180deg,rgba(7,9,12,.92),rgba(7,9,12,0));
    pointer-events:none}
  #top > *{pointer-events:auto}
  .brand{font-size:13px;font-weight:700;letter-spacing:.14em;margin-right:auto;
    display:flex;align-items:center;gap:7px;text-shadow:0 1px 6px #000}
  .live{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;
    box-shadow:0 0 0 0 rgba(63,185,80,.6);animation:pulse 2.6s infinite}
  .live.stale{background:var(--l3);animation:none}
  .live.dead{background:var(--l5);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,185,80,.55)}70%{box-shadow:0 0 0 9px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--fg);
    border-radius:9px;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);line-height:1}
  .btn:active{background:rgba(255,255,255,.1)}
  .btn.on{background:var(--fg);color:var(--panel-solid);border-color:var(--fg);font-weight:700}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;
    overflow:hidden;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .seg button{background:none;border:0;color:var(--dim);font:inherit;font-size:11px;
    font-weight:700;padding:7px 9px;cursor:pointer}
  .seg button.on{background:var(--fg);color:var(--panel-solid)}

  /* ---------- layers drawer ---------- */
  #layers{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 50px);right:10px;
    width:min(240px,calc(100vw - 20px));background:var(--panel);border:1px solid var(--line);
    border-radius:13px;padding:11px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    display:none;box-shadow:0 12px 40px rgba(0,0,0,.55)}
  #layers.show{display:block}
  #layers h4{margin:0 0 6px;font-size:10px;letter-spacing:.12em;color:var(--faint);font-weight:700}
  #layers h4:not(:first-child){margin-top:12px}
  .opt{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;
    font-size:12.5px}
  .opt:active{background:rgba(255,255,255,.07)}
  .opt.on{background:rgba(47,129,247,.18)}
  .opt .sw{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
  .opt.on .sw{background:var(--l1);box-shadow:0 0 8px var(--l1)}
  .note{font-size:10.5px;color:var(--faint);line-height:1.4;margin-top:9px;
    padding-top:9px;border-top:1px solid var(--line)}

  /* ---------- bottom sheet ---------- */
  #sheet{position:absolute;z-index:5;left:0;right:0;bottom:0;
    background:var(--panel);border-top:1px solid var(--line-strong);
    border-radius:16px 16px 0 0;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    max-height:min(62vh,520px);height:var(--sheet-collapsed);
    transition:height .26s cubic-bezier(.4,0,.2,1);overflow:hidden;
    box-shadow:0 -10px 40px rgba(0,0,0,.5)}
  #sheet.open{height:min(62vh,520px)}
  #grab{padding:7px 0 3px;display:flex;justify-content:center;cursor:pointer}
  #grab i{display:block;width:34px;height:4px;border-radius:2px;background:var(--line-strong)}
  #sheetbody{overflow-y:auto;max-height:calc(min(62vh,520px) - 18px);
    padding:0 12px calc(env(safe-area-inset-bottom,0px) + 14px);-webkit-overflow-scrolling:touch}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;cursor:pointer}
  .stat{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:10px;
    padding:7px 9px}
  .stat b{display:block;font-size:20px;line-height:1.1}
  .stat i{font-style:normal;font-size:9.5px;color:var(--dim);letter-spacing:.03em}
  .age{margin-top:9px;font-size:11px;color:var(--dim);display:flex;gap:6px;align-items:center}

  .modes{display:flex;gap:5px;margin-top:11px}
  .modes button{flex:1;font-size:11px;padding:8px 4px;line-height:1.3}
  h5{margin:14px 0 6px;font-size:10px;letter-spacing:.12em;color:var(--faint);font-weight:700}
  .legend{display:flex;flex-wrap:wrap;gap:5px}
  .legend div{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);
    background:rgba(255,255,255,.04);padding:3px 8px;border-radius:999px}
  .legend .d{width:8px;height:8px;border-radius:50%;flex:none}

  .worst a{display:flex;align-items:center;gap:9px;padding:8px 6px;border-radius:8px;
    text-decoration:none;color:inherit;cursor:pointer;border-bottom:1px solid var(--line)}
  .worst a:active{background:rgba(255,255,255,.06)}
  .lv{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;
    font-size:11px;font-weight:800;color:#fff}
  .worst .t{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .worst .ttb{font-size:11.5px;font-weight:700;color:var(--l4)}

  .disc{margin-top:13px;font-size:10.5px;color:var(--faint);line-height:1.5;
    border-top:1px solid var(--line);padding-top:10px}
  .disc b{color:var(--l4)}
  .disc a{color:var(--l1)}

  /* ---------- popup ---------- */
  .maplibregl-popup-content{background:var(--panel-solid)!important;color:var(--fg);
    border:1px solid var(--line-strong);border-radius:13px;padding:13px 14px;
    box-shadow:0 14px 44px rgba(0,0,0,.6);font:13px/1.45 ui-sans-serif,system-ui,"Noto Sans Thai",sans-serif}
  .maplibregl-popup-tip{border-top-color:var(--panel-solid)!important;
    border-bottom-color:var(--panel-solid)!important}
  .maplibregl-popup-close-button{color:var(--dim);font-size:19px;padding:2px 7px}
  .pt{font-size:9.5px;font-weight:800;letter-spacing:.09em;padding:3px 8px;border-radius:999px;
    color:#fff;display:inline-block;margin-bottom:7px}
  .ph{font-weight:700;font-size:14px;margin-bottom:2px}
  .psub{color:var(--dim);font-size:11px;margin-bottom:8px}
  .pttb{font-size:13px;font-weight:700;color:var(--l4);margin:7px 0 2px}
  .pr{display:flex;justify-content:space-between;gap:14px;padding:3px 0;font-size:12px;
    border-top:1px solid var(--line)}
  .pr span:first-child{color:var(--dim)}
  .why{margin-top:9px;background:rgba(255,255,255,.045);border-radius:9px;padding:8px 10px}
  .why b{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--faint);margin-bottom:4px}
  .why li{font-size:11.5px;margin:3px 0 3px -14px;line-height:1.4}
  .why ul{margin:0;padding-left:16px}
  .conf{font-size:10px;color:var(--faint);margin-top:6px}

  .chk{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px;cursor:pointer;
    font-size:12.5px;user-select:none}
  .chk:active{background:rgba(255,255,255,.07)}
  .chk .box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-strong);
    flex:none;display:grid;place-items:center;font-size:11px;color:transparent;transition:.12s}
  .chk.on .box{background:var(--l1);border-color:var(--l1);color:#fff}
  .chk .dotc{width:8px;height:8px;border-radius:50%;flex:none;margin-left:auto}
  .chk.off{opacity:.45}
  .chk small{display:block;color:var(--faint);font-size:10px}

  /* radio tuner */
  #radio{position:absolute;z-index:6;left:10px;right:10px;
    bottom:calc(var(--sheet-collapsed) + 14px);margin:0 auto;max-width:520px;
    background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;
    padding:11px 13px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    display:none;box-shadow:0 10px 36px rgba(0,0,0,.6)}
  #radio.show{display:block}
  .rhead{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .rname{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .rmeta{font-size:10px;color:var(--faint)}
  .rplay{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-strong);
    background:rgba(255,255,255,.06);color:var(--fg);font-size:14px;cursor:pointer;flex:none}
  .rplay.playing{background:var(--l1);border-color:var(--l1)}
  /* the dial: stations laid out by distance from the map centre, swept like a tuner */
  .dial{position:relative;height:46px;border-radius:9px;overflow:hidden;cursor:ew-resize;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--line);touch-action:none}
  .dial canvas{display:block;width:100%;height:46px}
  .needle{position:absolute;top:0;bottom:0;width:2px;background:var(--l4);
    box-shadow:0 0 10px var(--l4);pointer-events:none}
  .rtip{font-size:10px;color:var(--faint);margin-top:6px;text-align:center}

  #degraded{position:absolute;z-index:7;left:10px;right:10px;
    top:calc(env(safe-area-inset-top,0px) + 50px);margin:0 auto;max-width:520px;
    background:rgba(60,20,10,.92);border:1px solid rgba(232,89,12,.5);color:#ffd9c2;
    border-radius:11px;padding:9px 12px;font-size:11.5px;display:none;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  #degraded.show{display:block}

  @media (min-width:760px){
    :root{--sheet-collapsed:74px}
    #sheet{left:10px;right:auto;bottom:10px;width:352px;border-radius:14px;
      border:1px solid var(--line-strong);max-height:calc(100vh - 86px)}
    #sheet.open{height:calc(100vh - 86px)}
    #sheetbody{max-height:calc(100vh - 104px)}
  }
  #livebar{margin:6px 0 2px}
  #livebtn{display:flex;align-items:center;gap:8px;width:100%;cursor:pointer;
    background:#171b21;border:1px solid #2a2f36;border-radius:8px;
    padding:8px 10px;color:#e8edf3;font:inherit;font-size:12px;text-align:left}
  #livebtn .box{width:15px;height:15px;border-radius:4px;border:1px solid #454c56;
    display:grid;place-items:center;font-size:10px;color:transparent;flex:none}
  #livebtn.on{border-color:#2f7d4a}
  #livebtn.on .box{background:#2f7d4a;border-color:#2f7d4a;color:#fff}
  #livebtn small{display:block;color:#8b949e;font-size:10.5px;line-height:1.35;margin-top:2px}
  #livebtn .pulse{width:7px;height:7px;border-radius:50%;background:#3fb950;flex:none;
    animation:lp 1.8s ease-in-out infinite}
  #livebtn.off .pulse{display:none}
  @keyframes lp{0%,100%{opacity:1}50%{opacity:.25}}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div class="brand"><span class="live" id="live"></span>SeRAPHIM</div>
  <div class="seg" id="view"><button data-v="th">TH</button><button data-v="gb">GB</button><button data-v="nl">NL</button><button data-v="us">US</button><button data-v="world">🌏</button></div>
  <div class="seg" id="lang"><button data-l="th">ไทย</button><button data-l="en">EN</button></div>
  <button class="btn" id="layersbtn">◈</button>
</div>

<div id="degraded"></div>

<div id="layers">
  <h4 id="h-base"></h4>
  <div class="opt" data-base="satellite"><span class="sw"></span><span id="o-sat"></span></div>
  <div class="opt" data-base="dark"><span class="sw"></span><span id="o-dark"></span></div>
  <div class="opt" data-base="light"><span class="sw"></span><span id="o-light"></span></div>
  <div class="opt" data-base="osm"><span class="sw"></span><span id="o-osm"></span></div>
  <h4 id="h-over"></h4>
  <div id="layerlist"></div>
  <div class="note" id="camnote"></div>
  <div class="note" id="credit"></div>
</div>

<div id="radio">
  <div class="rhead">
    <button class="rplay" id="rplay">▶</button>
    <div style="flex:1;min-width:0">
      <div class="rname" id="rname">-</div>
      <div class="rmeta" id="rmeta"></div>
    </div>
    <button class="btn" id="rclose">✕</button>
  </div>
  <div class="dial" id="dial"><canvas id="dialc"></canvas><div class="needle" id="needle"></div></div>
  <div class="rtip" id="rtip"></div>
</div>

<div id="sheet">
  <div id="grab"><i></i></div>
  <div id="sheetbody">
    <div class="stats" id="stats"></div>
    <div class="age" id="age"></div>
    <div id="livebar"></div>
    <div class="modes" id="modes"></div>
    <h5 id="h-legend"></h5>
    <div class="legend" id="legend"></div>
    <h5 id="h-acc"></h5>
  <div id="acc"></div>
  <h5 id="h-worst"></h5>
    <div class="worst" id="worst"></div>
    <div class="disc" id="disc"></div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>

const esc = (v)=>v==null?"":String(v).replace(/[&<>"']/g,(c)=>ESCAPES[c]);
const $=(id)=>document.getElementById(id);

/* ------------------------------------------------------------------ i18n */

    fish:"🎣 เวลาตกปลา", degraded:"ข้อมูลอาจไม่เป็นปัจจุบัน", offline:"ออฟไลน์ กำลังแสดงข้อมูลล่าสุดที่บันทึกไว้",

    fires_s:"ต้องใช้คีย์ NASA FIRMS", radio_s:"สถานีที่มีพิกัด",
    tune:"ลากเพื่อหมุนหาคลื่น · แตะหมุดวิทยุบนแผนที่",
    mag:"ขนาด", depth:"ความลึก", when:"เมื่อ", frp:"ความแรง", conf:"ความเชื่อมั่น",

    acc:"ความแม่นยำที่วัดได้", accnone:"ยังไม่มีข้อมูลพอจะวัด",

    acc_hit:"คำเตือนที่เป็นจริง", acc_at:"ที่ระยะ", worse:"แย่กว่าการเดาว่าไม่เปลี่ยน",
    events:"ภัยพิบัติทั่วโลก", events_s:"จาก GDACS", view:"มุมมอง",
    v_th:"ไทย", v_gb:"สหราชอาณาจักร", v_nl:"เนเธอร์แลนด์", v_us:"สหรัฐอเมริกา", v_world:"ทั่วโลก",
    live_on:"เชื่อมต่อสด", live_off:"ข้อมูลสด (ปิดอยู่)",

function ageText(min){
  if(min==null||isNaN(min)) return "-";
  if(min<90) return `${Math.round(min)} ${t("min")}`;
  const h=min/60;
  return h<48 ? `${h.toFixed(1)} ${t("hr")}` : `${(h/24).toFixed(1)} ${t("day")}`;
}
const fmt=(v,u="",d=2)=>(v==null||v===""||isNaN(v))?"-":`${Number(v).toFixed(d)}${u}`;

const j=(n)=>fetch(`${BASE}/${n}`,{cache:"no-cache"}).then(r=>r.json()).catch(()=>null);

/** Station and area data is split per country so adding a country costs existing
 *  readers nothing. A visitor downloads the one they are looking at, and others
 *  arrive only if they go there. */
const loaded={};
let index=null, country=(localStorage.getItem("seraphim_country")||"th");

async function loadCountry(cc){
  cc=cc.toLowerCase();
  if(loaded[cc]) return loaded[cc];
  const entry=(index?.countries||[]).find(c=>c.code.toLowerCase()===cc);
  if(!entry) return null;
  const [st,ar]=await Promise.all([
    j(entry.stations_file), entry.areas_file?j(entry.areas_file):Promise.resolve(null)]);
  if(!st) return null;
  loaded[cc]={stations:st, areas:ar?.areas||[]};
  return loaded[cc];
}

/** Merge everything fetched so far, so panning between countries adds rather than swaps. */
function mergedStations(){
  const features=[];
  for(const k of Object.keys(loaded)) features.push(...loaded[k].stations.features);
  return {type:"FeatureCollection", features};
}
function mergedAreas(){
  const out=[];
  for(const k of Object.keys(loaded)) out.push(...loaded[k].areas);
  out.sort((a,b)=>b.level-a.level
    || ((a.worst_ttb_hr??1e9)-(b.worst_ttb_hr??1e9)));
  return {areas:out};
}

/* ------------------------------------------------------- live refresh
 * Reads are static files on a CDN, and that is what makes a million map views cost
 * nothing. So "live" does NOT mean putting a server in front of the map: the browser
 * asks the agency directly, exactly as it already does for rain radar. Our origin
 * still serves nothing but files.
 *
 * Off by default and opt-in, because turning it on means this visitor's browser (and
 * IP) contacts a foreign government API, and spends a few hundred KB per refresh.
 * Nobody should pay either cost without choosing to.
 *
 * What a live reading may and may not change:
 *   - it replaces the LEVEL and its measured time, and recomputes freeboard, which is
 *     just bank minus level and therefore honest to derive in the browser;
 *   - it may ESCALATE a gauge to 5, because 5 means "water is over the bank now" and
 *     that is an observation, not a prediction;
 *   - it may NEVER de-escalate, because the snapshot's score can rest on a forecast,
 *     a tide window or a trend that this one reading knows nothing about;
 *   - it never rewrites the reasoning. The panel shows a live level beside a score
 *     stamped with the build it came from, rather than pretending they are one thing.
 *
 * The Netherlands is absent on purpose: Rijkswaterstaat sends no CORS header, so a
 * browser cannot read it. Saying so is better than a toggle that silently does nothing.
 */
const LIVE_SOURCES={
  th:{
    label:"ThaiWater (HII)",
    url:()=>"https://api-v3.thaiwater.net/api/v1/thaiwater30/public/waterlevel",
    parse:(d)=>{
      const out={};
      for(const row of (d&&d.data)||[]){
        const st=row.station||{};
        const id=st.id==null?null:String(st.id);
        const lv=Number(row.waterlevel_msl);
        if(id==null||!isFinite(lv)) continue;
        // Naive Bangkok wall-clock, exactly as the Python adapter treats it.
        const at=row.waterlevel_datetime
          ? Date.parse(String(row.waterlevel_datetime).replace(" ","T")+"+07:00") : NaN;
        out["thaiwater:"+id]={level:lv, at:isFinite(at)?at:null};
      }
      return out;
    }},
  gb:{
    label:"Environment Agency",
    url:()=>"https://environment.data.gov.uk/flood-monitoring/id/measures"
            +"?parameter=level&_limit=10000",
    parse:(d)=>{
      const UNITS={mASD:1,mAOD:1,m:1,mBDAT:1}, out={};
      for(const m of (d&&d.items)||[]){
        if(!UNITS[m.unitName]) continue;   // rainfall, flow and temperature are not levels
        const r=m.latestReading;
        if(!r||typeof r!=="object") continue;
        const lv=Number(r.value);
        let ref=m.stationReference;
        if(!ref&&typeof m.station==="string") ref=m.station.replace(/\/+$/,"").split("/").pop();
        if(!ref||!isFinite(lv)) continue;
        const at=Date.parse(r.dateTime);
        out["ukea:"+ref]={level:lv, at:isFinite(at)?at:null};
      }
      return out;
    }},
  us:{
    label:"NOAA / NWS",
    // Viewport-scoped: the US has 11,467 gauges and nobody is looking at all of them.
    // Zoomed out over the whole country the service caps a response at 10,000 rows and
    // flags `exceededTransferLimit`, so this pages rather than silently updating most
    // of the gauges in view and quietly leaving the rest on build-time numbers.
    fetch:async (b)=>{
      const base="https://mapservices.weather.noaa.gov/eventdriven/rest/services"
        +"/water/riv_gauges/MapServer/0/query?where=1%3D1"
        +"&outFields=gaugelid,observed,obstime,units,pedts&returnGeometry=false&f=json"
        +"&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects"
        +"&geometry="+[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()]
          .map(v=>v.toFixed(4)).join(",");
      const out={}, FT=0.3048, PAGE=10000;
      for(let page=0; page<3; page++){
        const r=await fetch(`${base}&resultOffset=${page*PAGE}&resultRecordCount=${PAGE}`,
          {cache:"no-store"});
        if(!r.ok) break;
        const d=await r.json();
        const feats=(d&&d.features)||[];
        for(const f of feats){
          const a=f.attributes||{};
          // Same refusal as the Python adapter: a height, in feet, or nothing.
          if(a.units!=="ft"||!String(a.pedts||"").startsWith("H")) continue;
          const lv=Number(a.observed);
          if(!a.gaugelid||!isFinite(lv)) continue;
          const at=a.obstime?Date.parse(String(a.obstime).replace(" ","T")+"Z"):NaN;
          out["nwsriv:"+a.gaugelid]={level:+(lv*FT).toFixed(3), at:isFinite(at)?at:null};
        }
        if(!d.exceededTransferLimit||!feats.length) break;
      }
      return out;
    }},
};

/** One reading set from whichever agency covers the country on screen. */
async function fetchLive(src){
  if(src.fetch) return await src.fetch(map.getBounds());
  const r=await fetch(src.url(map.getBounds()),{cache:"no-store"});
  if(!r.ok) return null;
  return src.parse(await r.json());
}

let liveOn = localStorage.getItem("seraphim_live")==="1";
let liveAt = null, liveFail = false, liveCount = 0, liveTimer = null;

function liveSource(){ return LIVE_SOURCES[country] || null; }

async function refreshLive(){
  const src=liveSource();
  if(!liveOn||!src||!map){ return; }
  let readings=null;
  try{ readings=await fetchLive(src); }catch{ readings=null; }
  if(!readings||!Object.keys(readings).length){
    // Keep the snapshot on screen and say the live fetch failed. Falling back quietly
    // to build-time data while a "live" badge pulses would be a lie.
    liveFail=true; renderChrome(); return;
  }
  liveFail=false; liveAt=Date.now(); liveCount=0;
  for(const f of gj.features){
    const hit=readings[f.properties.id];
    if(!hit) continue;
    const p=f.properties;
    if(p.snap_level===undefined){         // remember the build's own numbers once
      p.snap_level=p.level_msl; p.snap_level_at=p.observed_at||null;
      p.snap_risk=p.risk_level; p.snap_freeboard=p.freeboard_m;
    }
    p.live_level=hit.level; p.live_at=hit.at; p.live=true;
    p.level_msl=hit.level;
    if(hit.at!=null){
      p.data_age_min=Math.max(0,(Date.now()-hit.at)/60000);
      // A gauge that was stale at build time but is reporting now is not stale.
      // The reverse also holds, and matters more: one that has fallen silent since
      // must start looking silent.
      p.stale = p.data_age_min > 180;
    }
    liveCount++;
    const bank=p.bank_msl==null?null:Number(p.bank_msl);
    if(bank!=null&&isFinite(bank)){
      p.freeboard_m=+(bank-hit.level).toFixed(3);
      // Escalate only. 5 is an observed fact; anything lower may rest on a forecast
      // or a tide window that this single reading cannot see.
      if(p.freeboard_m<=0){
        p.live_over_bank = Number(p.snap_risk)<5;
        p.risk_level=5;
      }
    }
  }
  if(map.getSource("st")) map.getSource("st").setData(gj);
  renderChrome();
}

/** Put every gauge back to exactly what the build published. */
function clearLive(){
  for(const f of gj.features){
    const p=f.properties;
    if(p.snap_level===undefined) continue;
    p.level_msl=p.snap_level; p.risk_level=p.snap_risk; p.freeboard_m=p.snap_freeboard;
    delete p.live; delete p.live_level; delete p.live_at; delete p.live_over_bank;
  }
  liveAt=null; liveFail=false; liveCount=0;
  if(map&&map.getSource("st")) map.getSource("st").setData(gj);
}

function setLive(on){
  liveOn=on;
  localStorage.setItem("seraphim_live", on?"1":"0");
  if(liveTimer){ clearInterval(liveTimer); liveTimer=null; }
  if(on){
    refreshLive();
    liveTimer=setInterval(refreshLive, 120000);
  } else {
    clearLive();
  }
  renderChrome();
}

function renderLiveBar(){
  const src=liveSource(), el=$("livebar");
  if(!el) return;
  if(!src){
    el.innerHTML=`<button id="livebtn" class="off" disabled style="opacity:.55">
      <span class="box"></span><span>${esc(t("live_na"))}</span></button>`;
    return;
  }
  const sub = !liveOn ? t("live_hint")
    : liveFail ? t("live_fail")
    : `${t("live_src")}: ${src.label}`
      + (liveAt?` · ${ageText((Date.now()-liveAt)/60000)} ${t("ago")}`:"")
      + (liveCount?` · ${liveCount} ${t("gauges")}`:"");
  el.innerHTML=`<button id="livebtn" class="${liveOn?"on":"off"}">
    <span class="box">✓</span><span class="pulse"></span>
    <span>${esc(liveOn?t("live_on"):t("live_off"))}<small>${esc(sub)}</small></span>
  </button>`;
  const b=$("livebtn");
  if(b) b.onclick=()=>setLive(!liveOn);
}

async function load(){
  index = await j("index.json");
  const first = await loadCountry(country) || await loadCountry("th");
  if(!first) return false;
  gj = mergedStations();
  areas = mergedAreas();
  // Province shapes and tide points exist only for Thailand, so they are not part of
  // what every visitor pays for.
  [meta,quakes,fires,events,terrain,dams]=await Promise.all([
    j("meta.json"), j("quakes.geojson"), j("fires.geojson"), j("events.geojson"),
    j("terrain.geojson"), j("dams.geojson")]);
  if(country==="th"||loaded.th){
    [tide,provinces]=await Promise.all([j("tide.json"), j("provinces.geojson")]);
  }
  return !!gj;
}

function addLayers(){
  if(provinces && !map.getSource("prov")){
    map.addSource("prov",{type:"geojson",data:provinces});
    map.addLayer({id:"prov-fill",type:"fill",source:"prov",paint:{
      "fill-color":["case",["==",["get","level"],null],"#2a2f36",
        ["==",["get","level"],5],RISK[5],["==",["get","level"],4],RISK[4],
        ["==",["get","level"],3],RISK[3],["==",["get","level"],2],RISK[2],RISK[1]],
      "fill-opacity":["case",["==",["get","level"],null],.10,
        [">=",["get","level"],4],.34,[">=",["get","level"],3],.26,.15]}});
    map.addLayer({id:"prov-line",type:"line",source:"prov",paint:{
      "line-color":["case",[">=",["coalesce",["get","level"],0],4],RISK[5],"rgba(255,255,255,.28)"],
      "line-width":["case",[">=",["coalesce",["get","level"],0],4],1.6,.6]}});
  }
  if(!map.getSource("st")){
    map.addSource("st",{type:"geojson",data:gj});
    // A soft halo under a hard core: reads as a signal on a photo basemap, where a
    // flat dot disappears against terrain.
    map.addLayer({id:"st-glow",type:"circle",source:"st",paint:{
      "circle-color":modeColor(),"circle-blur":1,
      "circle-radius":["interpolate",["linear"],["zoom"],4,["case",modeBig(),9,3],
        9,["case",modeBig(),20,7],13,["case",modeBig(),32,13]],
      "circle-opacity":["case",["get","stale"],.18,.45]}});
    map.addLayer({id:"st-core",type:"circle",source:"st",paint:{
      "circle-color":modeColor(),
      "circle-radius":["interpolate",["linear"],["zoom"],4,["case",modeBig(),3.6,2.1],
        9,["case",modeBig(),7.5,4.4],13,["case",modeBig(),12,8]],
      "circle-stroke-width":["case",["get","stale"],1,.9],

/* ---------- rain radar (RainViewer, animated) ---------- */
async function initRadar(){
  const idx=await fetch("https://api.rainviewer.com/public/weather-maps.json")
    .then(r=>r.json()).catch(()=>null);
  if(!idx||!idx.radar?.past?.length) return;
  radarFrames=[...idx.radar.past, ...(idx.radar.nowcast||[])]
    .map(f=>`${idx.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`);
  radarIdx=idx.radar.past.length-1;
  map.addSource("radar",{type:"raster",tiles:[radarFrames[radarIdx]],tileSize:256,
    attribution:"Radar © RainViewer"});
  // Under the markers: weather is context, the gauges are the point.
  const before=map.getLayer("prov-fill")?"prov-fill":undefined;
  map.addLayer({id:"radar-r",type:"raster",source:"radar",
    paint:{"raster-opacity":.6}},before);
  applyVisibility();
  startRadar();
}
function startRadar(){
  clearInterval(radarTimer);
  radarTimer=setInterval(()=>{
    if(!shown.radar||!radarFrames.length||!map.getSource("radar")) return;
    radarIdx=(radarIdx+1)%radarFrames.length;
    map.getSource("radar").setTiles([radarFrames[radarIdx]]);
  },900);
}

function modeColor(){
  if(mode==="risk") return ["case",["==",["get","risk_level"],null],"#6b7280",
    ["==",["get","risk_level"],5],RISK[5],["==",["get","risk_level"],4],RISK[4],
    ["==",["get","risk_level"],3],RISK[3],["==",["get","risk_level"],2],RISK[2],RISK[1]];
  if(mode==="level") return ["case",["get","stale"],"#6b7280",
    ["==",["get","freeboard_m"],null],"#6b7280",["<=",["get","freeboard_m"],0],RISK[5],
    ["<",["get","freeboard_m"],.5],RISK[3],["<",["get","freeboard_m"],1.5],RISK[2],RISK[1]];
  if(mode==="rain") return ["case",["==",["get","rain_next_24h_mm"],null],"#6b7280",
    [">=",["get","rain_next_24h_mm"],90],"#a855f7",[">=",["get","rain_next_24h_mm"],50],RISK[5],
    [">=",["get","rain_next_24h_mm"],20],RISK[3],[">=",["get","rain_next_24h_mm"],5],RISK[2],"#0ea5e9"];
  return ["case",["==",["get","discharge_rise_ratio"],null],"#6b7280",
    [">=",["get","discharge_rise_ratio"],4],RISK[5],[">=",["get","discharge_rise_ratio"],2],RISK[3],
    [">=",["get","discharge_rise_ratio"],1.2],RISK[2],RISK[1]];
}
function modeBig(){
  if(mode==="risk") return [">=",["coalesce",["get","risk_level"],0],4];
  if(mode==="level") return ["<=",["coalesce",["get","freeboard_m"],99],0];
  if(mode==="rain") return [">=",["coalesce",["get","rain_next_24h_mm"],0],50];
  return [">=",["coalesce",["get","discharge_rise_ratio"],0],2];
}
function repaint(){
  if(!map.getLayer("st-core")) return;
  for(const id of ["st-glow","st-core"]) map.setPaintProperty(id,"circle-color",modeColor());
  map.setPaintProperty("st-glow","circle-radius",["interpolate",["linear"],["zoom"],
    4,["case",modeBig(),9,3],9,["case",modeBig(),20,7],13,["case",modeBig(),32,13]]);
  map.setPaintProperty("st-core","circle-radius",["interpolate",["linear"],["zoom"],
    4,["case",modeBig(),3.6,2.1],9,["case",modeBig(),7.5,4.4],13,["case",modeBig(),12,8]]);
}
/** Slow breathing on the glow. Draws the eye to the worst places without motion sickness. */
function pulse(){
  let k=0;
  setInterval(()=>{
    if(!map.getLayer("st-glow")||!shown.stations) return;
    k+=0.045;
    const o=.34+Math.sin(k)*0.16;
    map.setPaintProperty("st-glow","circle-opacity",["case",["get","stale"],.15,o]);
  },70);
}
/* ---------- geolocated world radio, with an analog tuner ----------
 * Idea borrowed from bilawalsidhu/gods-eye-view (MIT), which pairs Radio Browser with
 * a map. The dial here is ordered by distance from wherever you are looking, so
 * sweeping it walks outward from the middle of the screen rather than through a list.
 * Only HTTPS streams are kept: an http stream on an https page is blocked as mixed
 * content, so offering one would just be a button that silently does nothing.
 */
async function initRadio(){
  const r=await fetch("https://de1.api.radio-browser.info/json/stations/search"
    +"?has_geo_info=true&hidebroken=true&limit=800&order=clickcount&reverse=true",
    {headers:{"Content-Type":"application/json"}}).then(x=>x.json()).catch(()=>null);
  if(!Array.isArray(r)) return;
  radioAll=r.filter(x=>x.geo_lat&&x.geo_long&&(x.url_resolved||"").startsWith("https"))
    .map(x=>({name:x.name.trim(),url:x.url_resolved,cc:x.countrycode,
              lat:+x.geo_lat,lon:+x.geo_long,bitrate:x.bitrate,tags:(x.tags||"").split(",")[0]}));
  if(!radioAll.length) return;

  map.addSource("radio",{type:"geojson",data:{type:"FeatureCollection",
    features:radioAll.map((x,i)=>({type:"Feature",
      geometry:{type:"Point",coordinates:[x.lon,x.lat]},properties:{i,name:x.name,cc:x.cc}}))}});
  map.addLayer({id:"radio-c",type:"circle",source:"radio",paint:{
    "circle-color":"#a78bfa","circle-radius":["interpolate",["linear"],["zoom"],3,2.2,8,5,13,8],
    "circle-opacity":.85,"circle-stroke-width":1,"circle-stroke-color":"rgba(255,255,255,.65)"}});
  map.on("click","radio-c",e=>{
    const i=e.features[0].properties.i;
    refreshDial(); 
    const k=radioNear.findIndex(x=>x===radioAll[i]);
    tuneTo(k>=0?k:0, true);
    $("radio").classList.add("show");
  });
  map.on("mouseenter","radio-c",()=>map.getCanvas().style.cursor="pointer");
  map.on("mouseleave","radio-c",()=>map.getCanvas().style.cursor="");
  applyVisibility();
}

function km(a,b,c,d){
  const R=6371,r=Math.PI/180;
  const dp=(c-a)*r, dl=(d-b)*r;
  const x=Math.sin(dp/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function refreshDial(){
  if(!radioAll.length) return;
  const c=map.getCenter();
  radioNear=[...radioAll].sort((x,y)=>km(c.lat,c.lng,x.lat,x.lon)-km(c.lat,c.lng,y.lat,y.lon))
    .slice(0,40);
  drawDial();
}
function drawDial(){
  const cv=$("dialc"); if(!cv) return;
  const w=cv.clientWidth||320, h=46;
  cv.width=w*devicePixelRatio; cv.height=h*devicePixelRatio;
  const g=cv.getContext("2d"); g.scale(devicePixelRatio,devicePixelRatio);
  g.clearRect(0,0,w,h);
  g.strokeStyle="rgba(255,255,255,.16)"; g.lineWidth=1;
  radioNear.forEach((st,i)=>{
    const x=((i+0.5)/radioNear.length)*w;
    const major=i%5===0;
    g.beginPath(); g.moveTo(x, major?10:18); g.lineTo(x, h-12); g.stroke();
    if(major){
      g.fillStyle="rgba(255,255,255,.45)"; g.font="8px ui-monospace,monospace";
      g.fillText(st.cc||"", x-6, h-3);
    }
  });
  const nx=((radioIdx+0.5)/Math.max(radioNear.length,1))*w;
  $("needle").style.left=`${nx}px`;
}
function tuneTo(i, play){
  if(!radioNear.length) return;
  radioIdx=Math.max(0,Math.min(radioNear.length-1,i));
  const st=radioNear[radioIdx];
  $("rname").textContent=st.name;
  const c=map.getCenter();
  $("rmeta").textContent=`${st.cc||"?"} · ${st.bitrate||"?"} kbps · ${Math.round(km(c.lat,c.lng,st.lat,st.lon))} km`
    + (st.tags?` · ${st.tags}`:"");
  drawDial();
  if(play) playRadio(st);
  else if(audio&&!audio.paused) playRadio(st);
}
function playRadio(st){
  if(!audio){ audio=new Audio(); audio.crossOrigin="anonymous"; }
  audio.src=st.url; audio.play().then(()=>{
    $("rplay").textContent="⏸"; $("rplay").classList.add("playing");
  }).catch(()=>{
    // Dead streams are common in a crowd-sourced directory. Say so instead of
    // leaving a play button that does nothing.
    $("rplay").textContent="▶"; $("rplay").classList.remove("playing");
    $("rmeta").textContent="stream unavailable";
  });
}

function applyVisibility(){
  const set=(id,on)=>{ if(map.getLayer(id)) map.setLayoutProperty(id,"visibility",on?"visible":"none"); };
  set("prov-fill",shown.provinces); set("prov-line",shown.provinces);
  set("st-glow",shown.stations); set("st-core",shown.stations);
  set("tide-c",shown.tide);
  set("radar-r",shown.radar);
  set("quake-c",shown.quakes);
  set("fire-c",shown.fires);
  set("radio-c",shown.radio);
  set("event-c",shown.events);
  set("terrain-c",shown.terrain);
  set("dams-c",shown.dams);
  $("radio").classList.toggle("show",shown.radio);
  if(shown.radio&&!radioNear.length) refreshDial();
  if(!shown.radio&&audio){ audio.pause(); $("rplay").textContent="▶";
    $("rplay").classList.remove("playing"); }
}

    <div class="pr"><span>${esc(over?t("above"):t("fb"))}</span><span class="num" style="color:${over?RISK[5]:"inherit"}">${fb===null?"-":fmt(Math.abs(fb)," m")}</span></div>

    ${p.live_over_bank?`<div class="pttb">⚠ ${esc(t("live_new"))}</div>`:""}
    ${p.live?`<div class="conf">${esc(t("live_note"))}</div>`:""}`)
    .addTo(map);

function tidePopup(e){
  const p=e.features[0].properties;
  let next=[]; try{ next=JSON.parse(p.next||"[]"); }catch{}
  const rows=next.slice(0,4).map(x=>{
    const d=new Date(x.at).toLocaleString(LANG==="th"?"th-TH":"en-GB",
      {timeZone:"Asia/Bangkok",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
    return `<div class="pr"><span>${esc(x.kind==="high"?t("hi"):t("lo"))}</span>
      <span class="num">${esc(d)} · ${x.height_m>=0?"+":""}${x.height_m} m</span></div>`;
  }).join("");
  new maplibregl.Popup({maxWidth:"290px"}).setLngLat(e.lngLat).setHTML(`
    <div class="ph">${esc(loc(p,"name"))}</div>
    <div class="psub">${esc(t("tidestate"))}: ${esc(p.state)} · ${p.rate_m_per_hr} m/h · ${p.range_today_m} m</div>
    ${rows||`<div class="pr"><span>${esc(t("nodata"))}</span></div>`}`).addTo(map);
}

/* ------------------------------------------------------------------ chrome */
function renderChrome(){
  document.documentElement.lang=LANG;
  $("h-base").textContent=t("base"); $("h-over").textContent=t("over");
  $("o-sat").textContent=t("sat"); $("o-dark").textContent=t("dark");
  $("o-light").textContent=t("light"); $("o-osm").textContent=t("osm");
  $("camnote").textContent=t("camnote")+(fires?"":" "+t("nofires"));
  $("credit").textContent=t("credit");
  $("rtip").textContent=t("tune");

  // Tick boxes rather than pills: the user asked to "tick to show and unshow", and a
  // checkbox says what it does without having to be learned.
  const have={fires:!!fires, terrain:!!terrain, dams:!!dams};
  $("layerlist").innerHTML=LAYERS.filter(l=>!l.optional||have[l.id]).map(l=>`
    <div class="chk${shown[l.id]?" on":" off"}" data-layer="${l.id}">
      <span class="box">✓</span>
      <span>${esc(t(l.label))}${l.sub?`<small>${esc(t(l.sub))}</small>`:""}</span>
      <span class="dotc" style="background:${l.colour}"></span>
    </div>`).join("");
  document.querySelectorAll("[data-layer]").forEach(el=>el.onclick=()=>{
    shown[el.dataset.layer]=!shown[el.dataset.layer]; applyVisibility(); renderChrome();
  });
  $("h-legend").textContent=t("legend"); $("h-worst").textContent=t("worst");
  $("h-acc").textContent=t("acc");
  renderAccuracy();
  renderLiveBar();
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG));
  document.querySelectorAll("#view button").forEach(b=>b.classList.toggle("on",b.dataset.v===country));
  $("o-osm") && null;
  document.querySelectorAll("[data-base]").forEach(el=>el.classList.toggle("on",el.dataset.base===basemap));

  const c=meta?.counts??{}, r=meta?.risk??{};
  $("stats").innerHTML=`
    <div class="stat"><b class="num">${c.stations??"-"}</b><i>${esc(t("total"))}</i></div>
    <div class="stat"><b class="num" style="color:${RISK[5]}">${c.at_or_over_bank??"-"}</b><i>${esc(t("over_bank"))}</i></div>
    <div class="stat"><b class="num" style="color:${RISK[4]}">${r.soonest_to_bank_hr!=null?r.soonest_to_bank_hr+t("hr"):"-"}</b><i>${esc(t("soon"))}</i></div>`;

  $("modes").innerHTML=[["risk","m_risk"],["level","m_level"],["rain","m_rain"],["discharge","m_dis"]]
    .map(([k,l])=>`<button class="btn${mode===k?" on":""}" data-mode="${k}">${esc(t(l))}</button>`).join("");
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
    mode=b.dataset.mode; repaint(); renderChrome(); });

  const L=mode==="risk"
    ? [[RISK[5],"5 "+t("r5")],[RISK[4],"4 "+t("r4")],[RISK[3],"3 "+t("r3")],[RISK[2],"2 "+t("r2")],[RISK[1],"1 "+t("r1")]]
    : mode==="level" ? [[RISK[5],"≤0 m"],[RISK[3],"<0.5 m"],[RISK[2],"0.5-1.5 m"],[RISK[1],">1.5 m"]]
    : mode==="rain" ? [["#a855f7","≥90 mm"],[RISK[5],"50-90"],[RISK[3],"20-50"],[RISK[2],"5-20"],["#0ea5e9","<5"]]
    : [[RISK[5],"≥4x"],[RISK[3],"2-4x"],[RISK[2],"1.2-2x"],[RISK[1],"-"]];
  $("legend").innerHTML=L.map(([c2,l])=>`<div><span class="d" style="background:${c2}"></span>${esc(l)}</div>`).join("");

  const top=(areas?.areas||[]).filter(a=>a.level>=3).slice(0,8);
  $("worst").innerHTML=top.length?top.map((a,i)=>
    `<a data-i="${i}"><span class="lv" style="background:${RISK[a.level]}">${a.level}</span>
     <span class="t">${esc(a.district)||"-"}, ${esc(a.province)||"-"}${a.country&&a.country!=="TH"?` <span style="color:var(--faint)">${esc(a.country)}</span>`:""}</span>
     ${a.worst_ttb_hr!=null?`<span class="ttb num">${a.worst_ttb_hr}${esc(t("hr"))}</span>`:""}</a>`).join("")
    : `<div style="font-size:12px;color:var(--faint);padding:6px 0">${esc(t("none"))}</div>`;
  document.querySelectorAll("#worst a").forEach(el=>el.onclick=()=>{
    const a=top[+el.dataset.i];
    const f=(gj?.features||[]).find(x=>x.properties.province===a.province
      && x.properties.district===a.district && x.properties.risk_level===a.level);
    if(f){ map.flyTo({center:f.geometry.coordinates,zoom:11}); $("sheet").classList.remove("open"); }
  });

  $("disc").innerHTML=t("disc")+` · <a href="./fish.html">${esc(t("fish"))}</a>`;
  renderAge();
}

/* The prediction should carry its own track record. A confident red "3.1 h to bank"
   with nothing behind it invites more trust than it has earned. */
function renderAccuracy(){
  const v=meta?.validation;
  const el=$("acc");
  if(!v){ el.innerHTML=`<div style="font-size:11.5px;color:var(--faint)">${esc(t("accnone"))}</div>`; return; }
  const skill=v.skill_vs_persistence;
  const good=skill!=null&&skill>0;
  const pct=skill==null?null:Math.round(Math.abs(skill)*100);
  el.innerHTML=`
    <div class="legend" style="margin-bottom:4px">
      <div><span class="d" style="background:${good?"#3fb950":"#e5484d"}"></span>
        ${esc(t("acc_err"))} ±${v.median_error_m} m ${esc(t("acc_at"))} ${v.lead_hours}h</div>
      ${pct==null?"":`<div><span class="d" style="background:${good?"#3fb950":"#e5484d"}"></span>
        ${pct}% ${esc(good?t("acc_skill"):t("worse"))}</div>`}
      ${v.hit_rate==null?"":`<div><span class="d" style="background:#d99e0b"></span>
        ${Math.round(v.hit_rate*100)}% ${esc(t("acc_hit"))}</div>`}
    </div>
    <div style="font-size:10px;color:var(--faint);line-height:1.4">${esc(v.note)} · n=${v.samples}</div>`;
}

function renderAge(){
  const gen=meta?.generated_at?new Date(meta.generated_at):null;
  const mins=gen?(Date.now()-gen.getTime())/60000:null;
  const med=meta?.data_age_minutes?.median;
  const dot=$("live");
  dot.className="live"+(mins==null||mins>180?" dead":mins>75?" stale":"");
  $("age").textContent = gen
    ? `${t("updated")} ${ageText(mins)} ${t("ago")} · ${t("median")} ${ageText(med)}`
    : t("nodata");

  const limit=meta?.health?.snapshot_stale_after_minutes??90;
  const bad=!navigator.onLine||(mins!=null&&mins>limit)||(meta?.health?.status&&meta.health.status!=="pass");
  const el=$("degraded");
  el.classList.toggle("show",!!bad);
  if(bad){
    const why = !navigator.onLine
      ? t("offline")
      : (meta?.health?.checks||[]).filter(c=>c.status!=="pass")
          .map(c=>c.detail).join(" · ");
    el.innerHTML=`<b>⚠ ${esc(t("degraded"))}</b>` + (why?`<br>${esc(why)}`:"");
  }
}

/* ------------------------------------------------------------------ boot */
function setBasemap(name){
  basemap=name;
  const s=STYLES[name]();
  map.setStyle(s);
  map.once("styledata",()=>{ addLayers(); });
  renderChrome();
}

(async function(){
  if(!(await load())){
    $("degraded").classList.add("show");
    $("degraded").innerHTML=`<b>⚠ ${esc(t("degraded"))}</b>`;
    return;
  }
  const v0=VIEWS[country]||VIEWS.th;
  map=new maplibregl.Map({container:"map",style:satelliteStyle(),
    center:v0.center,zoom:v0.zoom,attributionControl:false,
    maxZoom:16,minZoom:3});
  map.addControl(new maplibregl.AttributionControl({compact:true,
    customAttribution:"ThaiWater (HII) · UK Environment Agency (OGL) · "
      +"Rijkswaterstaat · NOAA/NWS · Open-Meteo (CC-BY 4.0) · USGS · RainViewer · Radio Browser · "
      +"layers inspired by gods-eye-view (MIT) · SeRAPHIM AGPL-3.0"}));
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),"bottom-right");
  map.addControl(new maplibregl.GeolocateControl({trackUserLocation:true}),"bottom-right");
  map.on("load",()=>{ addLayers(); renderChrome(); });

  $("grab").onclick=()=>$("sheet").classList.toggle("open");
  $("stats").onclick=()=>$("sheet").classList.toggle("open");
  $("layersbtn").onclick=e=>{ e.stopPropagation(); $("layers").classList.toggle("show"); };
  document.addEventListener("click",e=>{
    if(!$("layers").contains(e.target)&&e.target!==$("layersbtn")) $("layers").classList.remove("show");
  });
  document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>{
    LANG=b.dataset.l; localStorage.setItem("seraphim_lang",LANG); renderChrome();
  });
  document.querySelectorAll("#view button").forEach(b=>b.onclick=async ()=>{
    const v=VIEWS[b.dataset.v];
    if(b.dataset.v!=="world"){
      country=b.dataset.v;
      localStorage.setItem("seraphim_country",country);
      const got=await loadCountry(country);
      if(got){
        gj=mergedStations(); areas=mergedAreas();
        if(map.getSource("st")) map.getSource("st").setData(gj);
        if(country==="th"&&!provinces){
          [tide,provinces]=await Promise.all([j("tide.json"), j("provinces.geojson")]);
          addLayers();
        }
      }
    }
    // The world view is about events, not gauges, so it turns the right things on.
    if(b.dataset.v==="world"){ shown.events=true; shown.quakes=true; shown.provinces=false; }
    else { shown.provinces = b.dataset.v==="th"; }
    applyVisibility();
    map.flyTo({center:v.center, zoom:v.zoom});
    $("sheet").classList.remove("open");
    // Each country is live against a different agency, and one of them (NL) has none.
    // Re-arm rather than leave a pulsing badge describing the country we just left.
    if(liveOn) setLive(true); else renderChrome();
  });
  document.querySelectorAll("[data-base]").forEach(el=>el.onclick=()=>setBasemap(el.dataset.base));

  $("rclose").onclick=()=>{ shown.radio=false; applyVisibility(); renderChrome(); };
  $("rplay").onclick=()=>{
    if(!radioNear.length) refreshDial();
    if(audio&&!audio.paused){ audio.pause(); $("rplay").textContent="▶";
      $("rplay").classList.remove("playing"); }
    else playRadio(radioNear[radioIdx]);
  };
  // Drag the dial like a tuner; also works as a tap anywhere along it.
  let dragging=false;
  const dialPick=(clientX)=>{
    const r=$("dial").getBoundingClientRect();
    const f=Math.max(0,Math.min(1,(clientX-r.left)/r.width));
    tuneTo(Math.floor(f*radioNear.length), false);
  };
  $("dial").addEventListener("pointerdown",e=>{dragging=true;$("dial").setPointerCapture(e.pointerId);dialPick(e.clientX);});
  $("dial").addEventListener("pointermove",e=>{ if(dragging) dialPick(e.clientX); });
  $("dial").addEventListener("pointerup",e=>{ dragging=false; playRadio(radioNear[radioIdx]); });
  map.on("moveend",()=>{
    if(shown.radio) refreshDial();
    // The US feed is scoped to the viewport, so panning is what changes the answer.
    // Debounced, because moveend fires on every flick.
    if(liveOn && liveSource() && country==="us"){
      clearTimeout(window.__liveMove);
      window.__liveMove=setTimeout(refreshLive, 1200);
    }
  });
  // Resume only if this visitor turned it on before. The default stays off.
  if(liveOn) setLive(true); else renderLiveBar();
  window.addEventListener("resize",()=>{ if(shown.radio) drawDial(); });
  window.addEventListener("online",renderAge);
  window.addEventListener("offline",renderAge);

  // Poll for a newer snapshot and swap the data in place, so a phone left open on a
  // windowsill keeps up without anyone reloading it.
  setInterval(async ()=>{
    const m=await fetch(`${BASE}/meta.json`,{cache:"no-cache"}).then(r=>r.json()).catch(()=>null);
    if(m && m.generated_at !== meta?.generated_at){
      for(const k of Object.keys(loaded)) delete loaded[k];
      await load();
      if(map.getSource("st")) map.getSource("st").setData(gj);
      // A new snapshot replaces every feature object, so the live overlay has to be
      // laid back over it or the map would silently revert to build-time levels.
      if(liveOn) refreshLive();
      if(map.getSource("prov")&&provinces) map.getSource("prov").setData(provinces);
      if(map.getSource("quakes")&&quakes) map.getSource("quakes").setData(quakes);
      if(map.getSource("fires")&&fires) map.getSource("fires").setData(fires);
      if(map.getSource("events")&&events) map.getSource("events").setData(events);
      if(map.getSource("terrain")&&terrain) map.getSource("terrain").setData(terrain);
      if(map.getSource("dams")&&dams) map.getSource("dams").setData(dams);
      renderChrome();
    } else { renderAge(); }
  },60000);

  // Register, then immediately ask the browser to re-check sw.js. Without the update()
  // the worker script is itself subject to the CDN's 10-minute cache, so a deploy can
  // keep serving the previous worker, which is a confusing way to conclude that a push
  // did not land.
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js")
      .then(r=>{ r.update(); })
      .catch(()=>{});
  }
})();
</script>
