<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SeRAPHIM — เฝ้าระวังน้ำ / Water Watch</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root{
    --bg:#f6f7f9; --fg:#12161c; --muted:#5b6672; --line:#dde3ea; --card:#fff;
    --over:#c2182b; --high:#e8590c; --mid:#c99a06; --ok:#1c7ed6; --stale:#8b97a3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:14px/1.5 system-ui,-apple-system,"Noto Sans Thai",sans-serif;
    color:var(--fg);background:var(--bg)}
  #map{position:absolute;inset:0}
  .panel{position:absolute;z-index:2;background:var(--card);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 2px 12px rgba(16,24,40,.10)}
  #hud{top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;width:min(330px,calc(100vw - 20px));padding:12px 14px}
  h1{margin:0;font-size:15px;letter-spacing:.02em}
  h1 span{color:var(--muted);font-weight:400}
  .sub{color:var(--muted);font-size:11.5px;margin:2px 0 10px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
  .stat b{display:block;font-size:19px;line-height:1.15;font-variant-numeric:tabular-nums}
  .stat i{font-style:normal;color:var(--muted);font-size:10.5px}
  .age{display:flex;align-items:center;gap:7px;font-size:12px;padding:7px 9px;border-radius:7px;
    background:#eef6ff;border:1px solid #cfe3f8}
  .age.warn{background:#fff6e6;border-color:#ffd8a8}
  .age.bad{background:#ffeceb;border-color:#ffc9c9}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
  .age.warn .dot{background:var(--high)} .age.bad .dot{background:var(--over)}
  .legend{margin-top:10px;border-top:1px solid var(--line);padding-top:9px;
    display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted)}
  .legend div{display:flex;align-items:center;gap:7px}
  .sw{width:11px;height:11px;border-radius:50%;border:1.5px solid rgba(0,0,0,.25);flex:none}
  #degraded{position:absolute;z-index:4;left:10px;right:10px;
    top:calc(env(safe-area-inset-top,0px) + 10px);margin:0 auto;max-width:640px;
    padding:10px 13px;font-size:12.5px;background:#fff6e6;border:1px solid #ffd8a8;
    color:#7a4a00;border-radius:10px;display:none}
  #degraded.show{display:block}
  #degraded b{color:#a15c00}
  #alert{position:absolute;z-index:3;left:10px;right:10px;
    bottom:calc(env(safe-area-inset-bottom,0px) + 10px);margin:0 auto;max-width:640px;
    padding:9px 12px;font-size:12px;background:#fff8f8;border:1px solid #ffc9c9;color:#8b1a1a}
  #alert b{color:var(--over)}
  .maplibregl-popup-content{font:13px/1.45 system-ui,"Noto Sans Thai",sans-serif;padding:11px 13px;border-radius:9px}
  .pop-h{font-weight:600;margin-bottom:5px}
  .pop-r{display:flex;justify-content:space-between;gap:14px;padding:2px 0;border-top:1px solid #f0f2f5}
  .pop-r span:first-child{color:var(--muted)}
  .pop-r span:last-child{font-variant-numeric:tabular-nums;font-weight:500}
  .tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;color:#fff;margin-bottom:5px}
  .modes{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 0}
  .modes button{flex:1 1 46%;padding:6px 4px;font:inherit;font-size:11px;cursor:pointer;
    background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--muted);line-height:1.25}
  .modes button.on{background:var(--fg);border-color:var(--fg);color:#fff;font-weight:600}
  .modes button:hover:not(.on){border-color:var(--muted)}
  #tidebar{position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;
    width:min(232px,calc(100vw - 20px));padding:10px 12px;display:none}
  #tidebar.show{display:block}
  #tidebar h2{margin:0 0 2px;font-size:12.5px}
  #tidebar .sub{margin:0 0 8px}
  .tide-row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:12px;
    border-top:1px solid #f0f2f5}
  .tide-row b{font-variant-numeric:tabular-nums;font-weight:600}
  .hi{color:#0b5ed7} .lo{color:#8a6d00}
  .worst{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  .worst h3{margin:0 0 5px;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em}
  .worst a{display:flex;align-items:center;gap:7px;padding:3px 0;cursor:pointer;
    font-size:12px;color:inherit;text-decoration:none}
  .worst a:hover{color:var(--over)}
  .lv{width:17px;height:17px;border-radius:5px;display:grid;place-items:center;
    font-size:10px;font-weight:700;color:#fff;flex:none}
  .why{margin:7px 0 0;padding:7px 9px;background:var(--bg);border-radius:7px;
    border:1px solid var(--line)}
  .why b{display:block;font-size:10.5px;color:var(--muted);margin-bottom:3px;
    letter-spacing:.03em;font-weight:600}
  .why li{margin:2px 0 2px -12px;font-size:12px;line-height:1.4}
  .why ul{margin:0;padding-left:16px}
  .ttb{font-size:13px;font-weight:600;color:var(--over);margin:5px 0 0}
  .conf{font-size:10.5px;color:var(--muted);margin-top:4px}
  .pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;
    background:var(--bg);border:1px solid var(--line);color:var(--muted)}
  @media (max-width:520px){
    #hud{padding:10px 11px} .stat b{font-size:17px}
    #tidebar{position:static;width:auto;margin:10px 10px 0;display:none}
    #tidebar.show{display:block}
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="hud" class="panel">
  <h1>SeRAPHIM <span>· เฝ้าระวังน้ำ</span></h1>
  <div class="sub">ระดับน้ำจากสถานีโทรมาตร · Live river gauges, Thailand</div>
  <div class="stats">
    <div class="stat"><b id="s-total">–</b><i>สถานี / stations</i></div>
    <div class="stat"><b id="s-over" style="color:var(--over)">–</b><i>ล้นตลิ่ง / over bank</i></div>
    <div class="stat"><b id="s-stale" style="color:var(--stale)">–</b><i>ข้อมูลเก่า / stale</i></div>
  </div>
  <div class="age" id="age"><span class="dot"></span><span id="age-t">กำลังโหลด… / loading…</span></div>
  <div class="modes">
    <button data-mode="risk" class="on">ความเสี่ยง<br>Risk</button>
    <button data-mode="level">ระดับน้ำ<br>Level</button>
    <button data-mode="rain">ฝน 24 ชม.<br>Rain 24h</button>
    <button data-mode="discharge">แนวโน้มน้ำท่า<br>Discharge</button>
  </div>
  <div class="legend" id="legend"></div>
  <div class="worst" id="worst"></div>
</div>

<div id="tidebar" class="panel">
  <h2 id="tide-name">—</h2>
  <div class="sub" id="tide-state">—</div>
  <div id="tide-next"></div>
</div>

<div id="degraded"></div>

<div id="alert" class="panel">
  <b>ไม่ใช่ช่องทางแจ้งเหตุฉุกเฉินทางราชการ</b> — เหตุด่วนโทร <b>1784</b> (ปภ.) หรือ <b>191</b>.
  Not an official emergency channel — call <b>1784</b> / <b>191</b>.
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// Snapshot location. Static file on a CDN — there is no API server to fall over.
const DATA = new URLSearchParams(location.search).get("data")
  || window.SERAPHIM_DATA_URL || "../data/out/stations.geojson";
const META = DATA.replace(/stations\.geojson$/, "meta.json");
const TIDE = DATA.replace(/stations\.geojson$/, "tide.json");
const AREAS = DATA.replace(/stations\.geojson$/, "areas.json");
// Risk 1-5 -> colour. Used for markers, badges and the worst-districts list alike,
// so one level always looks the same everywhere in the UI.
const RISK_COLOUR = {1:"#1c7ed6",2:"#c99a06",3:"#e8590c",4:"#c2182b",5:"#7d0d1b"};
const RISK_TH = {1:"ปกติ",2:"เฝ้าระวัง",3:"เตือนภัย",4:"อันตราย",5:"วิกฤต"};
const RISK_EN = {1:"Normal",2:"Watch",3:"Warning",4:"Severe",5:"Critical"};

const map = new maplibregl.Map({
  container: "map",
  // CARTO Positron: free, no API key, and light — chosen for daylight legibility on a
  // phone rather than for looking dramatic.
  style: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
  center: [100.9, 13.6], zoom: 5.1, attributionControl: false
});
map.addControl(new maplibregl.AttributionControl({
  compact: true,
  customAttribution: "ข้อมูล / Data: ThaiWater (HII) · SeRAPHIM (AGPL-3.0)"
}));
map.addControl(new maplibregl.NavigationControl({showCompass:false}), "top-right");
map.addControl(new maplibregl.GeolocateControl({trackUserLocation:true}), "top-right");

// Escape every value before it reaches innerHTML.
// `note` and `contact_name` arrive from a PUBLIC, unauthenticated endpoint: without
// this, a submission containing <img src=x onerror=...> runs in a responder's browser
// and steals the token that unlocks everyone's personal data. Escaping happens at
// render, never on input — storing exactly what someone typed matters when the text
// is a plea for help.
const ESCAPES = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
const esc = (v) => v == null ? "" : String(v).replace(/[&<>"']/g, (c) => ESCAPES[c]);

const fmt = (v, u = "", d = 2) =>
  (v === null || v === undefined) ? "—" : `${Number(v).toFixed(d)}${u}`;

function ageLabel(min) {
  if (min == null) return "—";
  if (min < 90) return `${Math.round(min)} นาที / min`;
  const h = min / 60;
  return h < 48 ? `${h.toFixed(1)} ชม. / hr` : `${(h/24).toFixed(1)} วัน / days`;
}

map.on("load", async () => {
  let gj, meta = null, tide = null;
  try {
    gj = await (await fetch(DATA, {cache:"no-cache"})).json();
    meta = await (await fetch(META, {cache:"no-cache"})).json().catch(() => null);
    tide = await (await fetch(TIDE, {cache:"no-cache"})).json().catch(() => null);
  } catch (e) {
    document.getElementById("age-t").textContent = "โหลดข้อมูลไม่สำเร็จ / failed to load snapshot";
    document.getElementById("age").className = "age bad";
    const el = document.getElementById("degraded");
    el.classList.add("show");
    el.innerHTML = `<b>⚠ โหลดข้อมูลไม่ได้ / Could not load data</b><br>` +
      `ไม่มีข้อมูลที่บันทึกไว้ในเครื่อง · no cached snapshot available<br>` +
      `เหตุด่วนโทร <b>1784</b> (ปภ.) หรือ <b>191</b>`;
    return;
  }

  map.addSource("st", {type:"geojson", data: gj});

  // Three ways to read the same stations: where the water is now, what rain is coming,
  // and what the discharge model expects. Colour always carries a second signal
  // (radius, stroke) so it is never the only cue.
  const MODES = {
    risk: {
      colour: ["case",
        ["==", ["get","risk_level"], null], "#b6bfc9",
        ["==", ["get","risk_level"], 5], RISK_COLOUR[5],
        ["==", ["get","risk_level"], 4], RISK_COLOUR[4],
        ["==", ["get","risk_level"], 3], RISK_COLOUR[3],
        ["==", ["get","risk_level"], 2], RISK_COLOUR[2],
        RISK_COLOUR[1]],
      big: [">=", ["coalesce",["get","risk_level"], 0], 4],
      legend: [[RISK_COLOUR[5],"5 วิกฤต · Critical"],[RISK_COLOUR[4],"4 อันตราย · Severe"],
               [RISK_COLOUR[3],"3 เตือนภัย · Warning"],[RISK_COLOUR[2],"2 เฝ้าระวัง · Watch"],
               [RISK_COLOUR[1],"1 ปกติ · Normal"]]
    },
    level: {
      colour: ["case",
        ["get","stale"], "#8b97a3",
        ["==", ["get","freeboard_m"], null], "#b6bfc9",
        ["<=", ["get","freeboard_m"], 0],   "#c2182b",
        ["<",  ["get","freeboard_m"], 0.5], "#e8590c",
        ["<",  ["get","freeboard_m"], 1.5], "#c99a06",
        "#1c7ed6"],
      big: ["<=", ["coalesce",["get","freeboard_m"], 99], 0],
      legend: [["#c2182b","ล้นตลิ่ง · over bank"],["#e8590c","&lt; 0.5 ม. freeboard"],
               ["#c99a06","0.5–1.5 ม."],["#1c7ed6","&gt; 1.5 ม. · ample"],
               ["#8b97a3","ไม่ส่งข้อมูล · not reporting"]]
    },
    rain: {
      colour: ["case",
        ["==", ["get","rain_next_24h_mm"], null], "#b6bfc9",
        [">=", ["get","rain_next_24h_mm"], 90], "#5b21b6",
        [">=", ["get","rain_next_24h_mm"], 50], "#c2182b",
        [">=", ["get","rain_next_24h_mm"], 20], "#e8590c",
        [">=", ["get","rain_next_24h_mm"], 5],  "#c99a06",
        "#93c5c9"],
      big: [">=", ["coalesce",["get","rain_next_24h_mm"], 0], 50],
      legend: [["#5b21b6","≥ 90 มม. · extreme"],["#c2182b","50–90 มม."],
               ["#e8590c","20–50 มม."],["#c99a06","5–20 มม."],["#93c5c9","&lt; 5 มม."]]
    },
    discharge: {
      colour: ["case",
        ["==", ["get","discharge_rise_ratio"], null], "#b6bfc9",
        [">=", ["get","discharge_rise_ratio"], 4], "#c2182b",
        [">=", ["get","discharge_rise_ratio"], 2], "#e8590c",
        [">=", ["get","discharge_rise_ratio"], 1.2], "#c99a06",
        "#1c7ed6"],
      big: [">=", ["coalesce",["get","discharge_rise_ratio"], 0], 2],
      legend: [["#c2182b","≥ 4× ของวันนี้ · ≥4× today"],["#e8590c","2–4×"],
               ["#c99a06","1.2–2×"],["#1c7ed6","ทรงตัว · steady"],
               ["#b6bfc9","ไม่มีแม่น้ำในแบบจำลอง · no modelled river"]]
    }
  };

  map.addLayer({
    id:"st-c", type:"circle", source:"st",
    paint:{
      "circle-color": MODES.level.colour,
      "circle-radius":["interpolate",["linear"],["zoom"],
        4, ["case", MODES.level.big, 4.2, 2.6],
        9, ["case", MODES.level.big, 9, 5.5],
        13,["case", MODES.level.big, 15, 10]],
      "circle-stroke-width":["case",["get","stale"],1.4,1],
      "circle-stroke-color":["case",["get","stale"],"#5b6672","#fff"],
      "circle-opacity":["case",["get","stale"],.55,.92]
    }
  });

  // --- tide points -------------------------------------------------------
  if (tide?.points?.length) {
    map.addSource("tide", {type:"geojson", data:{
      type:"FeatureCollection",
      features: tide.points.map(p => ({
        type:"Feature",
        geometry:{type:"Point", coordinates:[p.lon, p.lat]},
        properties:{...p, next: JSON.stringify(p.next || [])}
      }))
    }});
    map.addLayer({
      id:"tide-c", type:"circle", source:"tide",
      paint:{
        "circle-color":"#0b5ed7",
        "circle-radius":["interpolate",["linear"],["zoom"],4,4.5,9,8,13,12],
        "circle-stroke-width":2.2,
        "circle-stroke-color":"#fff",
        "circle-opacity":.95
      }
    });
    map.on("mouseenter","tide-c",()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave","tide-c",()=>map.getCanvas().style.cursor="");
    map.on("click","tide-c", e => showTide(e.features[0].properties));
  }

  function showTide(p) {
    const bar = document.getElementById("tidebar");
    bar.classList.add("show");
    document.getElementById("tide-name").textContent = `${esc(p.name_th)}`;
    const regimeTh = {large:"น้ำขึ้นลงมาก", average:"ปานกลาง", small:"น้อย", unknown:"—"}[p.range_regime] || "—";
    const dirTh = {rising:"กำลังขึ้น", falling:"กำลังลง", slack:"น้ำนิ่ง", unknown:"—"}[p.state] || "—";
    document.getElementById("tide-state").innerHTML =
      `${esc(p.name)} · ${dirTh} / ${esc(p.state)}` +
      `<br><span class="pill">ช่วงน้ำวันนี้ ${p.range_today_m ?? "—"} ม. · ${regimeTh} (p${p.range_percentile})</span>`;
    let next = [];
    try { next = JSON.parse(p.next || "[]"); } catch {}
    document.getElementById("tide-next").innerHTML = next.slice(0,5).map(e => {
      const d = new Date(e.at);
      const t = d.toLocaleString("th-TH",{timeZone:"Asia/Bangkok",day:"2-digit",month:"short",
        hour:"2-digit",minute:"2-digit"});
      const cls = e.kind === "high" ? "hi" : "lo";
      const lbl = e.kind === "high" ? "น้ำขึ้นสูงสุด / high" : "น้ำลงต่ำสุด / low";
      return `<div class="tide-row"><span class="${cls}">${lbl}</span><b>${t} · ${e.height_m>=0?"+":""}${e.height_m} ม.</b></div>`;
    }).join("") || `<div class="tide-row"><span>ไม่มีข้อมูล / no data</span></div>`;
  }

  // --- mode switching ----------------------------------------------------
  function setMode(name) {
    const m = MODES[name];
    map.setPaintProperty("st-c","circle-color", m.colour);
    map.setPaintProperty("st-c","circle-radius",["interpolate",["linear"],["zoom"],
      4, ["case", m.big, 4.2, 2.6],
      9, ["case", m.big, 9, 5.5],
      13,["case", m.big, 15, 10]]);
    document.getElementById("legend").innerHTML = m.legend
      .map(([c,t]) => `<div><span class="sw" style="background:${c}"></span> ${t}</div>`).join("")
      + `<div><span class="sw" style="background:#0b5ed7;border:2px solid #fff;box-shadow:0 0 0 1px #0b5ed7"></span> จุดน้ำขึ้นน้ำลง · tide point</div>`;
    document.querySelectorAll(".modes button").forEach(b =>
      b.classList.toggle("on", b.dataset.mode === name));
  }
  document.querySelectorAll(".modes button").forEach(b =>
    b.addEventListener("click", () => setMode(b.dataset.mode)));
  setMode("level");

  map.on("mouseenter","st-c",()=>map.getCanvas().style.cursor="pointer");
  map.on("mouseleave","st-c",()=>map.getCanvas().style.cursor="");
  map.on("click","st-c", e => {
    const p = e.features[0].properties;
    const n = k => (p[k] === null || p[k] === undefined || p[k] === "") ? null : Number(p[k]);
    const fb = n("freeboard_m");
    const over = fb !== null && fb <= 0;
    const stale = p.stale === true || p.stale === "true";
    const rise = n("discharge_rise_ratio");
    const lv = n("risk_level");
    const tag = lv
      ? `<div class="tag" style="background:${RISK_COLOUR[lv]}">${lv} ${RISK_TH[lv]} · ${RISK_EN[lv]}</div>`
      : (over ? `<div class="tag" style="background:var(--over)">ล้นตลิ่ง · OVER BANK</div>` : "");
    let reasons = p.reasons;
    if (typeof reasons === "string") { try { reasons = JSON.parse(reasons); } catch { reasons = []; } }
    reasons = Array.isArray(reasons) ? reasons : [];
    const ttb = n("time_to_bank_hr");
    // The "why" block is not decoration: a score with no reasoning is either ignored
    // or panics people, and neither is a safe outcome.
    const why = reasons.length ? `<div class="why"><b>เหตุผล · WHY</b><ul>` +
        reasons.map(r => `<li>${esc(r.th)}<br><span style="color:var(--muted)">${esc(r.en)}</span></li>`).join("") +
        `</ul></div>` : "";
    const ttbHtml = ttb !== null
      ? `<div class="ttb">⚠ ถึงระดับตลิ่งใน ~${ttb} ชม. · ~${ttb} h to bank level</div>` : "";
    const conf = p.risk_confidence
      ? `<div class="conf">ความเชื่อมั่น / confidence: ${esc(p.risk_confidence)}` +
        (stale ? " · ข้อมูลเก่า / stale" : "") + `</div>` : "";
    new maplibregl.Popup({maxWidth:"320px"})
      .setLngLat(e.lngLat)
      .setHTML(`
        ${tag}
        <div class="pop-h">${esc(p.name) || "—"}</div>
        ${ttbHtml}
        <div class="pop-r"><span>จังหวัด / province</span><span>${esc(p.province) || "—"}</span></div>
        <div class="pop-r"><span>ระดับน้ำ / level</span><span>${fmt(n("level_msl")," m MSL")}</span></div>
        <div class="pop-r"><span>ระดับตลิ่ง / bank</span><span>${fmt(n("bank_msl")," m MSL")}</span></div>
        <div class="pop-r"><span>${over?"สูงกว่าตลิ่ง / above bank":"ต่ำกว่าตลิ่ง / freeboard"}</span>
          <span style="color:${over?"var(--over)":"inherit"}">${fb===null?"—":fmt(Math.abs(fb)," m")}</span></div>
        <div class="pop-r"><span>ฝน 24 ชม.ที่ผ่านมา / rain past 24h</span><span>${fmt(n("rain_past_24h_mm")," mm",1)}</span></div>
        <div class="pop-r"><span>ฝนคาดการณ์ 24 ชม. / rain next 24h</span><span>${fmt(n("rain_next_24h_mm")," mm",1)}</span></div>
        <div class="pop-r"><span>ฝนคาดการณ์ 72 ชม. / next 72h</span><span>${fmt(n("rain_next_72h_mm")," mm",1)}</span></div>
        <div class="pop-r"><span>น้ำท่า / discharge</span><span>${fmt(n("discharge_now_cms")," m³/s",1)}</span></div>
        <div class="pop-r"><span>แนวโน้ม 7 วัน / 7-day trend</span><span>${rise===null?"—":rise+"×"}</span></div>
        <div class="pop-r"><span>อายุข้อมูล / data age</span><span>${ageLabel(n("data_age_min"))}</span></div>
        <div class="pop-r"><span>หน่วยงาน / agency</span><span>${esc(p.agency) || "—"}</span></div>
        ${why}${conf}
      `).addTo(map);
  });

  const c = meta?.counts ?? {};
  document.getElementById("s-total").textContent = c.stations ?? gj.features.length;
  document.getElementById("s-over").textContent  = c.at_or_over_bank ?? "–";
  document.getElementById("s-stale").textContent = c.stale ?? "–";

  // Data age is displayed, never hidden: Actions cron drifts, so "live" would be a lie.
  const gen = meta?.generated_at ? new Date(meta.generated_at) : null;
  const mins = gen ? (Date.now() - gen.getTime()) / 60000 : null;
  const el = document.getElementById("age");
  const med = meta?.data_age_minutes?.median;
  el.className = "age" + (mins == null || mins > 180 ? " bad" : mins > 75 ? " warn" : "");
  document.getElementById("age-t").textContent = gen
    ? `อัปเดตเมื่อ ${ageLabel(mins)} ที่แล้ว · median reading age ${ageLabel(med)}`
    : "ไม่ทราบเวลาข้อมูล / snapshot time unknown";

  // Worst districts — a gauge is an instrument, a district is where somebody lives.
  if (areas?.areas?.length) {
    const top = areas.areas.filter(a => a.level >= 3).slice(0, 6);
    document.getElementById("worst").innerHTML = top.length
      ? `<h3>พื้นที่เสี่ยงสูงสุด · HIGHEST RISK DISTRICTS</h3>` + top.map((a, i) =>
          `<a data-i="${i}"><span class="lv" style="background:${RISK_COLOUR[a.level]}">${a.level}</span>` +
          `<span>${esc(a.district) || "—"}, ${esc(a.province) || "—"}` +
          (a.worst_ttb_hr !== null && a.worst_ttb_hr !== undefined
            ? ` <span style="color:var(--over)">~${a.worst_ttb_hr} ชม.</span>` : "") +
          `</span></a>`).join("")
      : `<h3>พื้นที่เสี่ยงสูงสุด · HIGHEST RISK DISTRICTS</h3>
         <div style="font-size:12px;color:var(--muted)">ไม่มีพื้นที่ระดับ 3 ขึ้นไป · none at level 3+</div>`;
    document.querySelectorAll("#worst a").forEach(el => el.addEventListener("click", () => {
      const a = top[+el.dataset.i];
      const f = gj.features.find(x => x.properties.province === a.province
        && x.properties.district === a.district && x.properties.risk_level === a.level);
      if (f) map.flyTo({center: f.geometry.coordinates, zoom: 11});
    }));
  }

  // Open the upper-Gulf tide point by default: it is the one that drives Bangkok's
  // backwater flooding, and it makes the tide layer discoverable.
  const seed = tide?.points?.find(p => p.id === "chaophraya_mouth") || tide?.points?.[0];
  if (seed) showTide({...seed, next: JSON.stringify(seed.next || [])});

  // Degraded mode. The dangerous failure is the quiet one: the map still renders and
  // the numbers behind it stopped being true hours ago. Say so, loudly.
  const limit = meta?.health?.snapshot_stale_after_minutes ?? 90;
  const unhealthy = meta?.health?.status && meta.health.status !== "pass";
  if (!navigator.onLine || (mins !== null && mins > limit) || unhealthy) {
    const el = document.getElementById("degraded");
    el.classList.add("show");
    const why = !navigator.onLine
      ? "ออฟไลน์ — กำลังแสดงข้อมูลล่าสุดที่บันทึกไว้ / Offline — showing last saved data"
      : (mins !== null && mins > limit)
        ? `ข้อมูลเก่ากว่า ${Math.round(limit)} นาที / Snapshot is older than ${Math.round(limit)} min`
        : "ระบบเก็บข้อมูลมีปัญหาบางส่วน / Pipeline reporting degraded";
    const failed = (meta?.health?.checks || [])
      .filter(c => c.status !== "pass").map(c => esc(c.detail)).join(" · ");
    el.innerHTML = `<b>⚠ ข้อมูลอาจไม่เป็นปัจจุบัน / Data may be out of date</b><br>${esc(why)}` +
      (failed ? `<br><span style="opacity:.85">${failed}</span>` : "") +
      `<br>อย่าใช้ตัดสินใจเรื่องความปลอดภัยเพียงอย่างเดียว — โทร 1784 / 191`;
  }
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
</script>
</body>
</html>
