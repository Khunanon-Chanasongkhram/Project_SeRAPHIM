<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://tilecache.rainviewer.com https://s3.amazonaws.com https://elevation-tiles-prod.s3.amazonaws.com; connect-src 'self' https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://api.rainviewer.com https://*.api.radio-browser.info https://gibs.earthdata.nasa.gov https://s3.amazonaws.com https://elevation-tiles-prod.s3.amazonaws.com https://api-v3.thaiwater.net https://mapservices.weather.noaa.gov https://environment.data.gov.uk; media-src https: blob:; worker-src 'self' blob:; base-uri 'self'; form-action 'self'">
<title>SeRAPHIM</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="./config.js"></script>
<style>
  :root{
    --bg:#07090c; --panel:rgba(12,16,22,.86); --panel-solid:#0c1016;
    --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.18);
    --fg:#e9eef5; --dim:#8c98a8; --faint:#5c6672;
    --l1:#2f81f7; --l2:#d99e0b; --l3:#e8590c; --l4:#e5484d; --l5:#ff2d55;
    --ok:#3fb950;
    --sheet-collapsed:74px;
    /* One easing curve and three durations for the whole interface. Motion that all
       moves the same way reads as one object; motion that each element invents for
       itself reads as jitter. */
    --ease:cubic-bezier(.22,.61,.36,1);
    --ease-out:cubic-bezier(.16,1,.3,1);
    --fast:.13s; --med:.24s; --slow:.42s;
    --fp1:#fbbf24; --fp2:#f97316; --fp3:#b91c1c;
  }
  /* Somebody who has asked their operating system to stop animating things has usually
     asked for a reason, and "emergency map" is not an exemption. Everything below still
     changes state, it just stops travelling to get there. */
  @media (prefers-reduced-motion: reduce){
    :root{--fast:0s; --med:0s; --slow:0s}
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
      transition-duration:.001ms!important;scroll-behavior:auto!important}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Noto Sans Thai",sans-serif}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  #map{position:absolute;inset:0}
  .maplibregl-ctrl-attrib{font-size:9px;background:rgba(0,0,0,.5)!important}
  .maplibregl-ctrl-attrib a{color:var(--faint)!important}

  /* ---------- top bar ---------- */
  #top{position:absolute;z-index:5;top:0;left:0;right:0;
    padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;
    display:flex;align-items:center;gap:8px;
    background:linear-gradient(180deg,rgba(7,9,12,.92),rgba(7,9,12,0));
    pointer-events:none}
  #top > *{pointer-events:auto}
  .brand{font-size:13px;font-weight:700;letter-spacing:.14em;margin-right:auto;
    display:flex;align-items:center;gap:7px;text-shadow:0 1px 6px #000}
  .live{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;
    box-shadow:0 0 0 0 rgba(63,185,80,.6);animation:pulse 2.6s infinite}
  .live.stale{background:var(--l3);animation:none}
  .live.dead{background:var(--l5);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,185,80,.55)}70%{box-shadow:0 0 0 9px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--fg);
    border-radius:9px;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);line-height:1;
    transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease),
      transform var(--fast) var(--ease),color var(--fast) var(--ease)}
  .btn:hover{border-color:var(--line-strong)}
  .btn:active{background:rgba(255,255,255,.1);transform:scale(.96)}
  .btn.on{background:var(--fg);color:var(--panel-solid);border-color:var(--fg);font-weight:700}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;
    overflow:hidden;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .seg button{background:none;border:0;color:var(--dim);font:inherit;font-size:11px;
    font-weight:700;padding:7px 9px;cursor:pointer;
    transition:background var(--fast) var(--ease),color var(--fast) var(--ease)}
  .seg button:hover{color:var(--fg)}
  .seg button.on{background:var(--fg);color:var(--panel-solid)}
  /* A visible focus ring, because the map is operable from a keyboard and an invisible
     one means it is not. :focus-visible so a mouse click does not leave a ring behind. */
  :focus-visible{outline:2px solid var(--l1);outline-offset:2px;border-radius:7px}

  /* ---------- layers drawer ---------- */
  #layers{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 50px);right:10px;
    width:min(240px,calc(100vw - 20px));background:var(--panel);border:1px solid var(--line);
    border-radius:13px;padding:11px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 12px 40px rgba(0,0,0,.55);
    /* Animated open/close instead of display:none, which cannot be transitioned and
       so made every panel appear as a jump cut. visibility keeps it out of the tab
       order while closed. */
    opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);
    transform-origin:top right;
    transition:opacity var(--med) var(--ease-out),transform var(--med) var(--ease-out),
      visibility 0s linear var(--med)}
  #layers.show{opacity:1;visibility:visible;transform:none;transition-delay:0s}
  #layers h4{margin:0 0 6px;font-size:10px;letter-spacing:.12em;color:var(--faint);font-weight:700}
  #layers h4:not(:first-child){margin-top:12px}
  .opt{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;
    font-size:12.5px;transition:background var(--fast) var(--ease)}
  .opt:hover{background:rgba(255,255,255,.05)}
  .opt:active{background:rgba(255,255,255,.07)}
  .opt.on{background:rgba(47,129,247,.18)}
  .opt .sw{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none;
    transition:background var(--med) var(--ease),box-shadow var(--med) var(--ease)}
  .opt.on .sw{background:var(--l1);box-shadow:0 0 8px var(--l1)}
  .note{font-size:10.5px;color:var(--faint);line-height:1.4;margin-top:9px;
    padding-top:9px;border-top:1px solid var(--line)}

  /* ---------- bottom sheet ---------- */
  #sheet{position:absolute;z-index:5;left:0;right:0;bottom:0;
    background:var(--panel);border-top:1px solid var(--line-strong);
    border-radius:16px 16px 0 0;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    max-height:min(88vh,760px);height:var(--sheet-collapsed);
    transition:height var(--med) var(--ease-out);overflow:hidden;
    box-shadow:0 -10px 40px rgba(0,0,0,.5);
    /* The sheet is the one element that moves on every interaction, so it is promoted
       to its own layer once rather than re-rasterised each frame. */
    will-change:height;touch-action:none}
  #sheet.open{height:min(62vh,520px)}
  #sheet.full{height:min(88vh,760px)}
  /* While a finger is on it the height follows the finger directly, so the transition
     has to be out of the way or every frame fights the last one. */
  #sheet.dragging{transition:none}
  #grab{padding:9px 0 5px;display:flex;justify-content:center;cursor:grab;
    touch-action:none}
  #grab:active{cursor:grabbing}
  #grab i{display:block;width:38px;height:4px;border-radius:2px;background:var(--line-strong);
    transition:background var(--fast) var(--ease),width var(--med) var(--ease)}
  #grab:hover i{background:var(--dim);width:46px}
  #sheetbody{overflow-y:auto;max-height:calc(min(88vh,760px) - 22px);
    padding:0 12px calc(env(safe-area-inset-bottom,0px) + 14px);-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;touch-action:pan-y}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;cursor:pointer}
  .stat{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:10px;
    padding:7px 9px;transition:background var(--fast) var(--ease),
      border-color var(--fast) var(--ease),transform var(--fast) var(--ease)}
  .stats:hover .stat{background:rgba(255,255,255,.07)}
  .stats:active .stat{transform:scale(.985)}
  .stat b{display:block;font-size:20px;line-height:1.1}
  /* A number that changes should be seen to change, or a phone on a windowsill silently
     goes from 12 over bank to 40 and nobody notices. */
  .stat b.bump{animation:bump var(--slow) var(--ease-out)}
  @keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.22)}100%{transform:scale(1)}}
  .stat i{font-style:normal;font-size:9.5px;color:var(--dim);letter-spacing:.03em}
  .age{margin-top:9px;font-size:11px;color:var(--dim);display:flex;gap:6px;align-items:center}

  .modes{display:flex;gap:5px;margin-top:11px}
  .modes button{flex:1;font-size:11px;padding:8px 4px;line-height:1.3}
  h5{margin:14px 0 6px;font-size:10px;letter-spacing:.12em;color:var(--faint);font-weight:700}
  .legend{display:flex;flex-wrap:wrap;gap:5px}
  .legend div{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);
    background:rgba(255,255,255,.04);padding:3px 8px;border-radius:999px}
  .legend .d{width:8px;height:8px;border-radius:50%;flex:none}

  .worst a{display:flex;align-items:center;gap:9px;padding:8px 6px;border-radius:8px;
    text-decoration:none;color:inherit;cursor:pointer;border-bottom:1px solid var(--line)}
  .worst a:active{background:rgba(255,255,255,.06)}
  .lv{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;
    font-size:11px;font-weight:800;color:#fff}
  .worst .t{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .worst .ttb{font-size:11.5px;font-weight:700;color:var(--l4)}

  .disc{margin-top:13px;font-size:10.5px;color:var(--faint);line-height:1.5;
    border-top:1px solid var(--line);padding-top:10px}
  .disc b{color:var(--l4)}
  .disc a{color:var(--l1)}

  /* ---------- popup ---------- */
  .maplibregl-popup-content{background:var(--panel-solid)!important;color:var(--fg);
    border:1px solid var(--line-strong);border-radius:13px;padding:13px 14px;
    box-shadow:0 14px 44px rgba(0,0,0,.6);font:13px/1.45 ui-sans-serif,system-ui,"Noto Sans Thai",sans-serif}
  .maplibregl-popup-tip{border-top-color:var(--panel-solid)!important;
    border-bottom-color:var(--panel-solid)!important}
  .maplibregl-popup-close-button{color:var(--dim);font-size:19px;padding:2px 7px}
  .pt{font-size:9.5px;font-weight:800;letter-spacing:.09em;padding:3px 8px;border-radius:999px;
    color:#fff;display:inline-block;margin-bottom:7px}
  .ph{font-weight:700;font-size:14px;margin-bottom:2px}
  .psub{color:var(--dim);font-size:11px;margin-bottom:8px}
  .pttb{font-size:13px;font-weight:700;color:var(--l4);margin:7px 0 2px}
  .pr{display:flex;justify-content:space-between;gap:14px;padding:3px 0;font-size:12px;
    border-top:1px solid var(--line)}
  .pr span:first-child{color:var(--dim)}
  .why{margin-top:9px;background:rgba(255,255,255,.045);border-radius:9px;padding:8px 10px}
  .why b{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--faint);margin-bottom:4px}
  .why li{font-size:11.5px;margin:3px 0 3px -14px;line-height:1.4}
  .why ul{margin:0;padding-left:16px}
  .conf{font-size:10px;color:var(--faint);margin-top:6px}
  /* The play button is the moment a third party enters the page, so it is an
     explicit control rather than an autoplaying frame. */
  .cctvbox{margin-top:8px;min-height:32px}
  .cctvplay{width:100%;padding:7px 10px;font:inherit;font-size:12px;font-weight:600;
    color:#1a1a1a;background:#eab308;border:0;border-radius:6px;cursor:pointer}
  .cctvplay:hover{background:#facc15}
  .cctvbox video{max-height:240px}

  .chk{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px;cursor:pointer;
    font-size:12.5px;user-select:none}
  .chk:active{background:rgba(255,255,255,.07)}
  .chk .box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-strong);
    flex:none;display:grid;place-items:center;font-size:11px;color:transparent;transition:.12s}
  .chk.on .box{background:var(--l1);border-color:var(--l1);color:#fff}
  .chk .dotc{width:8px;height:8px;border-radius:50%;flex:none;margin-left:auto}
  .chk.off{opacity:.45}
  .chk small{display:block;color:var(--faint);font-size:10px}

  /* radio tuner */
  #radio{position:absolute;z-index:6;left:10px;right:10px;
    bottom:calc(var(--sheet-collapsed) + 14px);margin:0 auto;max-width:520px;
    background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;
    padding:11px 13px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    display:none;box-shadow:0 10px 36px rgba(0,0,0,.6)}
  #radio.show{display:block}
  .rhead{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .rname{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .rmeta{font-size:10px;color:var(--faint)}
  .rplay{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-strong);
    background:rgba(255,255,255,.06);color:var(--fg);font-size:14px;cursor:pointer;flex:none}
  .rplay.playing{background:var(--l1);border-color:var(--l1)}
  /* the dial: stations laid out by distance from the map centre, swept like a tuner */
  .dial{position:relative;height:46px;border-radius:9px;overflow:hidden;cursor:ew-resize;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--line);touch-action:none}
  .dial canvas{display:block;width:100%;height:46px}
  .needle{position:absolute;top:0;bottom:0;width:2px;background:var(--l4);
    box-shadow:0 0 10px var(--l4);pointer-events:none}
  .rtip{font-size:10px;color:var(--faint);margin-top:6px;text-align:center}

  /* Lives inside #toasts so a staleness banner and an alert stack instead of landing
     on top of each other, which is what happened when both were absolutely positioned
     at the same offset. */
  #degraded{pointer-events:auto;
    background:rgba(60,20,10,.92);border:1px solid rgba(232,89,12,.5);color:#ffd9c2;
    border-radius:11px;padding:9px 12px;font-size:11.5px;display:none;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  #degraded.show{display:block}

  @media (min-width:760px){
    :root{--sheet-collapsed:74px}
    #sheet{left:10px;right:auto;bottom:10px;width:352px;border-radius:14px;
      border:1px solid var(--line-strong);max-height:calc(100vh - 86px)}
    #sheet.open{height:calc(100vh - 86px)}
    #sheetbody{max-height:calc(100vh - 104px)}
  }
  #livebar{margin:6px 0 2px}
  /* Calm mode was reachable only through a link inside the disclaimer paragraph,
     which is the same as not being reachable. */
  #fishbtn{display:flex;align-items:center;justify-content:center;gap:8px;
    margin:8px 0 2px;padding:11px 12px;border-radius:9px;text-decoration:none;
    background:#14351f;border:1px solid #2f7d4a;color:#d7f5e3;
    font-size:13px;font-weight:600}
  #fishbtn:active{opacity:.75}
  #fishbtn small{font-weight:400;color:#8fbfa4;font-size:11px}
  #livebtn{display:flex;align-items:center;gap:8px;width:100%;cursor:pointer;
    background:#171b21;border:1px solid #2a2f36;border-radius:8px;
    padding:8px 10px;color:#e8edf3;font:inherit;font-size:12px;text-align:left}
  #livebtn .box{width:15px;height:15px;border-radius:4px;border:1px solid #454c56;
    display:grid;place-items:center;font-size:10px;color:transparent;flex:none}
  #livebtn.on{border-color:#2f7d4a}
  #livebtn.on .box{background:#2f7d4a;border-color:#2f7d4a;color:#fff}
  #livebtn small{display:block;color:#8b949e;font-size:10.5px;line-height:1.35;margin-top:2px}
  #timeline{margin:8px 0 2px}
  .tlhead{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;
    text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:6px}
  .tlhead span{color:#e8edf3;font-weight:700;font-size:12.5px;letter-spacing:0}
  .tlbtns{display:flex;gap:5px}
  .tlbtns button{flex:1;background:#171b21;border:1px solid #2a2f36;color:#8b949e;
    border-radius:7px;padding:7px 4px;font:inherit;font-size:11.5px;cursor:pointer}
  .tlbtns button.flow{border-style:dashed}
  .tlbtns button.on{background:#e8edf3;color:#0d1117;border-color:#e8edf3;font-weight:700}
  .wrow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;
    background:#171b21;border:1px solid #2a2f36;margin-bottom:5px;cursor:pointer;font-size:12px}
  .wrow .d{width:9px;height:9px;border-radius:50%;flex:none}
  .wname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wdel{background:none;border:0;color:#6b7280;font:inherit;cursor:pointer;padding:0 3px}
  .sharebtn{margin-top:9px;width:100%;background:#1b2027;border:1px solid #2a2f36;
    color:#8b949e;border-radius:7px;padding:7px;font:inherit;font-size:11.5px;cursor:pointer}
  .sharebtn:active{opacity:.7}
  .fcrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:7px 0 2px;font-size:11.5px}
  .fcrow b{font-weight:600;color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
  .fcrow span{background:#1b2027;border:1px solid #2a2f36;border-radius:7px;padding:3px 7px;color:#8b949e}
  .fcrow i{font-style:normal;color:#e8edf3;font-weight:600;margin-left:5px}
  #livebtn .pulse{width:7px;height:7px;border-radius:50%;background:#3fb950;flex:none;
    animation:lp 1.8s ease-in-out infinite}
  #livebtn.off .pulse{display:none}
  #livebtn.paused .pulse{animation:none;background:var(--faint)}
  @keyframes lp{0%,100%{opacity:1}50%{opacity:.25}}
  [hidden]{display:none!important}

  /* ---------- popups: arrive, rather than appear ---------- */
  .maplibregl-popup{animation:popin var(--med) var(--ease-out)}
  @keyframes popin{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
  .maplibregl-popup-content{max-height:min(70vh,560px);overflow-y:auto;overscroll-behavior:contain}
  .sharebtn{transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease),
    transform var(--fast) var(--ease)}
  .sharebtn:hover{background:#242a33;border-color:#3a414b;color:var(--fg)}
  .sharebtn:active{transform:scale(.97)}

  /* ---------- toasts ----------
     The watch alerts used to be written into #degraded, which renderAge() rewrites
     every 60 seconds, so an alert could be erased by a routine staleness check before
     anyone read it. Alerts get their own surface that nothing else touches. */
  #toasts{position:absolute;z-index:9;left:10px;right:10px;
    top:calc(env(safe-area-inset-top,0px) + 50px);margin:0 auto;max-width:520px;
    display:flex;flex-direction:column;gap:7px;pointer-events:none}
  .toast{pointer-events:auto;background:rgba(18,23,30,.96);border:1px solid var(--line-strong);
    border-left:3px solid var(--l1);border-radius:11px;padding:10px 12px;font-size:12px;
    box-shadow:0 12px 34px rgba(0,0,0,.6);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);display:flex;gap:10px;align-items:flex-start;
    animation:toastin var(--med) var(--ease-out)}
  .toast.alert{border-left-color:var(--l5);background:rgba(48,12,18,.96);color:#ffd9e0}
  .toast.info{border-left-color:var(--l1)}
  .toast.leaving{animation:toastout var(--med) var(--ease) forwards}
  @keyframes toastin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  @keyframes toastout{to{opacity:0;transform:translateY(-8px)}}
  .toast .tbody{flex:1;min-width:0;line-height:1.45}
  .toast .tbody b{display:block;margin-bottom:2px}
  .toast button{background:rgba(255,255,255,.08);border:1px solid var(--line);color:inherit;
    border-radius:7px;font:inherit;font-size:11px;padding:5px 9px;cursor:pointer;flex:none}
  .toast button:active{transform:scale(.95)}

  /* ---------- first paint ----------
     Until now the page was a black rectangle while ~1 MB of gauges downloaded, which
     on a slow connection is indistinguishable from a site that is broken. */
  #boot{position:absolute;inset:0;z-index:20;display:grid;place-items:center;
    background:var(--bg);transition:opacity var(--slow) var(--ease),visibility 0s linear var(--slow)}
  #boot.gone{opacity:0;visibility:hidden;pointer-events:none}
  #boot .bwrap{text-align:center}
  #boot .bmark{font-size:15px;font-weight:700;letter-spacing:.2em;margin-bottom:14px}
  #boot .bbar{width:168px;height:3px;border-radius:2px;background:rgba(255,255,255,.1);
    overflow:hidden;margin:0 auto}
  #boot .bbar i{display:block;height:100%;width:40%;border-radius:2px;background:var(--l1);
    animation:slide 1.25s var(--ease) infinite}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
  #boot .bmsg{margin-top:11px;font-size:11px;color:var(--faint)}

  /* ---------- flood history in the popup ---------- */
  .fh{margin-top:9px;background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.2);
    border-radius:9px;padding:8px 10px}
  .fh b.fhh{display:block;font-size:9.5px;letter-spacing:.1em;color:#7dd3fc;margin-bottom:5px}
  .fh .pr{border-top-color:rgba(255,255,255,.07)}
  .fh .pr:first-of-type{border-top:0}
  /* One bar is worth more than one number here: "92nd percentile" means little, a bar
     nearly full against a marked 2-year line means it immediately. */
  .fhbar{position:relative;height:7px;border-radius:4px;margin:7px 0 3px;
    background:rgba(255,255,255,.09);overflow:hidden}
  .fhbar i{display:block;height:100%;border-radius:4px;
    background:linear-gradient(90deg,#0ea5e9,#f59e0b 72%,#e5484d);
    animation:grow var(--slow) var(--ease-out)}
  @keyframes grow{from{width:0}}
  .fhscale{display:flex;justify-content:space-between;font-size:9px;color:var(--faint)}
  .fhout{margin-top:7px;padding:7px 9px;border-radius:8px;background:rgba(229,72,77,.14);
    border:1px solid rgba(229,72,77,.34);font-size:11.5px;color:#ffc9cd;line-height:1.45}
  .fhout b{color:#fff}
  .fhpill{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.06em;
    padding:2px 7px;border-radius:999px;color:#1a1207;margin-left:6px}

  /* ---------- forecast sparkline ---------- */
  .spark{margin:7px 0 2px}
  .spark svg{display:block;width:100%;height:46px;overflow:visible}
  .spark .sline{fill:none;stroke:#38bdf8;stroke-width:1.8;stroke-linecap:round;
    stroke-linejoin:round}
  .spark .sband{fill:rgba(56,189,248,.16)}
  .spark .sbank{stroke:var(--l5);stroke-width:1;stroke-dasharray:3 3}
  .spark .sdot{fill:#38bdf8}
  .spark .stxt{fill:var(--faint);font-size:8px}

  /* ---------- timeline ---------- */
  #tlplay{background:#171b21;border:1px solid #2a2f36;color:#e8edf3;border-radius:7px;
    width:30px;height:30px;font-size:12px;cursor:pointer;flex:none;
    transition:background var(--fast) var(--ease),transform var(--fast) var(--ease)}
  #tlplay:active{transform:scale(.92)}
  #tlplay.on{background:var(--l1);border-color:var(--l1)}
  .tlrow{display:flex;gap:6px;align-items:center}
  .tlbtns button{transition:background var(--fast) var(--ease),color var(--fast) var(--ease),
    border-color var(--fast) var(--ease),transform var(--fast) var(--ease)}
  .tlbtns button:active{transform:scale(.94)}
  /* The step that is showing gets a moving underline rather than only a colour swap,
     so the eye can follow the playhead while it advances on its own. */
  .tltrack{position:relative;height:3px;border-radius:2px;background:rgba(255,255,255,.08);
    margin-top:6px;overflow:hidden}
  .tltrack i{position:absolute;top:0;bottom:0;border-radius:2px;background:var(--l1);
    transition:left var(--med) var(--ease-out),width var(--med) var(--ease-out)}

  .wrow{transition:background var(--fast) var(--ease),transform var(--fast) var(--ease)}
  .wrow:hover{background:#1d232b}
  .wrow:active{transform:scale(.99)}
  .worst a{transition:background var(--fast) var(--ease),padding-left var(--fast) var(--ease)}
  .worst a:hover{background:rgba(255,255,255,.05);padding-left:10px}
  /* Rows arrive in sequence rather than all at once: it reads as a list being filled
     in, and it makes a reordering visible instead of instantaneous. */
  .worst a,.wrow{animation:rowin var(--med) var(--ease-out) backwards}
  @keyframes rowin{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  #degraded{transition:opacity var(--med) var(--ease),transform var(--med) var(--ease)}
  #degraded:not(.show){opacity:0;transform:translateY(-6px)}
  #degraded.show{opacity:1;transform:none}
  .dsm{background:none;border:0;color:inherit;opacity:.7;font:inherit;font-size:15px;
    cursor:pointer;padding:0 2px;margin-left:auto}
  .drow{display:flex;gap:8px;align-items:flex-start}
</style>
</head>

/* ------------------------------------------------------------------ toasts
 * Watch alerts used to be written into #degraded. renderAge() rewrites that element
 * every 60 seconds from the snapshot's health, so a level-5 alert could be wiped by a
 * routine freshness check seconds after it appeared, and nothing would say it had ever
 * happened. Alerts now own a surface nothing else writes to.
 *
 * `key` makes a toast idempotent: the same gauge escalating twice replaces its own
 * message instead of stacking a second copy of it.
 */
const toastTimers=new Map();
function toast({title, body, kind="info", key=null, timeout=0, action=null}){
  const host=$("toasts"); if(!host) return;
  const id=key||("t"+Math.random().toString(36).slice(2));
  let el=host.querySelector(`[data-toast="${CSS.escape(id)}"]`);
  if(!el){
    el=document.createElement("div");
    el.dataset.toast=id;
    host.appendChild(el);
  }
  el.className="toast "+kind;
  el.innerHTML=`<div class="tbody">${title?`<b>${esc(title)}</b>`:""}${esc(body||"")}</div>
    <button type="button" data-close>${esc(action?action.label:t("dismiss"))}</button>`;
  const btn=el.querySelector("[data-close]");
  btn.onclick=()=>{ if(action&&action.run) action.run(); dismissToast(id); };
  clearTimeout(toastTimers.get(id));
  if(timeout>0) toastTimers.set(id, setTimeout(()=>dismissToast(id), timeout));
  return id;
}
function dismissToast(id){
  const el=$("toasts")?.querySelector(`[data-toast="${CSS.escape(id)}"]`);
  if(!el) return;
  clearTimeout(toastTimers.get(id));
  toastTimers.delete(id);
  el.classList.add("leaving");
  // Matches the leaving animation; a reduced-motion user gets ~0s and it simply goes.
  setTimeout(()=>el.remove(), 260);
}

function ageText(min){
  if(min==null||isNaN(min)) return "-";
  if(min<90) return `${Math.round(min)} ${t("min")}`;
  const h=min/60;
  return h<48 ? `${h.toFixed(1)} ${t("hr")}` : `${(h/24).toFixed(1)} ${t("day")}`;
}
const fmt=(v,u="",d=2)=>(v==null||v===""||isNaN(v))?"-":`${Number(v).toFixed(d)}${u}`;

const j=(n)=>fetch(`${BASE}/${n}`,{cache:"no-cache"}).then(r=>r.json()).catch(()=>null);

/** Station and area data is split per country so adding a country costs existing
 *  readers nothing. A visitor downloads the one they are looking at, and others
 *  arrive only if they go there. */
const loaded={};
let index=null, country=(localStorage.getItem("seraphim_country")||"th");

async function loadCountry(cc){
  cc=cc.toLowerCase();
  if(loaded[cc]) return loaded[cc];
  const entry=(index?.countries||[]).find(c=>c.code.toLowerCase()===cc);
  if(!entry) return null;
  const [st,ar]=await Promise.all([
    j(entry.stations_file), entry.areas_file?j(entry.areas_file):Promise.resolve(null)]);
  if(!st) return null;
  loaded[cc]={stations:st, areas:ar?.areas||[]};
  return loaded[cc];
}

/** Merge everything fetched so far, so panning between countries adds rather than swaps. */
function mergedStations(){
  const features=[];
  for(const k of Object.keys(loaded)) features.push(...loaded[k].stations.features);
  return {type:"FeatureCollection", features};
}
function mergedAreas(){
  const out=[];
  for(const k of Object.keys(loaded)) out.push(...loaded[k].areas);
  out.sort((a,b)=>b.level-a.level
    || ((a.worst_ttb_hr??1e9)-(b.worst_ttb_hr??1e9)));
  return {areas:out};
}

/* ------------------------------------------------------- live refresh
 * Reads are static files on a CDN, and that is what makes a million map views cost
 * nothing. So "live" does NOT mean putting a server in front of the map: the browser
 * asks the agency directly, exactly as it already does for rain radar. Our origin
 * still serves nothing but files.
 *
 * **On by default, as of 2026-09-16, at the owner's explicit request.** It was opt-in
 * before, because turning it on means this visitor's browser (and IP) contacts a
 * foreign government API and spends a few hundred KB per refresh, and nobody should
 * pay either cost unknowingly. That reasoning has not gone away, so the disclosure
 * stayed and moved to the front: the first time the page runs it, a notice names the
 * agency being contacted and offers a one-tap off, and the choice is remembered. What
 * changed is the default, not the reader's ability to see it or refuse it.
 *
 * It also now pauses while the tab is in the background. On by default plus a 2-minute
 * timer meant a forgotten tab pulling 1.8 MB from a government API every 2 minutes
 * indefinitely, which is a cost to them and to the reader's data plan for a map nobody
 * is looking at.
 *
 * What a live reading may and may not change:
 *   - it replaces the LEVEL and its measured time, and recomputes freeboard, which is
 *     just bank minus level and therefore honest to derive in the browser;
 *   - it may ESCALATE a gauge to 5, because 5 means "water is over the bank now" and
 *     that is an observation, not a prediction;
 *   - it may NEVER de-escalate, because the snapshot's score can rest on a forecast,
 *     a tide window or a trend that this one reading knows nothing about;
 *   - it never rewrites the reasoning. The panel shows a live level beside a score
 *     stamped with the build it came from, rather than pretending they are one thing.
 *
 * The Netherlands is absent on purpose: Rijkswaterstaat sends no CORS header, so a
 * browser cannot read it. Saying so is better than a toggle that silently does nothing.
 */
const LIVE_SOURCES={
  th:{
    label:"ThaiWater (HII)",
    url:()=>"https://api-v3.thaiwater.net/api/v1/thaiwater30/public/waterlevel",
    parse:(d)=>{
      const out={};
      for(const row of (d&&d.data)||[]){
        const st=row.station||{};
        const id=st.id==null?null:String(st.id);
        const lv=Number(row.waterlevel_msl);
        if(id==null||!isFinite(lv)) continue;
        // Naive Bangkok wall-clock, exactly as the Python adapter treats it.
        const at=row.waterlevel_datetime
          ? Date.parse(String(row.waterlevel_datetime).replace(" ","T")+"+07:00") : NaN;
        out["thaiwater:"+id]={level:lv, at:isFinite(at)?at:null};
      }
      return out;
    }},
  gb:{
    label:"Environment Agency",
    url:()=>"https://environment.data.gov.uk/flood-monitoring/id/measures"
            +"?parameter=level&_limit=10000",
    parse:(d)=>{
      const UNITS={mASD:1,mAOD:1,m:1,mBDAT:1}, out={};
      for(const m of (d&&d.items)||[]){
        if(!UNITS[m.unitName]) continue;   // rainfall, flow and temperature are not levels
        const r=m.latestReading;
        if(!r||typeof r!=="object") continue;
        const lv=Number(r.value);
        let ref=m.stationReference;
        if(!ref&&typeof m.station==="string") ref=m.station.replace(/\/+$/,"").split("/").pop();
        if(!ref||!isFinite(lv)) continue;
        const at=Date.parse(r.dateTime);
        out["ukea:"+ref]={level:lv, at:isFinite(at)?at:null};
      }
      return out;
    }},
  us:{
    label:"NOAA / NWS",
    // Viewport-scoped: the US has 11,467 gauges and nobody is looking at all of them.
    // Zoomed out over the whole country the service caps a response at 10,000 rows and
    // flags `exceededTransferLimit`, so this pages rather than silently updating most
    // of the gauges in view and quietly leaving the rest on build-time numbers.
    fetch:async (b)=>{
      const base="https://mapservices.weather.noaa.gov/eventdriven/rest/services"
        +"/water/riv_gauges/MapServer/0/query?where=1%3D1"
        +"&outFields=gaugelid,observed,obstime,units,pedts&returnGeometry=false&f=json"
        +"&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects"
        +"&geometry="+[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()]
          .map(v=>v.toFixed(4)).join(",");
      const out={}, FT=0.3048, PAGE=10000;
      for(let page=0; page<3; page++){
        const r=await fetch(`${base}&resultOffset=${page*PAGE}&resultRecordCount=${PAGE}`,
          {cache:"no-store"});
        if(!r.ok) break;
        const d=await r.json();
        const feats=(d&&d.features)||[];
        for(const f of feats){
          const a=f.attributes||{};
          // Same refusal as the Python adapter: a height, in feet, or nothing.
          if(a.units!=="ft"||!String(a.pedts||"").startsWith("H")) continue;
          const lv=Number(a.observed);
          if(!a.gaugelid||!isFinite(lv)) continue;
          const at=a.obstime?Date.parse(String(a.obstime).replace(" ","T")+"Z"):NaN;
          out["nwsriv:"+a.gaugelid]={level:+(lv*FT).toFixed(3), at:isFinite(at)?at:null};
        }
        if(!d.exceededTransferLimit||!feats.length) break;
      }
      return out;
    }},
};

/** One reading set from whichever agency covers the country on screen. */
async function fetchLive(src){
  if(src.fetch) return await src.fetch(map.getBounds());
  const r=await fetch(src.url(map.getBounds()),{cache:"no-store"});
  if(!r.ok) return null;
  return src.parse(await r.json());
}

//: Live is on unless this visitor has turned it off. `null` in storage means they have
//: never expressed a preference, which is now a yes plus a disclosure.
const LIVE_PREF=localStorage.getItem("seraphim_live");
let liveOn = LIVE_PREF===null ? true : LIVE_PREF==="1";
let liveAt = null, liveFail = false, liveCount = 0, liveTimer = null;
//: Set while the tab is hidden. Refreshes are skipped rather than the timer cancelled,
//: so coming back to the tab gets fresh data on the next tick without re-arming.
let livePaused = false;
//: Live refresh interval, ms. 2 minutes, matching the fastest gauge network's own
//: reporting cadence; refreshing faster returns the same numbers.
const LIVE_EVERY = 120000;

function liveSource(){ return LIVE_SOURCES[country] || null; }

/** Tell a first-time visitor who their browser is about to talk to, once. */
function liveDisclosure(){
  if(LIVE_PREF!==null) return;                 // they have already chosen
  const src=liveSource(); if(!src) return;
  try{ localStorage.setItem("seraphim_live","1"); }catch{}
  toast({
    kind:"info", key:"live-first", timeout:16000,
    title:t("live_on"),
    body:`${t("live_first")} ${src.label} ${t("live_first2")}`,
    action:{label:t("live_ok")},
  });
}

async function refreshLive(){
  const src=liveSource();
  if(!liveOn||!src||!map||livePaused){ return; }
  let readings=null;
  try{ readings=await fetchLive(src); }catch{ readings=null; }
  if(!readings||!Object.keys(readings).length){
    // Keep the snapshot on screen and say the live fetch failed. Falling back quietly
    // to build-time data while a "live" badge pulses would be a lie.
    liveFail=true; renderChrome(); return;
  }
  liveFail=false; liveAt=Date.now(); liveCount=0;
  for(const f of gj.features){
    const hit=readings[f.properties.id];
    if(!hit) continue;
    const p=f.properties;
    if(p.snap_level===undefined){         // remember the build's own numbers once
      p.snap_level=p.level_msl; p.snap_level_at=p.observed_at||null;
      p.snap_risk=p.risk_level; p.snap_freeboard=p.freeboard_m;
    }
    p.live_level=hit.level; p.live_at=hit.at; p.live=true;
    p.level_msl=hit.level;
    if(hit.at!=null){
      p.data_age_min=Math.max(0,(Date.now()-hit.at)/60000);
      // A gauge that was stale at build time but is reporting now is not stale.
      // The reverse also holds, and matters more: one that has fallen silent since
      // must start looking silent.
      p.stale = p.data_age_min > 180;
    }
    liveCount++;
    const bank=p.bank_msl==null?null:Number(p.bank_msl);
    if(bank!=null&&isFinite(bank)){
      p.freeboard_m=+(bank-hit.level).toFixed(3);
      // Escalate only. 5 is an observed fact; anything lower may rest on a forecast
      // or a tide window that this single reading cannot see.
      if(p.freeboard_m<=0){
        p.live_over_bank = Number(p.snap_risk)<5;
        p.risk_level=5;
      }
    }
  }
  // The timeline colours from a baseline; a live reading changes what that baseline
  // is, so drop it and let applyTimeline take the new value as "now".
  for(const f of gj.features) delete f.properties.base_risk;
  applyTimeline();
  checkWatches();
  renderChrome();
}

/** Put every gauge back to exactly what the build published. */
function clearLive(){
  for(const f of gj.features) delete f.properties.base_risk;
  for(const f of gj.features){
    const p=f.properties;
    if(p.snap_level===undefined) continue;
    p.level_msl=p.snap_level; p.risk_level=p.snap_risk; p.freeboard_m=p.snap_freeboard;
    delete p.live; delete p.live_level; delete p.live_at; delete p.live_over_bank;
  }
  liveAt=null; liveFail=false; liveCount=0;
  if(map&&map.getSource("st")) map.getSource("st").setData(gj);
}

function setLive(on){
  liveOn=on;
  try{ localStorage.setItem("seraphim_live", on?"1":"0"); }catch{}
  if(liveTimer){ clearInterval(liveTimer); liveTimer=null; }
  if(on){
    refreshLive();
    liveTimer=setInterval(refreshLive, LIVE_EVERY);
  } else {
    clearLive();
    dismissToast("live-first");
  }
  renderChrome();
}

/** Stop talking to the agency while nobody is looking at the map.
 *
 *  Without this, live-on-by-default means every abandoned tab keeps pulling a
 *  multi-megabyte national feed every two minutes forever. Coming back refreshes
 *  immediately, so returning to the tab never shows a stale "live" badge. */
function watchVisibility(){
  document.addEventListener("visibilitychange",()=>{
    livePaused=document.hidden;
    if(document.hidden){ renderChrome(); return; }
    if(liveOn) refreshLive();
    renderAge();
    renderChrome();
  });
}

function renderWatchList(){
  const el=$("watchlist"); if(!el) return;
  $("h-watch").textContent=t("watching");
  const ids=watchList();
  const blocked="Notification" in window && Notification.permission==="denied";
  const hint=`<div class="conf" style="margin-top:6px">${
    esc(blocked?t("watchblocked"):t("watchhint"))}</div>`;
  if(!ids.length){
    el.innerHTML=`<div class="conf">${esc(t("watchnone"))}</div>`; return;
  }
  const byId=new Map((gj?.features||[]).map(f=>[f.properties.id,f.properties]));
  el.innerHTML=ids.map(id=>{
    const p=byId.get(id);
    const lvl=p?Number(p.risk_level)||1:null;
    const col=lvl?RISK[lvl]:"#6b7280";
    return `<div class="wrow" data-goto="${esc(id)}">
      <span class="d" style="background:${col}"></span>
      <span class="wname">${esc(p?.name||id)}</span>
      <button class="wdel" data-unwatch="${esc(id)}" title="remove">✕</button>
    </div>`;
  }).join("")+hint;
  el.querySelectorAll("[data-goto]").forEach(r=>r.onclick=(e)=>{
    if(e.target.closest("[data-unwatch]")) return;
    openStationById(r.dataset.goto); $("sheet").classList.remove("open");
  });
  el.querySelectorAll("[data-unwatch]").forEach(b=>b.onclick=async (e)=>{
    e.stopPropagation(); await toggleWatch(b.dataset.unwatch);
  });
}

function renderLiveBar(){
  const src=liveSource(), el=$("livebar");
  if(!el) return;
  if(!src){
    el.innerHTML=`<button id="livebtn" class="off" disabled style="opacity:.55">
      <span class="box"></span><span>${esc(t("live_na"))}</span></button>`;
    return;
  }
  const sub = !liveOn ? t("live_hint")
    : liveFail ? t("live_fail")
    : livePaused ? t("live_paused")
    : `${t("live_src")}: ${src.label}`
      + (liveAt?` · ${ageText((Date.now()-liveAt)/60000)} ${t("ago")}`:"")
      + (liveCount?` · ${liveCount} ${t("gauges")}`:"");
  el.innerHTML=`<button id="livebtn" class="${liveOn?"on":"off"}${
      liveOn&&livePaused?" paused":""}" type="button">
    <span class="box">✓</span><span class="pulse"></span>
    <span>${esc(liveOn?t("live_on"):t("live_off"))}<small>${esc(sub)}</small></span>
  </button>`;
  const b=$("livebtn");
  if(b) b.onclick=()=>setLive(!liveOn);
}

async function load(){
  index = await j("index.json");
  const first = await loadCountry(country) || await loadCountry("th");
  if(!first) return false;
  gj = mergedStations();
  areas = mergedAreas();
  // Province shapes and tide points exist only for Thailand, so they are not part of
  // what every visitor pays for.
  [meta,quakes,fires,events,terrain,dams,pastFloods]=await Promise.all([
    j("meta.json"), j("quakes.geojson"), j("fires.geojson"), j("events.geojson"),
    j("terrain.geojson"), j("dams.geojson"), j("floods-past.geojson")]);
  gfh = await j("floods-google.geojson");
  cameras = await j("cameras.geojson");
  if(country==="th"||loaded.th){
    [tide,provinces]=await Promise.all([j("tide.json"), j("provinces.geojson")]);
  }
  return !!gj;
}

function addLayers(){
  if(provinces && !map.getSource("prov")){
    map.addSource("prov",{type:"geojson",data:provinces});
    map.addLayer({id:"prov-fill",type:"fill",source:"prov",paint:{
      "fill-color":["case",["==",["get","level"],null],"#2a2f36",
        ["==",["get","level"],5],RISK[5],["==",["get","level"],4],RISK[4],
        ["==",["get","level"],3],RISK[3],["==",["get","level"],2],RISK[2],RISK[1]],
      "fill-opacity":["case",["==",["get","level"],null],.10,
        [">=",["get","level"],4],.34,[">=",["get","level"],3],.26,.15]}});
    map.addLayer({id:"prov-line",type:"line",source:"prov",paint:{
      "line-color":["case",[">=",["coalesce",["get","level"],0],4],RISK[5],"rgba(255,255,255,.28)"],
      "line-width":["case",[">=",["coalesce",["get","level"],0],4],1.6,.6]}});
  }
  if(!map.getSource("st")){
    map.addSource("st",{type:"geojson",data:gj});
    // A soft halo under a hard core: reads as a signal on a photo basemap, where a
    // flat dot disappears against terrain.
    map.addLayer({id:"st-glow",type:"circle",source:"st",paint:{
      "circle-color":modeColor(),"circle-blur":1,
      "circle-radius":["interpolate",["linear"],["zoom"],4,["case",modeBig(),9,3],
        9,["case",modeBig(),20,7],13,["case",modeBig(),32,13]],
      // Static. The breathing moved to st-alert below; animating this one meant
      // re-evaluating paint for every gauge on the map fourteen times a second.
      "circle-opacity":["case",["get","stale"],.18,.45]}});
    // The pulsing ring, and the only layer that animates. Filtered to level 4+, so the
    // animation touches a few dozen features instead of the whole network.
    map.addLayer({id:"st-alert",type:"circle",source:"st",
      filter:[">=",["coalesce",["get","risk_level"],0],4],
      paint:{
        "circle-color":"rgba(0,0,0,0)",
        "circle-radius":["interpolate",["linear"],["zoom"],4,7,9,17,13,30],
        "circle-stroke-width":2,
        "circle-stroke-color":["case",["==",["get","risk_level"],5],RISK[5],RISK[4]],
        "circle-opacity":.4,"circle-stroke-opacity":.9}});
    map.addLayer({id:"st-core",type:"circle",source:"st",paint:{
      "circle-color":modeColor(),
      "circle-radius":["interpolate",["linear"],["zoom"],4,["case",modeBig(),3.6,2.1],
        9,["case",modeBig(),7.5,4.4],13,["case",modeBig(),12,8]],
      "circle-stroke-width":["case",["get","stale"],1,.9],
      "circle-stroke-color":["case",["get","stale"],"rgba(255,255,255,.35)","rgba(255,255,255,.85)"],
      "circle-opacity":["case",["get","stale"],.5,.96]}});
    map.on("click","st-core",e=>stationPopup(e));
    map.on("mouseenter","st-core",()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave","st-core",()=>map.getCanvas().style.cursor="");
  }
  if(tide?.points?.length && !map.getSource("tide")){
    map.addSource("tide",{type:"geojson",data:{type:"FeatureCollection",
      features:tide.points.map(p=>({type:"Feature",geometry:{type:"Point",coordinates:[p.lon,p.lat]},
        properties:{...p,next:JSON.stringify(p.next||[])}}))}});
    map.addLayer({id:"tide-c",type:"circle",source:"tide",paint:{
      "circle-color":"#22d3ee","circle-radius":["interpolate",["linear"],["zoom"],4,3.4,9,6,13,9],
      "circle-stroke-width":1.4,"circle-stroke-color":"rgba(255,255,255,.9)","circle-opacity":.95}});
    map.on("click","tide-c",e=>tidePopup(e));
    map.on("mouseenter","tide-c",()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave","tide-c",()=>map.getCanvas().style.cursor="");
  }
  addHazardLayers();
  applyVisibility();
  pulse();
}

function addHazardLayers(){
