    map.addLayer({id:"quake-c",type:"circle",source:"quakes",paint:{
      "circle-color":["interpolate",["linear"],["get","mag"],2,"#fde68a",4,"#f59e0b",6,"#dc2626",7.5,"#7f1d1d"],
      "circle-radius":["interpolate",["linear"],["zoom"],
        2,["interpolate",["linear"],["get","mag"],1,1.5,5,5,8,11],
        7,["interpolate",["linear"],["get","mag"],1,4,5,13,8,28]],
      "circle-opacity":.5,"circle-stroke-width":1,"circle-stroke-color":"rgba(255,255,255,.7)"}});
    map.on("click","quake-c",e=>{
      const p=e.features[0].properties;
      const when=p.time?new Date(Number(p.time)).toLocaleString(LANG==="th"?"th-TH":"en-GB"):"-";
      new maplibregl.Popup({maxWidth:"270px"}).setLngLat(e.lngLat).setHTML(
        `<div class="pt" style="background:#f59e0b">M ${esc(p.mag)}</div>
         <div class="ph">${esc(p.place)||"-"}</div>
         <div class="pr"><span>${esc(t("depth"))}</span><span class="num">${esc(p.depth_km)} km</span></div>
         <div class="pr"><span>${esc(t("when"))}</span><span>${esc(when)}</span></div>`).addTo(map);
    });
    map.on("mouseenter","quake-c",()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave","quake-c",()=>map.getCanvas().style.cursor="");
  }
  if(fires && !map.getSource("fires")){
    map.addSource("fires",{type:"geojson",data:fires});
    map.addLayer({id:"fire-c",type:"circle",source:"fires",paint:{
      "circle-color":"#f97316","circle-blur":.7,
      "circle-radius":["interpolate",["linear"],["zoom"],4,2.5,9,6,13,12],
      "circle-opacity":.75}});
    map.on("click","fire-c",e=>{
      const p=e.features[0].properties;
      new maplibregl.Popup({maxWidth:"250px"}).setLngLat(e.lngLat).setHTML(
        `<div class="pt" style="background:#f97316">${esc(t("fires"))}</div>
         <div class="pr"><span>${esc(t("frp"))}</span><span class="num">${esc(p.frp)} MW</span></div>
         <div class="pr"><span>${esc(t("conf"))}</span><span>${esc(p.confidence)}</span></div>
         <div class="pr"><span>${esc(t("when"))}</span><span>${esc(p.acq_date)} ${esc(p.acq_time)}</span></div>`).addTo(map);
    });
  }
  if(events && !map.getSource("events")){
    map.addSource("events",{type:"geojson",data:events});
    map.addLayer({id:"event-c",type:"circle",source:"events",paint:{
      "circle-color":["match",["get","alert"],"red","#ef4444","orange","#f97316","#22c55e"],
      "circle-radius":["interpolate",["linear"],["zoom"],1,5,4,9,8,16],
      "circle-opacity":.35,"circle-stroke-width":1.5,
      "circle-stroke-color":["match",["get","alert"],"red","#ef4444","orange","#f97316","#22c55e"]}});
    map.on("click","event-c",e=>{
      const p=e.features[0].properties;
      new maplibregl.Popup({maxWidth:"280px"}).setLngLat(e.lngLat).setHTML(
        `<div class="pt" style="background:${p.alert==="red"?"#ef4444":p.alert==="orange"?"#f97316":"#22c55e"}">${esc(p.alert)}</div>
         <div class="ph">${esc(p.kind)}${p.name?": "+esc(p.name):""}</div>
         <div class="psub">${esc(p.country)||""}</div>
         ${p.severity?`<div class="pr"><span>${esc(t("alert"))}</span><span>${esc(p.severity)}</span></div>`:""}
         <div class="pr"><span>${esc(t("when"))}</span><span>${esc(String(p.from).slice(0,10))}</span></div>`).addTo(map);
    });
    map.on("mouseenter","event-c",()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave","event-c",()=>map.getCanvas().style.cursor="");
  }
  if(dams && !map.getSource("dams")){
    map.addSource("dams",{type:"geojson",data:dams});
    // A reservoir is a store, not a channel, so it is coloured by how full it is
    // rather than by flood risk: teal normal, amber high, red once it is above its
    // normal full level. Large dams are drawn bigger than medium ones.
    map.addLayer({id:"dams-c",type:"circle",source:"dams",paint:{
      "circle-color":["match",["get","status"],
        "spilling","#e5484d","high","#f59e0b","normal","#14b8a6","#6b7280"],
      "circle-stroke-color":"rgba(0,0,0,.55)","circle-stroke-width":1,
      "circle-radius":["interpolate",["linear"],["zoom"],
        4,["case",["==",["get","size"],"large"],5,3],
        8,["case",["==",["get","size"],"large"],10,6],
        13,["case",["==",["get","size"],"large"],18,11]],
      "circle-opacity":.9}});
    map.on("click","dams-c",e=>{
      const p=e.features[0].properties;
      const n=k=>(p[k]==null||p[k]==="")?null:Number(p[k]);
      const pct=n("storage_percent");
      const col=p.status==="spilling"?"#e5484d":p.status==="high"?"#f59e0b":"#14b8a6";
      const row=(lbl,val)=>val==null?"":
        `<div class="pr"><span>${esc(lbl)}</span><span class="num">${esc(val)}</span></div>`;
      new maplibregl.Popup({maxWidth:"290px"}).setLngLat(e.lngLat).setHTML(
        `<div class="pt" style="background:${col}">${esc(t("dam_"+(p.status==="spilling"?"spilling":p.status==="high"?"high":"normal")))}</div>
         <div class="ph">${esc(p.name)||"-"}</div>
         <div class="psub">${esc(p.province)||""} ${esc(p.basin)||""} · ${esc(t(p.size==="large"?"dam_large":"dam_medium"))}</div>
         ${row(t("dam_pct"), pct==null?null:pct+"%")}
         ${row(t("dam_lvl"), n("level_msl")==null?null:n("level_msl")+" m")}
         ${row(t("dam_in"), n("inflow_mcm")==null?null:n("inflow_mcm")+" "+t("mcm"))}
         ${row(t("dam_out"), n("released_mcm")==null?null:n("released_mcm")+" "+t("mcm"))}
         ${row(t("dam_spill"), n("spilled_mcm")==null?null:n("spilled_mcm")+" "+t("mcm"))}
         ${row(t("ageL"), ageText(n("age_hours")==null?null:n("age_hours")*60))}
         ${row(t("agency"), p.agency)}
         <div class="conf">${esc(t("dam_note"))}</div>`).addTo(map);
    });
    map.on("mouseenter","dams-c",()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave","dams-c",()=>map.getCanvas().style.cursor="");
  }
  // --- flood-prone ground -------------------------------------------------
  // Drawn from the gauge layer's own source, filtered to cells that run high often.
  // Underneath the gauges, and deliberately soft and wide: this is a statement about
  // decades, and it must not compete with a dot that is over its bank this morning.
  if(!map.getLayer("prone-c") && map.getSource("st")){
    const under = map.getLayer("st-glow") ? "st-glow" : undefined;
    map.addLayer({id:"prone-c",type:"circle",source:"st",
      filter:[">=",["coalesce",["get","flood_prone"],0],1],
      paint:{
        "circle-color":["match",["coalesce",["get","flood_prone"],0],
          3,"#b91c1c",2,"#f97316","#fbbf24"],
        "circle-blur":.75,
        "circle-radius":["interpolate",["linear"],["zoom"],
          5,["match",["coalesce",["get","flood_prone"],0],3,7,2,5,3],
          9,["match",["coalesce",["get","flood_prone"],0],3,20,2,14,9],
          13,["match",["coalesce",["get","flood_prone"],0],3,40,2,28,18]],
        "circle-opacity":.3}}, under);
    // A separate, harder ring for the predicted half: ground that is flood-prone AND
    // forecast to reach a 2- or 5-year flow. The two say different things and a reader
    // has to be able to tell which one they are looking at.
    map.addLayer({id:"prone-pred",type:"circle",source:"st",
      filter:["all",["has","flood_outlook_day"],
              ["<=",["coalesce",["get","flood_outlook_day"],99],14]],
      paint:{
        "circle-color":"rgba(0,0,0,0)",
        "circle-radius":["interpolate",["linear"],["zoom"],5,6,9,15,13,26],
        "circle-stroke-width":2,
        "circle-stroke-color":["case",
          ["==",["coalesce",["get","flood_outlook_period_y"],2],5],"#b91c1c","#f97316"],
        "circle-stroke-opacity":.85}}, under);
  }

  // --- past floods ---------------------------------------------------------
  if(pastFloods?.features?.length && !map.getSource("pastfloods")){
    map.addSource("pastfloods",{type:"geojson",data:pastFloods});
    map.addLayer({id:"past-c",type:"circle",source:"pastfloods",paint:{
      "circle-color":["match",["get","alert"],"red","#dc2626","#c084fc"],
      // Longer floods draw bigger. A 158-day event and a 1-day one are not the same
      // thing and a reader should be able to see which is which before clicking.
      "circle-radius":["interpolate",["linear"],["zoom"],
        1,["interpolate",["linear"],["coalesce",["get","days"],1],1,3,30,6,150,10],
        6,["interpolate",["linear"],["coalesce",["get","days"],1],1,7,30,15,150,26]],
      "circle-opacity":.3,"circle-stroke-width":1.4,
      "circle-stroke-color":["match",["get","alert"],"red","#dc2626","#c084fc"],
      "circle-stroke-opacity":.85}});
    map.on("click","past-c",e=>{
      const p=e.features[0].properties;
      const red=p.alert==="red";
      new maplibregl.Popup({maxWidth:"300px"}).setLngLat(e.lngLat).setHTML(
        `<div class="pt" style="background:${red?"#dc2626":"#c084fc"}">${esc(t("pastfloods"))}</div>
         <div class="ph">${esc(p.name)||esc(t("pastfloods"))}</div>
         <div class="pr"><span>${esc(t("pf_when"))}</span><span class="num">${esc(p.from)}${
           p.to&&p.to!==p.from?" → "+esc(p.to):""}</span></div>
         ${p.days?`<div class="pr"><span>${esc(t("pf_days"))}</span><span class="num">${esc(p.days)} ${esc(t("day"))}</span></div>`:""}
         <div class="pr"><span>${esc(t("pf_where"))}</span><span>${esc(p.countries||p.country||"-")}</span></div>
         <div class="pr"><span>${esc(t("alert"))}</span><span>${esc(p.alert)}</span></div>
         ${p.url?`<div class="conf" style="margin-top:6px"><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(t("pf_report"))} ↗</a></div>`:""}
         <div class="conf">${esc(t("pf_note"))}</div>`).addTo(map);
    });
    map.on("mouseenter","past-c",()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave","past-c",()=>map.getCanvas().style.cursor="");
  }

  // --- Google Flood Hub -----------------------------------------------------
  // Drawn as a hollow diamond-ish ring rather than a filled dot, so it never reads as
  // one of our own gauges. This is somebody else's forecast about the same rivers, and
  // the whole value of having it is being able to see where it disagrees with us.
  if(gfh?.features?.length && !map.getSource("gfh")){
    map.addSource("gfh",{type:"geojson",data:gfh});
    map.addLayer({id:"gfh-ring",type:"circle",source:"gfh",paint:{
      "circle-color":"rgba(0,0,0,0)",
      "circle-radius":["interpolate",["linear"],["zoom"],
        3,["match",["get","level"],5,7,4,6,4],
        8,["match",["get","level"],5,17,4,14,10],
        13,["match",["get","level"],5,30,4,25,18]],
      "circle-stroke-width":2.4,
      "circle-stroke-color":["match",["get","level"],
        5,RISK[5],4,RISK[4],3,RISK[3],"#4285f4"],
      // A lower-confidence point is drawn fainter rather than hidden or made equal.
      // Google flags ~240,000 of these against ~5,000 verified; the flag is the
      // difference between a forecast and a guess and it must survive to the screen.
      "circle-stroke-opacity":["case",["get","quality_verified"],.95,.4]}});
    map.addLayer({id:"gfh-c",type:"circle",source:"gfh",paint:{
      "circle-color":["match",["get","level"],5,RISK[5],4,RISK[4],3,RISK[3],"#4285f4"],
      "circle-radius":["interpolate",["linear"],["zoom"],3,1.6,8,3.4,13,5],
      "circle-opacity":["case",["get","quality_verified"],.9,.35]}});
    map.on("click","gfh-c",e=>gfhPopup(e));
    map.on("click","gfh-ring",e=>gfhPopup(e));
    map.on("mouseenter","gfh-ring",()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave","gfh-ring",()=>map.getCanvas().style.cursor="");
  }

  // Street cameras. Drawn as a small square so they never read as a gauge: a camera
  // measures nothing, and the whole point of the layer is that it is a *different kind
  // of evidence* sitting next to the numbers rather than another number.
  if(cameras?.features?.length && !map.getSource("cctv")){
    map.addSource("cctv",{type:"geojson",data:cameras});
    map.addLayer({id:"cctv-c",type:"circle",source:"cctv",paint:{
      "circle-color":"#eab308",
      "circle-radius":["interpolate",["linear"],["zoom"],7,3,11,6,15,9],
      // Liveness is the *measured* stream_ok, never the source's signal_status, which
      // claims all five are up while one has no stream at all. A camera we could not
      // check (null) is drawn like a live one rather than like a dark one: reporting
      // our own outage as the municipality's would be the wrong way round.
      "circle-opacity":["case",["==",["get","stream_ok"],false],.3,.95],
      "circle-stroke-width":1.4,
      "circle-stroke-color":["case",["==",["get","stream_ok"],false],
        "rgba(255,255,255,.35)","#fff"]}});
    map.on("click","cctv-c",e=>cameraPopup(e));
    map.on("mouseenter","cctv-c",()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave","cctv-c",()=>map.getCanvas().style.cursor="");
  }

  if(terrain && !map.getSource("terrain")){
    map.addSource("terrain",{type:"geojson",data:terrain});
    // Under the gauges: this is context for a spilling channel, not the alert itself.
    const under = map.getLayer("st-glow") ? "st-glow" : undefined;
    map.addLayer({id:"terrain-c",type:"circle",source:"terrain",paint:{
      "circle-color":"#8b5cf6","circle-blur":.85,
      "circle-radius":["interpolate",["linear"],["zoom"],
        7,["interpolate",["linear"],["get","below_gauge_m"],1,4,8,12],
        13,["interpolate",["linear"],["get","below_gauge_m"],1,16,8,46]],
      "circle-opacity":.42}}, under);
    map.on("click","terrain-c",e=>{
      const p=e.features[0].properties;
      new maplibregl.Popup({maxWidth:"270px"}).setLngLat(e.lngLat).setHTML(
        `<div class="pt" style="background:#8b5cf6">${esc(t("terrain"))}</div>
         <div class="pr"><span>${esc(t("below"))}</span><span class="num">${esc(p.below_gauge_m)} m</span></div>
         <div class="pr"><span>${esc(t("nearstn"))}</span><span>${esc(p.station_name)}</span></div>
         <div class="pr"><span>${esc(t("over_bank"))}</span><span class="num">${esc(p.over_bank_m)} m</span></div>
         <div class="conf">${esc(t("tcav"))}</div>`).addTo(map);
    });
    map.on("mouseenter","terrain-c",()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave","terrain-c",()=>map.getCanvas().style.cursor="");
  }
  if(!map.getSource("radar")) initRadar();
  if(!map.getSource("radio")) initRadio();
}

/* ---------- rain radar (RainViewer, animated) ---------- */
async function initRadar(){
  const idx=await fetch("https://api.rainviewer.com/public/weather-maps.json")
    .then(r=>r.json()).catch(()=>null);
  if(!idx||!idx.radar?.past?.length) return;
  radarFrames=[...idx.radar.past, ...(idx.radar.nowcast||[])]
    .map(f=>`${idx.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`);
  radarIdx=idx.radar.past.length-1;
  map.addSource("radar",{type:"raster",tiles:[radarFrames[radarIdx]],tileSize:256,
    attribution:"Radar © RainViewer"});
  // Under the markers: weather is context, the gauges are the point.
  const before=map.getLayer("prov-fill")?"prov-fill":undefined;
  map.addLayer({id:"radar-r",type:"raster",source:"radar",
    paint:{"raster-opacity":.6}},before);
  applyVisibility();
  startRadar();
}
function startRadar(){
  clearInterval(radarTimer);
  radarTimer=setInterval(()=>{
    if(!shown.radar||!radarFrames.length||!map.getSource("radar")) return;
    radarIdx=(radarIdx+1)%radarFrames.length;
    map.getSource("radar").setTiles([radarFrames[radarIdx]]);
  },900);
}

function modeColor(){
  if(mode==="risk") return ["case",["==",["get","risk_level"],null],"#6b7280",
    ["==",["get","risk_level"],5],RISK[5],["==",["get","risk_level"],4],RISK[4],
    ["==",["get","risk_level"],3],RISK[3],["==",["get","risk_level"],2],RISK[2],RISK[1]];
  if(mode==="level") return ["case",["get","stale"],"#6b7280",
    ["==",["get","freeboard_m"],null],"#6b7280",["<=",["get","freeboard_m"],0],RISK[5],
    ["<",["get","freeboard_m"],.5],RISK[3],["<",["get","freeboard_m"],1.5],RISK[2],RISK[1]];
  if(mode==="rain") return ["case",["==",["get","rain_next_24h_mm"],null],"#6b7280",
    [">=",["get","rain_next_24h_mm"],90],"#a855f7",[">=",["get","rain_next_24h_mm"],50],RISK[5],
    [">=",["get","rain_next_24h_mm"],20],RISK[3],[">=",["get","rain_next_24h_mm"],5],RISK[2],"#0ea5e9"];
  return ["case",["==",["get","discharge_rise_ratio"],null],"#6b7280",
    [">=",["get","discharge_rise_ratio"],4],RISK[5],[">=",["get","discharge_rise_ratio"],2],RISK[3],
    [">=",["get","discharge_rise_ratio"],1.2],RISK[2],RISK[1]];
}
function modeBig(){
  if(mode==="risk") return [">=",["coalesce",["get","risk_level"],0],4];
  if(mode==="level") return ["<=",["coalesce",["get","freeboard_m"],99],0];
  if(mode==="rain") return [">=",["coalesce",["get","rain_next_24h_mm"],0],50];
  return [">=",["coalesce",["get","discharge_rise_ratio"],0],2];
}
function repaint(){
  if(!map.getLayer("st-core")) return;
  for(const id of ["st-glow","st-core"]) map.setPaintProperty(id,"circle-color",modeColor());
  map.setPaintProperty("st-glow","circle-radius",["interpolate",["linear"],["zoom"],
    4,["case",modeBig(),9,3],9,["case",modeBig(),20,7],13,["case",modeBig(),32,13]]);
  map.setPaintProperty("st-core","circle-radius",["interpolate",["linear"],["zoom"],
    4,["case",modeBig(),3.6,2.1],9,["case",modeBig(),7.5,4.4],13,["case",modeBig(),12,8]]);
}
/* ---------------------------------------------------------------- the pulse
 * Slow breathing to draw the eye to the worst places. The mechanism matters more than
 * it looks:
 *
 * The first version ran `setPaintProperty` on the 16,000-feature gauge layer every
 * 70 ms, from a `setInterval`, for the lifetime of the page. That is ~14 full paint
 * re-evaluations of every gauge on the map per second, whether or not anything was at
 * risk, whether or not the layer was even visible, and whether or not the tab was in
 * front. It is the single largest reason panning and zooming stuttered, and on a phone
 * it is a battery drain running against a map somebody may need later.
 *
 * Three changes:
 *   - it animates a SEPARATE layer filtered to level 4 and above, which is a few dozen
 *     features rather than sixteen thousand;
 *   - requestAnimationFrame instead of setInterval, so the browser stops it outright
 *     when the tab is in the background, and throttled to ~20 fps because a breathing
 *     halo does not need 60;
 *   - it stops entirely when nothing is at level 4+, when the layer is hidden, or when
 *     the reader has asked for reduced motion. A static ring still marks the place.
 */
const REDUCED_MOTION = window.matchMedia
  && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let pulseRAF=null, pulseK=0, pulseLast=0, pulseWanted=false;

function pulseFrame(now){
  pulseRAF=null;
  if(!pulseWanted) return;
  if(now-pulseLast >= 50){                       // ~20 fps is plenty for a slow breath
    pulseLast=now;
    pulseK+=0.13;
    if(map.getLayer("st-alert"))
      map.setPaintProperty("st-alert","circle-opacity", 0.30+Math.sin(pulseK)*0.22);
  }
  pulseRAF=requestAnimationFrame(pulseFrame);
}

/** Start or stop the pulse based on whether anything actually warrants it. */
function pulse(){
  if(!map) return;
  const any = !REDUCED_MOTION && shown.stations
    && (gj?.features||[]).some(f=>Number(f.properties.risk_level)>=4);
  if(any===pulseWanted) return;
  pulseWanted=any;
  if(any && pulseRAF===null) pulseRAF=requestAnimationFrame(pulseFrame);
  if(!any){
    if(pulseRAF!==null){ cancelAnimationFrame(pulseRAF); pulseRAF=null; }
    // Leave the ring visible and still, rather than mid-fade at whatever opacity the
    // last frame happened to land on.
    if(map.getLayer("st-alert")) map.setPaintProperty("st-alert","circle-opacity",.4);
  }
}
/* ---------- geolocated world radio, with an analog tuner ----------
 * Idea borrowed from bilawalsidhu/gods-eye-view (MIT), which pairs Radio Browser with
 * a map. The dial here is ordered by distance from wherever you are looking, so
 * sweeping it walks outward from the middle of the screen rather than through a list.
 * Only HTTPS streams are kept: an http stream on an https page is blocked as mixed
 * content, so offering one would just be a button that silently does nothing.
 */
async function initRadio(){
  const r=await fetch("https://de1.api.radio-browser.info/json/stations/search"
    +"?has_geo_info=true&hidebroken=true&limit=800&order=clickcount&reverse=true",
    {headers:{"Content-Type":"application/json"}}).then(x=>x.json()).catch(()=>null);
  if(!Array.isArray(r)) return;
  radioAll=r.filter(x=>x.geo_lat&&x.geo_long&&(x.url_resolved||"").startsWith("https"))
    .map(x=>({name:x.name.trim(),url:x.url_resolved,cc:x.countrycode,
              lat:+x.geo_lat,lon:+x.geo_long,bitrate:x.bitrate,tags:(x.tags||"").split(",")[0]}));
  if(!radioAll.length) return;

  map.addSource("radio",{type:"geojson",data:{type:"FeatureCollection",
    features:radioAll.map((x,i)=>({type:"Feature",
      geometry:{type:"Point",coordinates:[x.lon,x.lat]},properties:{i,name:x.name,cc:x.cc}}))}});
  map.addLayer({id:"radio-c",type:"circle",source:"radio",paint:{
    "circle-color":"#a78bfa","circle-radius":["interpolate",["linear"],["zoom"],3,2.2,8,5,13,8],
    "circle-opacity":.85,"circle-stroke-width":1,"circle-stroke-color":"rgba(255,255,255,.65)"}});
  map.on("click","radio-c",e=>{
    const i=e.features[0].properties.i;
    refreshDial(); 
    const k=radioNear.findIndex(x=>x===radioAll[i]);
    tuneTo(k>=0?k:0, true);
    $("radio").classList.add("show");
  });
  map.on("mouseenter","radio-c",()=>map.getCanvas().style.cursor="pointer");
  map.on("mouseleave","radio-c",()=>map.getCanvas().style.cursor="");
  applyVisibility();
}

function km(a,b,c,d){
  const R=6371,r=Math.PI/180;
  const dp=(c-a)*r, dl=(d-b)*r;
  const x=Math.sin(dp/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function refreshDial(){
  if(!radioAll.length) return;
  const c=map.getCenter();
  radioNear=[...radioAll].sort((x,y)=>km(c.lat,c.lng,x.lat,x.lon)-km(c.lat,c.lng,y.lat,y.lon))
    .slice(0,40);
  drawDial();
}
function drawDial(){
  const cv=$("dialc"); if(!cv) return;
  const w=cv.clientWidth||320, h=46;
  cv.width=w*devicePixelRatio; cv.height=h*devicePixelRatio;
  const g=cv.getContext("2d"); g.scale(devicePixelRatio,devicePixelRatio);
  g.clearRect(0,0,w,h);
  g.strokeStyle="rgba(255,255,255,.16)"; g.lineWidth=1;
  radioNear.forEach((st,i)=>{
    const x=((i+0.5)/radioNear.length)*w;
    const major=i%5===0;
    g.beginPath(); g.moveTo(x, major?10:18); g.lineTo(x, h-12); g.stroke();
    if(major){
      g.fillStyle="rgba(255,255,255,.45)"; g.font="8px ui-monospace,monospace";
      g.fillText(st.cc||"", x-6, h-3);
    }
  });
  const nx=((radioIdx+0.5)/Math.max(radioNear.length,1))*w;
  $("needle").style.left=`${nx}px`;
}
function tuneTo(i, play){
  if(!radioNear.length) return;
  radioIdx=Math.max(0,Math.min(radioNear.length-1,i));
  const st=radioNear[radioIdx];
  $("rname").textContent=st.name;
  const c=map.getCenter();
  $("rmeta").textContent=`${st.cc||"?"} · ${st.bitrate||"?"} kbps · ${Math.round(km(c.lat,c.lng,st.lat,st.lon))} km`
    + (st.tags?` · ${st.tags}`:"");
  drawDial();
  if(play) playRadio(st);
  else if(audio&&!audio.paused) playRadio(st);
}
function playRadio(st){
  if(!audio){ audio=new Audio(); audio.crossOrigin="anonymous"; }
  audio.src=st.url; audio.play().then(()=>{
    $("rplay").textContent="⏸"; $("rplay").classList.add("playing");
  }).catch(()=>{
    // Dead streams are common in a crowd-sourced directory. Say so instead of
    // leaving a play button that does nothing.
    $("rplay").textContent="▶"; $("rplay").classList.remove("playing");
    $("rmeta").textContent="stream unavailable";
  });
}

function applyVisibility(){
  const set=(id,on)=>{ if(map.getLayer(id)) map.setLayoutProperty(id,"visibility",on?"visible":"none"); };
  set("prov-fill",shown.provinces); set("prov-line",shown.provinces);
  set("st-glow",shown.stations); set("st-core",shown.stations);
  set("st-alert",shown.stations);
  set("tide-c",shown.tide);
  set("radar-r",shown.radar);
  set("quake-c",shown.quakes);
  set("fire-c",shown.fires);
  set("radio-c",shown.radio);
  set("event-c",shown.events);
  set("terrain-c",shown.terrain);
  set("dams-c",shown.dams);
  set("prone-c",shown.floodprone);
  set("prone-pred",shown.floodprone);
  set("past-c",shown.pastfloods);
  set("gfh-c",shown.gfh);
  set("gfh-ring",shown.gfh);
  set("cctv-c",shown.cctv);
  $("radio").classList.toggle("show",shown.radio);
  if(shown.radio&&!radioNear.length) refreshDial();
  if(!shown.radio&&audio){ audio.pause(); $("rplay").textContent="▶";
    $("rplay").classList.remove("playing"); }
}

/* ------------------------------------------------------------ 3D terrain
 * Real elevation, not a stylised bump map: AWS's public Terrarium tiles, which are
 * Copernicus/SRTM encoded into RGB. Keyless, CORS-open, and the same DEM family the
 * gauge terrain profiles already use, so the hills under the map and the low-ground
 * layer draped on them come from the same measurement of the world.
 *
 * Off by default. It costs tiles, it costs GPU, and on a phone in a flood a flat map
 * that loads is worth more than a pretty one that stutters.
 */
const DEM_TILES="https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";
const DEM_ATTRIB="Elevation: AWS Terrain Tiles (Copernicus, SRTM, NED)";
//: Vertical exaggeration. Thailand's delta is nearly flat, and at 1x the 3D view of the
//: place that actually floods looks identical to the 2D one.
const TERRAIN_EXAGGERATION=1.6;
let terrain3d=false;

function setTerrain3D(on){
  terrain3d=on;
  try{ localStorage.setItem("seraphim_3d", on?"1":"0"); }catch{}
  if(!map) return;
  if(on){
    if(!map.getSource("dem")){
      map.addSource("dem",{type:"raster-dem",tiles:[DEM_TILES],tileSize:256,
        encoding:"terrarium",maxzoom:13,attribution:DEM_ATTRIB});
    }
    map.setTerrain({source:"dem",exaggeration:TERRAIN_EXAGGERATION});
    if(map.getPitch()<45) map.easeTo({pitch:60,duration:700});
  } else {
    map.setTerrain(null);
    if(map.getPitch()>5) map.easeTo({pitch:0,duration:500});
  }
  renderChrome();
}

/* -------------------------------------------------- the forecast timeline
 * "What happens next" as a scrub bar over numbers we already publish and have
 * measured: the damped level projection at +1/3/6/12 h.
 *
 * This is NOT a hydraulic simulation. There is no flow routing, no roughness, no
 * structures and no DEM at a resolution that could support one. What moves when you
 * drag the slider is each gauge's own projected water surface, which is a thing this
 * project measures its own accuracy on. Anything that looked like spreading water
 * would be invented, so nothing spreads.
 */
//: Steps. Hours are LEVELS, from the gauge's own damped projection. Days are FLOW,
//: from GloFAS, because beyond about twelve hours a level is not something this data
//: can support: converting discharge to metres needs a rating curve nobody publishes.
//: The two are deliberately labelled differently rather than blended into one scale.
const TIMELINE=[
  {h:0,   mode:"level"},
  {h:1,   mode:"level"},
  {h:3,   mode:"level"},
  {h:6,   mode:"level"},
  {h:12,  mode:"level"},
  {d:3,   mode:"flow"},
  {d:7,   mode:"flow"},
  {d:14,  mode:"flow"},
  {d:30,  mode:"flow"},
];
//: Flow multiples worth colouring. Matches the risk engine's own outlook threshold, so
//: the map and the reasoning text agree about what a meaningful rise is.
const FLOW_WATCH=1.8, FLOW_STRONG=3.0;
let timeIndex=0;

function stepLabel(st){
  if(st.mode==="flow") return "+"+st.d+"d";
  return st.h===0 ? t("tl_now") : "+"+st.h+"h";
}

/** Projected flow divided by today's, at a day step, or null. */
function flowRatioAt(p, day){
  let o=p.discharge_outlook_cms;
  if(typeof o==="string"){ try{o=JSON.parse(o);}catch{o=null;} }
  if(!Array.isArray(o)||o.length<=day) return null;
  const now=Number(o[0]), then=Number(o[day]);
  if(!isFinite(now)||!isFinite(then)||now<0.1) return null;
  return then/now;
}

/** Level at the selected step: the observed level at 0, the projection after that. */
function levelAt(p, hours){
  if(hours<=0) return p.level_msl==null?null:Number(p.level_msl);
  let fc=p.level_forecast;
  if(typeof fc==="string"){ try{fc=JSON.parse(fc);}catch{fc=null;} }
  if(!Array.isArray(fc)) return null;
  const hit=fc.find(f=>Number(f.in_hours)===hours);
  return hit?Number(hit.level_msl):null;
}

/** Freeboard at the selected step, or null where no honest projection exists. */
function freeboardAt(p, hours){
  const bank=p.bank_msl==null?null:Number(p.bank_msl);
  const lvl=levelAt(p, hours);
  if(bank==null||lvl==null||!isFinite(bank)||!isFinite(lvl)) return null;
  return bank-lvl;
}

/** Recolour the gauge layer for the selected step. */
function applyTimeline(){
  if(!gj||!map||!map.getSource("st")) return;
  const st=TIMELINE[timeIndex];
  for(const f of gj.features){
    const p=f.properties;
    if(p.base_risk===undefined) p.base_risk=p.risk_level;
    p.t_fb=null; p.t_flow=null;

    if(st.mode==="level"){
      if(st.h===0){ p.risk_level=p.base_risk; p.t_fb=p.freeboard_m; continue; }
      const fb=freeboardAt(p, st.h);
      p.t_fb=fb;
      // Only ever raises. A projection may warn; it may not reassure, because the
      // published score can rest on rain, a tide window or an upstream signal that a
      // single gauge's own trend line knows nothing about.
      p.risk_level = (fb!=null&&fb<=0) ? Math.max(5, p.base_risk||1)
                   : (fb!=null&&fb<=0.5) ? Math.max(4, p.base_risk||1)
                   : p.base_risk;
    } else {
      // Flow, not level. It never reaches 5: 5 means water is over the bank, an
      // observation, and a flow multiple three weeks out is not one.
      const r=flowRatioAt(p, st.d);
      p.t_flow=r;
      p.risk_level = (r!=null&&r>=FLOW_STRONG) ? Math.max(4, p.base_risk||1)
                   : (r!=null&&r>=FLOW_WATCH)  ? Math.max(3, p.base_risk||1)
                   : p.base_risk;
    }
  }
  map.getSource("st").setData(gj);
  pulse();
  renderTimeline();
}

/* Playing the timeline. Scrubbing by hand means nine deliberate taps, and most people
 * tap once and stop, so the shape of what is coming never gets seen. Play walks the
 * steps on a timer and stops at the end rather than looping, because a looping map of
 * a flood forecast is a screensaver. */
let tlTimer=null;
const TL_STEP_MS=1100;

function tlPlay(on){
  clearInterval(tlTimer); tlTimer=null;
  if(!on){ renderTimeline(); return; }
  tlTimer=setInterval(()=>{
    if(timeIndex>=TIMELINE.length-1){ tlPlay(false); return; }
    timeIndex++; applyTimeline();
  }, TL_STEP_MS);
  renderTimeline();
}

function renderTimeline(){
  const el=$("timeline"); if(!el) return;
  const st=TIMELINE[timeIndex];
  let n=0, counted=0, predicted=0;
  for(const f of (gj?.features||[])){
    const p=f.properties;
    if(st.mode==="level"){
      const fb=st.h===0?p.freeboard_m:p.t_fb;
      if(fb!=null){ counted++; if(fb<=0) n++; }
    } else if(p.t_flow!=null){ counted++; if(p.t_flow>=FLOW_WATCH) n++; }
    // Gauges whose outlook reaches a 2- or 5-year flow inside this step's horizon.
    // Only meaningful on the day steps: the level steps run out at 12 hours and the
    // outlook is a daily product.
    const d=p.flood_outlook_day;
    if(st.mode==="flow" && d!=null && Number(d)<=st.d) predicted++;
  }
  const readout = st.mode==="level"
    ? `${esc(t("tl_over"))}: <b>${n}</b> / ${counted} · ${esc(t("tl_note"))}`
    : `${esc(t("tl_rising"))}: <b>${n}</b> / ${counted} · ${esc(t("tl_flownote"))}`;
  // Flood-prone-when-predicted, stated as its own sentence rather than blended into
  // the flow count: reaching a level this river hits every two years is a different
  // claim from flow going up by a multiple.
  const pred = predicted
    ? `<div class="fhout" style="margin-top:6px">⚠ <b>${predicted}</b> ${
        esc(t("fp_predicted_s"))}</div>`
    : "";
  const frac=100/TIMELINE.length;
  el.innerHTML=`<div class="tlhead"><b>${esc(t("tl_title"))}</b>
      <span>${esc(stepLabel(st))} · ${esc(st.mode==="level"?t("tl_level"):t("tl_flow"))}</span></div>
    <div class="tlrow">
      <button id="tlplay" type="button" class="${tlTimer?"on":""}"
        title="${esc(tlTimer?t("tl_pause"):t("tl_play"))}"
        aria-label="${esc(tlTimer?t("tl_pause"):t("tl_play"))}">${tlTimer?"❚❚":"▶"}</button>
      <div class="tlbtns" style="flex:1">${TIMELINE.map((x,i)=>
        `<button type="button" data-t="${i}" class="${i===timeIndex?"on":""}${
          x.mode==="flow"?" flow":""}">${esc(stepLabel(x))}</button>`).join("")}</div>
    </div>
    <div class="tltrack"><i style="left:${(timeIndex*frac).toFixed(2)}%;width:${frac.toFixed(2)}%"></i></div>
    <div class="conf" style="margin-top:6px">${readout}</div>${pred}`;
  el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    if(tlTimer) tlPlay(false);
    timeIndex=+b.dataset.t; applyTimeline();
  });
  const pb=$("tlplay");
  if(pb) pb.onclick=()=>{
    if(tlTimer){ tlPlay(false); return; }
    if(timeIndex>=TIMELINE.length-1){ timeIndex=0; applyTimeline(); }
    tlPlay(true);
  };
}

/* ------------------------------------------------------- watched gauges
 * The app could not tell you anything unless you had it open, which for a flood
 * warning tool is most of the problem. This fixes that without a server, and without
 * this becoming a thing that knows where you live:
 *
 *   - the watch list is station ids in localStorage, on this device only
 *   - nothing is sent anywhere; the page already polls its own static snapshot
 *   - the browser's own Notification API does the alerting, locally
 *   - permission is asked for when you add your first watch, never on load
 *
 * It alerts on ESCALATION only. Re-announcing "still at level 4" every minute is how a
 * person learns to dismiss the thing without reading it.
 */
const WATCH_KEY="seraphim_watch", SEEN_KEY="seraphim_watch_seen";
//: Escalating to this or above is worth interrupting someone for.
const WATCH_ALERT_LEVEL=4;

function watchList(){
  try{ return JSON.parse(localStorage.getItem(WATCH_KEY)||"[]"); }catch{ return []; }
}
function saveWatches(ids){
  try{ localStorage.setItem(WATCH_KEY, JSON.stringify(ids)); }catch{}
}
function seenLevels(){
  try{ return JSON.parse(localStorage.getItem(SEEN_KEY)||"{}"); }catch{ return {}; }
}
function saveSeen(m){
  try{ localStorage.setItem(SEEN_KEY, JSON.stringify(m)); }catch{}
}
function isWatched(id){ return watchList().includes(id); }

async function toggleWatch(id){
  const ids=watchList();
  const i=ids.indexOf(id);
  if(i>=0){ ids.splice(i,1); }
  else {
    ids.push(id);
    // Asked on the first watch, not on page load: a permission prompt before the user
    // has expressed any interest is how people learn to click Block.
    if("Notification" in window && Notification.permission==="default"){
      try{ await Notification.requestPermission(); }catch{}
    }
  }
  saveWatches(ids);
  renderChrome();
  return ids.includes(id);
}

/** Check watched gauges against the snapshot and alert on escalation only. */
function checkWatches(){
  const ids=watchList();
  if(!ids.length||!gj) return;
  const seen=seenLevels();
  const fired=[];
  for(const f of gj.features){
    const p=f.properties;
    if(!ids.includes(p.id)) continue;
    const level=Number(p.risk_level)||0;
    const before=Number(seen[p.id])||0;
    if(level>=WATCH_ALERT_LEVEL && level>before) fired.push({p, level});
    seen[p.id]=level;
  }
  // Forget levels for gauges no longer watched, so re-adding one alerts again.
  for(const k of Object.keys(seen)) if(!ids.includes(k)) delete seen[k];
  saveSeen(seen);
  for(const {p, level} of fired) alertWatched(p, level);
}

function alertWatched(p, level){
  const title=`${t("alert_pre")} ${p.name||p.id}`;
  const body=`${t("r"+level)} · ${p.freeboard_m!=null&&p.freeboard_m<=0
    ? t("above")+" "+Math.abs(p.freeboard_m).toFixed(2)+" m"
    : t("fb")+" "+(p.freeboard_m==null?"-":p.freeboard_m.toFixed(2)+" m")}`;
  let delivered=false;              // not `shown`: that is the layer-visibility map
  try{
    if("Notification" in window && Notification.permission==="granted"){
      const n=new Notification(title,{body, tag:"seraphim-"+p.id, renotify:false});
      n.onclick=()=>{ window.focus(); openStationById(p.id); };
      delivered=true;
    }
  }catch{}
  // Denied, unsupported, or the tab is focused anyway: say it in the page instead of
  // swallowing it. An alert nobody can receive is worse than no alert feature.
  //
  // This used to be written into #degraded, which renderAge() rewrites from the
  // snapshot's health every 60 seconds, so a level-5 alert could be erased by a
  // routine freshness check before it was read. It gets its own toast now, it does
  // not time out, and tapping it goes to the gauge.
  if(!delivered){
    toast({kind:"alert", key:"watch-"+p.id, title, body,
           action:{label:t("dismiss")}});
  }
}

/** A link to one gauge. Until now there was no way to send someone "look at this one":
 *  the map had no URL state at all. */
/** Fly to a gauge by id and open its popup, for ?station= links. */
function openStationById(id){
  const f=(gj?.features||[]).find(x=>x.properties.id===id);
  if(!f) return false;
  const [lon,lat]=f.geometry.coordinates;
  const open=()=>stationPopup({features:[f], lngLat:{lng:lon,lat:lat}});
  const zoom=Math.max(map.getZoom(),11);
  const here=map.getCenter();
  // flyTo does nothing at all when it is already there, so `moveend` never fires and
  // the popup never opens. That is exactly the case for a watch-list row you have just
  // flown to, or a ?station= link you reload. Open it directly instead of waiting for
  // a move that is not going to happen.
  const moving = Math.abs(here.lng-lon)>1e-6 || Math.abs(here.lat-lat)>1e-6
    || Math.abs(map.getZoom()-zoom)>1e-6;
  if(!moving){ open(); return true; }
  map.flyTo({center:[lon,lat], zoom});
  map.once("moveend", open);
  return true;
}

function stationLink(id){
  const u=new URL(location.href);
  u.searchParams.set("station", id);
  return u.toString();
}

/** A small chart of the projected level, with the bank drawn across it.
 *
 *  The numbers were already in the popup as a row of figures. A row of figures does
 *  not answer the question people actually ask it, which is "does that line cross the
 *  bank, and roughly when". The chart is the same published numbers, nothing new: the
 *  damped projection at +1/3/6/12 h, so it can never disagree with time-to-bank.
 */
function forecastSpark(p){
  let fc=p.level_forecast;
  if(typeof fc==="string"){ try{fc=JSON.parse(fc);}catch{fc=null;} }
  if(!Array.isArray(fc)||!fc.length) return "";
  const now=p.level_msl==null?null:Number(p.level_msl);
  if(now===null||!isFinite(now)) return "";
  const pts=[{h:0,v:now}].concat(fc.map(f=>({h:Number(f.in_hours),v:Number(f.level_msl)})))
    .filter(x=>isFinite(x.h)&&isFinite(x.v));
  if(pts.length<2) return "";
  const bank=p.bank_msl==null?null:Number(p.bank_msl);
  const W=252,H=46,PAD=3;
  const vs=pts.map(x=>x.v).concat(bank!=null&&isFinite(bank)?[bank]:[]);
  let lo=Math.min(...vs), hi=Math.max(...vs);
  if(hi-lo<0.05){ const mid=(hi+lo)/2; lo=mid-0.05; hi=mid+0.05; }   // a flat river
  const maxH=pts[pts.length-1].h||1;
  const X=(h)=>PAD+(h/maxH)*(W-2*PAD);
  const Y=(v)=>H-PAD-((v-lo)/(hi-lo))*(H-2*PAD);
  const line=pts.map((x,i)=>`${i?"L":"M"}${X(x.h).toFixed(1)},${Y(x.v).toFixed(1)}`).join("");
  const area=`${line}L${X(maxH).toFixed(1)},${(H-PAD).toFixed(1)}L${X(0).toFixed(1)},${(H-PAD).toFixed(1)}Z`;
  const bankY=bank!=null&&isFinite(bank)?Y(bank):null;
  const last=pts[pts.length-1];
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
      role="img" aria-label="${esc(t("f_hours"))}">
    <path class="sband" d="${area}"/>
    ${bankY!==null&&bankY>=0&&bankY<=H
      ? `<line class="sbank" x1="0" y1="${bankY.toFixed(1)}" x2="${W}" y2="${bankY.toFixed(1)}"/>
         <text class="stxt" x="2" y="${Math.max(8,bankY-3).toFixed(1)}">${esc(thresholdLabel(p))}</text>`
      : ""}
    <path class="sline" d="${line}"/>
    <circle class="sdot" cx="${X(last.h).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="2.6"/>
    <text class="stxt" x="${X(0).toFixed(1)}" y="${H-0.5}">${esc(t("tl_now"))}</text>
    <text class="stxt" x="${W-2}" y="${H-0.5}" text-anchor="end">+${last.h}h</text>
  </svg></div>`;
}

/** What this river's own past says about it, and what the outlook says next.
 *
 *  Three things kept carefully apart, because they answer different questions and
 *  conflating them is how a history becomes a warning:
 *    - how often this place runs high (decades, unchanged by today's weather)
 *    - where today's flow sits in that record (now)
 *    - whether the outlook reaches a level it only reaches every 2-5 years (predicted)
 *
 *  All of it is modelled river flow, so the block says so at the bottom, every time.
 */
function floodHistory(p){
  const n=k=>(p[k]==null||p[k]==="")?null:Number(p[k]);
  const prone=n("flood_prone"), pct=n("flood_percentile");
  const worst=n("flood_worst_cms"), r2=n("flood_return_2y_cms"), r5=n("flood_return_5y_cms");
  const years=n("flood_years");
  // Days a year above the 2-year level, and how much worse a rare flood is than an
  // ordinary one. Episode COUNT is deliberately not shown: a 2-year return level is
  // exceeded about five times a decade by definition, so it reads the same for every
  // river and tells a reader nothing. See floodhist.STATS_SCHEMA.
  const hiDays=n("flood_high_days_per_year"), growth=n("flood_growth_ratio");
  const day=n("flood_outlook_day"), period=n("flood_outlook_period_y");
  if(prone===null&&pct===null&&worst===null) return "";
  const row=(lbl,val)=>val==null?"":
    `<div class="pr"><span>${esc(lbl)}</span><span class="num">${esc(val)}</span></div>`;
  const PRONE=["#6b7280","var(--fp1)","var(--fp2)","var(--fp3)"];

  let bar="";
  if(pct!==null){
    // Where today sits in twelve years of this river's own flow. A bar lands before
    // a number does; "92%" alone is a figure people skim past.
    bar=`<div class="fhbar"><i style="width:${Math.max(2,Math.min(100,pct))}%"></i></div>
      <div class="fhscale"><span>${esc(t("fh_pct"))}</span>
        <span class="num">${pct.toFixed(0)}%</span></div>`;
  }
  const day5=n("flood_outlook_5y_day");
  // The soonest crossing leads, because that is the part anyone can act on. The rarer
  // level is a second clause, not a replacement for the first.
  const out = day!==null
    ? `<div class="fhout">⚠ <b>${esc(t("fh_outlook"))} 2-${esc(t("fh_yr"))}</b>
        ${esc(t("fh_in_days"))} ${day} ${esc(t("fh_days"))}${
        day5!==null&&period===5
          ? ` · <b>5-${esc(t("fh_yr"))}</b> ${esc(t("fh_in_days"))} ${day5} ${esc(t("fh_days"))}`
          : ""}</div>`
    : "";
  return `<div class="fh">
    <b class="fhh">${esc(t("fh"))}${years?` · ${esc(t("fh_years"))} ${years} ${esc(t("fh_yr"))}`:""}</b>
    ${bar}
    ${prone===null?"":`<div class="pr"><span>${esc(t("fh_prone"))}</span><span>
      <span class="fhpill" style="background:${PRONE[prone]||PRONE[0]};color:#fff">${
        esc(t("fh_prone"+prone))}</span></span></div>`}
    ${row(t("fh_days_hi"), hiDays==null?null:hiDays.toFixed(0))}
    ${row(t("fh_growth"), growth==null?null:growth.toFixed(1)+"x")}
    ${row(t("fh_last"), p.flood_last_episode_on)}
    ${row(t("fh_worst"), worst==null?null:`${worst.toLocaleString()} m³/s · ${p.flood_worst_on||""}`)}
    ${row(t("fh_season"), p.flood_season_months)}
    ${row(`${t("fh_return")} 2 ${t("fh_yr")}`, r2==null?null:r2.toLocaleString()+" m³/s")}
    ${row(`${t("fh_return")} 5 ${t("fh_yr")}`, r5==null?null:r5.toLocaleString()+" m³/s")}
    ${out}
    <div class="conf">${esc(t("fh_note"))}</div>
  </div>`;
}

function stationPopup(e){
  const p=e.features[0].properties;
  const n=k=>(p[k]==null||p[k]==="")?null:Number(p[k]);
  // At a future step, show that step's projected freeboard rather than the one now.
  const step=TIMELINE[timeIndex];
  const hours=step.mode==="level"?step.h:0;
  const fb=hours===0?n("freeboard_m"):(p.t_fb==null?n("freeboard_m"):Number(p.t_fb));
  const lv=n("risk_level"), ttb=n("time_to_bank_hr");
  const over=fb!==null&&fb<=0, stale=p.stale===true||p.stale==="true";
  let reasons=p.reasons;
  if(typeof reasons==="string"){ try{reasons=JSON.parse(reasons);}catch{reasons=[];} }
  reasons=Array.isArray(reasons)?reasons:[];
  const tag=lv?`<div class="pt" style="background:${RISK[lv]}">${lv} ${esc(t("r"+lv))}</div>`:"";
  const why=reasons.length?`<div class="why"><b>${esc(t("why"))}</b><ul>`+
    reasons.map(r=>`<li>${esc(LANG==="th"?r.th:r.en)}</li>`).join("")+`</ul></div>`:"";
  new maplibregl.Popup({maxWidth:"300px",closeButton:true}).setLngLat(e.lngLat).setHTML(`
    ${tag}
    <div class="ph">${esc(p.name)||"-"}</div>
    <div class="psub">${esc(p.district)||""} ${esc(p.province)||""}${
      p.kind&&p.kind!=="river"?" · "+esc(t("k_"+p.kind)):""}${stale?" · "+esc(t("stale")):""}</div>
    ${ttb!==null?`<div class="pttb">⚠ ${esc(t("ttb"))} ~${ttb} ${esc(t("hr"))} ${esc(t("est"))}</div>
      ${meta?.validation?`<div class="conf">${esc(t("acc_err"))} ±${meta.validation.median_error_m} m
        ${esc(t("acc_at"))} ${meta.validation.lead_hours}h · n=${meta.validation.samples}</div>`:""}`:""}
    <div class="pr"><span>${esc(p.live?t("live_lvl"):t("level"))}</span><span class="num">${fmt(n("level_msl")," m")}</span></div>
    ${p.live&&p.live_at?`<div class="pr"><span>${esc(t("live_at"))}</span><span class="num">${esc(new Date(Number(p.live_at)).toLocaleString(LANG==="th"?"th-TH":"en-GB",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"short"}))}</span></div>`:""}
    <div class="pr"><span>${esc(thresholdLabel(p))}</span><span class="num">${fmt(n("bank_msl")," m")}</span></div>
    <div class="pr"><span>${esc(over?t("above"):t("fb"))}</span><span class="num" style="color:${over?RISK[5]:"inherit"}">${fb===null?"-":fmt(Math.abs(fb)," m")}</span></div>
    <div class="pr"><span>${esc(t("rain24"))}</span><span class="num">${fmt(n("rain_next_24h_mm")," mm",1)}</span></div>
    <div class="pr"><span>${esc(t("trend"))}</span><span class="num">${n("discharge_rise_ratio")===null?"-":n("discharge_rise_ratio")+"x"}</span></div>
    <div class="pr"><span>${esc(t("ageL"))}</span><span class="num">${esc(ageText(n("data_age_min")))}</span></div>
    ${why}
    ${n("bank_msl")===null?`<div class="conf">${esc(t("notbank"))}</div>`:""}
    ${p.risk_confidence?`<div class="conf">${esc(t("conf"))}: ${esc(p.risk_confidence)}</div>`:""}
    ${forecastSpark(p)}
    ${forecastRows(p)}
    ${floodHistory(p)}
    ${p.live_over_bank?`<div class="pttb">⚠ ${esc(t("live_new"))}</div>`:""}
    ${p.live?`<div class="conf">${esc(t("live_note"))}</div>`:""}
    <button class="sharebtn" data-watch="${esc(p.id)}">${
      isWatched(p.id)?"★ "+esc(t("unwatch")):"☆ "+esc(t("watch"))}</button>
    <button class="sharebtn" data-share="${esc(p.id)}">🔗 ${esc(t("sharelbl"))}</button>`)
    .addTo(map);
}

/** Hours ahead (projected level) and weeks ahead (river flow, never a level). */
/** A reservoir 2 m below its flood pool is a different sentence from a river 2 m below
 *  its bank, even though the arithmetic is identical. */
function thresholdLabel(p){
  return p.kind==="reservoir"||p.kind==="lake" ? t("floodpool") : t("bank");
}

function forecastRows(p){
  let fc=p.level_forecast;
  if(typeof fc==="string"){ try{fc=JSON.parse(fc);}catch{fc=null;} }
  let out="";
  if(Array.isArray(fc)&&fc.length){
    out+=`<div class="fcrow"><b>${esc(t("f_hours"))}</b>`+
      fc.map(f=>`<span>+${f.in_hours}h<i>${f.level_msl.toFixed(2)}</i></span>`).join("")+
      `</div><div class="conf">${esc(t("f_note"))}</div>`;
  }
  const ratio=p.discharge_outlook_ratio==null?null:Number(p.discharge_outlook_ratio);
  const day=p.discharge_peak_day==null?null:Number(p.discharge_peak_day);
  if(ratio!=null&&day!=null&&isFinite(ratio)&&isFinite(day)){
    const spread=p.discharge_outlook_spread==null?null:Number(p.discharge_outlook_spread);
    out+=`<div class="pr"><span>${esc(t("f_weeks"))}</span>
      <span class="num">${ratio.toFixed(1)}x · ${esc(t("f_in"))} ${(day/7).toFixed(1)} ${esc(t("f_wk"))}</span></div>
      <div class="conf">${esc(t("f_flow"))}${spread&&spread>=3?` · ${esc(t("f_spread"))} ${spread.toFixed(0)}x`:""}</div>`;
  }
  return out;
}

/** Google's forecast for one point. Deliberately never shows a water level, because
 *  the API does not publish one here and inventing one is how this project's worst
 *  possible bug would look. */
/* ---------------------------------------------------------------- cameras
 *
 * Video is the one thing on this map that is fetched from somebody else's origin, and
 * it happens only when a reader presses play. Until then a camera is a marker and no
 * request leaves for the operator. hls.js is lazily loaded for the same reason: 414 KB
 * that most visitors never need has no business in the critical path of a flood map.
 */
const HLS_JS="https://unpkg.com/hls.js@1.5.20/dist/hls.min.js";
let hlsLoading=null;

function loadHls(){
  if(window.Hls) return Promise.resolve(window.Hls);
  if(hlsLoading) return hlsLoading;
  hlsLoading=new Promise((resolve,reject)=>{
    const el=document.createElement("script");
    el.src=HLS_JS;
    el.onload=()=>resolve(window.Hls);
    el.onerror=()=>{ hlsLoading=null; reject(new Error("hls.js failed to load")); };
    document.head.appendChild(el);
  });
  return hlsLoading;
}

/** Stop whatever this popup is playing and let go of it.
 *
 *  Called on close, on a fatal error, and before a second press of play. All three
 *  matter: an HLS instance whose <video> has been thrown away carries on fetching
 *  segments, so without this a reader who closes a popup, or presses play twice, keeps
 *  pulling a CCTV stream they can no longer see. */
function stopCamera(root){
  if(!root) return;
  if(root._hls){ try{ root._hls.destroy(); }catch(err){} root._hls=null; }
  const v=root.querySelector(".cctvbox video");
  // Safari plays HLS natively, so there is no Hls instance to destroy and the
  // <video> has to be stopped directly.
  if(v){ try{ v.pause(); v.removeAttribute("src"); v.load(); }catch(err){} }
}

/** Mint a session and attach it. Session URLs carry a token and expire, which is why
 *  none of this can live in the snapshot: the browser asks for its own, at play time. */
async function playCamera(root,props){
  const box=root.querySelector(".cctvbox");
  if(!box) return;
  stopCamera(root);
  box.innerHTML=`<div class="conf">${esc(t("cctv_loading"))}</div>`;
  const tmpl=(cameras&&cameras.stream_url_template)
    || "https://gg89f6g289.execute-api.ap-southeast-1.amazonaws.com/stream/hls-url/{key}";
  try{
    const res=await fetch(tmpl.replace("{key}",encodeURIComponent(props.stream_key)));
    const raw=await res.json();
    // The vendor's Lambda reports its own failures inside a 200 and wraps the payload
    // as a JSON string, so neither the status nor the outer object can be trusted.
    let body=raw&&raw.body;
    if(typeof body==="string") body=JSON.parse(body);
    const url=body&&body.live_stream_url;
    if(!url) throw new Error("no stream");

    const v=document.createElement("video");
    v.controls=true; v.autoplay=true; v.muted=true; v.playsInline=true;
    v.setAttribute("playsinline","");
    v.style.cssText="width:100%;border-radius:6px;background:#000;display:block";
    box.innerHTML="";
    box.appendChild(v);

    if(v.canPlayType("application/vnd.apple.mpegurl")){
      v.src=url;                       // Safari and iOS play HLS natively.
    }else{
      const Hls=await loadHls();
      if(!Hls||!Hls.isSupported()) throw new Error("hls unsupported");
      const h=new Hls({lowLatencyMode:true});
      h.on(Hls.Events.ERROR,(_evt,data)=>{
        if(!data||!data.fatal) return;
        // Tear down before replacing the box: the <video> this is attached to is
        // about to be removed, and a detached Hls keeps downloading regardless.
        stopCamera(root);
        box.innerHTML=`<div class="conf">${esc(t("cctv_fail"))}</div>`;
      });
      h.loadSource(url);
      h.attachMedia(v);
      // Kept on the popup element so closing it can tear the stream down. Without
      // this an abandoned popup keeps pulling video in the background, which costs
      // the reader bandwidth and keeps a camera running that nobody is watching.
      root._hls=h;
    }
  }catch(err){
    stopCamera(root);
    box.innerHTML=`<div class="conf">${esc(t("cctv_fail"))}</div>`;
  }
}

  document.documentElement.lang=LANG;

  $("rtip").textContent=t("tune");

  // Tick boxes rather than pills: the user asked to "tick to show and unshow", and a

  const have={fires:!!fires, terrain:!!terrain, dams:!!dams,
              pastfloods:!!pastFloods?.features?.length,
              gfh:!!gfh?.features?.length,
              // Five cameras in one Thai municipality. The toggle appears only where
              // the layer has something to draw, so it is not a dead tick box in
              // front of a reader in Hull or Houston.
              cctv:!!cameras?.features?.length,
              // Offered only where history actually exists *for the country on screen*.
              // A global check would put a toggle in front of an American reader that
              // draws nothing, which reads as "no flood-prone ground here" rather than

  const toggleLayer=(el)=>{
    const id=el.dataset.layer;

    saveLayers();

    if(id==="d3") setTerrain3D(shown.d3);

  };
  document.querySelectorAll("[data-layer]").forEach(el=>{
    el.onclick=()=>toggleLayer(el);

    // work or the role is a lie to a screen reader.

  });
  $("h-legend").textContent=t("legend"); $("h-worst").textContent=t("worst");

  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG));
  document.querySelectorAll("#view button").forEach(b=>b.classList.toggle("on",b.dataset.v===country));
  document.querySelectorAll("[data-base]").forEach(el=>el.classList.toggle("on",el.dataset.base===basemap));

  const c=meta?.counts??{}, r=meta?.risk??{};
  const stats=[

      esc(v)}</b><i>${esc(label)}</i></div>`).join("");
  // A number that has changed since the last render gets one beat of animation. A phone
  // left on a windowsill can go from 12 over bank to 40 with nothing on screen moving,

  for(const [k,v] of stats.map(s=>[s[0],String(s[1])])){
    if(lastStats[k]!==undefined && lastStats[k]!==v){

    : mode==="rain" ? [["#a855f7","≥90 mm"],[RISK[5],"50-90"],[RISK[3],"20-50"],[RISK[2],"5-20"],["#0ea5e9","<5"]]
    : [[RISK[5],"≥4x"],[RISK[3],"2-4x"],[RISK[2],"1.2-2x"],[RISK[1],"-"]];
  $("legend").innerHTML=L.map(([c2,l])=>`<div><span class="d" style="background:${c2}"></span>${esc(l)}</div>`).join("");

  const top=(areas?.areas||[]).filter(a=>a.level>=3).slice(0,8);
  $("worst").innerHTML=top.length?top.map((a,i)=>
    `<a data-i="${i}"><span class="lv" style="background:${RISK[a.level]}">${a.level}</span>
     <span class="t">${esc(a.district)||"-"}, ${esc(a.province)||"-"}${a.country&&a.country!=="TH"?` <span style="color:var(--faint)">${esc(a.country)}</span>`:""}</span>
     ${a.worst_ttb_hr!=null?`<span class="ttb num">${a.worst_ttb_hr}${esc(t("hr"))}</span>`:""}</a>`).join("")
    : `<div style="font-size:12px;color:var(--faint);padding:6px 0">${esc(t("none"))}</div>`;
  document.querySelectorAll("#worst a").forEach(el=>el.onclick=()=>{
    const a=top[+el.dataset.i];
    const f=(gj?.features||[]).find(x=>x.properties.province===a.province
      && x.properties.district===a.district && x.properties.risk_level===a.level);
    if(f){ map.flyTo({center:f.geometry.coordinates,zoom:11}); $("sheet").classList.remove("open"); }
  });

  $("disc").innerHTML=t("disc");
  $("fishbtn").innerHTML=`<span>${esc(t("fish"))}</span><small>${esc(t("fish_s"))}</small>`;
  renderAge();
}

/* The prediction should carry its own track record. A confident red "3.1 h to bank"
   with nothing behind it invites more trust than it has earned. */
function renderAccuracy(){
  const v=meta?.validation;
  const el=$("acc");
  if(!v){ el.innerHTML=`<div style="font-size:11.5px;color:var(--faint)">${esc(t("accnone"))}</div>`; return; }
  // Show the figure for the country on screen. Publishing one blended number earned
  // mostly on Thai rivers, next to a prediction for an American one, overstates what
  // is known about the American one.
  const cc=(country||"").toUpperCase();
  const per=v.by_country&&v.by_country[cc];
  if(cc&&cc!=="WORLD"&&!per){
    const measured=(v.measured_countries||[]).join(", ");
    el.innerHTML=`<div style="font-size:11.5px;color:var(--faint)">${esc(t("acc_notyet"))}`+
      (measured?` ${esc(t("acc_only"))} ${esc(measured)}.`:"")+`</div>`;
    return;
  }
  // Not `shown`: that is the module-level layer-visibility map, and shadowing it here
  // is a live grenade for the next person who adds a line to this function.
  const figures=per||v;
  const skill=figures.skill_vs_persistence;
  const good=skill!=null&&skill>0;
  const pct=skill==null?null:Math.round(Math.abs(skill)*100);
  const medErr=figures.median_error_m;
  el.innerHTML=`
    <div class="legend" style="margin-bottom:4px">
      <div><span class="d" style="background:${good?"#3fb950":"#e5484d"}"></span>
        ${esc(t("acc_err"))} ±${medErr} m ${esc(t("acc_at"))} ${v.lead_hours}h</div>
      ${pct==null?"":`<div><span class="d" style="background:${good?"#3fb950":"#e5484d"}"></span>
        ${pct}% ${esc(good?t("acc_skill"):t("worse"))}</div>`}
      ${v.hit_rate==null?"":`<div><span class="d" style="background:#d99e0b"></span>
        ${Math.round(v.hit_rate*100)}% ${esc(t("acc_hit"))}</div>`}
    </div>
    <div style="font-size:10px;color:var(--faint);line-height:1.4">${esc(v.note)} · n=${v.samples}</div>`;
}

/* The staleness banner had three problems, and all of them taught people to ignore it:
 *
 *   1. It said "Data may be out of date" and nothing else, so there was no way to tell
 *      a two-minute cron delay from a feed that died overnight.
 *   2. It could not be dismissed, so once it appeared it sat over the top of the map
 *      permanently, covering the thing the reader came for.
 *   3. It fired on ordinary cron drift. The builder runs every 15 minutes and Actions
 *      drift 5-20, so a 90-minute threshold is right, but it was being crossed on
 *      normal slow days and saying something alarming about it.
 *
 * Now it states the actual age, explains the cadence, and can be dismissed until the
 * situation changes: `staleDismissed` records WHAT was dismissed, so a banner about a
 * 40-minute delay does not suppress a later one about a dead feed. */
let staleDismissed=null;

function staleState(){
  const gen=meta?.generated_at?new Date(meta.generated_at):null;
  const mins=gen?(Date.now()-gen.getTime())/60000:null;
  if(!navigator.onLine) return {key:"offline", mins};
  const failed=(meta?.health?.checks||[]).filter(c=>c.status!=="pass");
  if(meta?.health?.status && meta.health.status!=="pass")
    return {key:"health:"+failed.map(c=>c.check).join(","), mins, failed};
  const limit=meta?.health?.snapshot_stale_after_minutes??90;
  if(mins!=null&&mins>limit)
    // Bucketed, so the banner does not re-appear every minute as the age ticks up.
    return {key:"old:"+Math.floor(mins/30), mins, limit};
  return null;
}

/* How much of the country on screen actually has flood history behind it.
 *
 * Coverage is filled in a few hundred grid cells at a time, so for a while most of the
 * world has none. The failure to avoid is a reader seeing an empty flood-prone layer
 * and concluding there is no flood-prone ground here, when the truth is that nobody has
 * computed it yet. Same reasoning as the per-country accuracy figure above. */
function renderFloodSummary(){
  const el=$("fhsum"); if(!el) return;
  $("h-fh").textContent=t("fh");
  const fh=meta?.flood_history;
  const cc=(country||"").toUpperCase();
  const per=fh?.by_country?.[cc];
  if(!fh||!fh.gauges_with_history||(cc&&cc!=="WORLD"&&!per)){
    const done=(fh?.measured_countries||[]).join(", ");
    el.innerHTML=`<div style="font-size:11.5px;color:var(--faint)">${esc(t("fh_none"))}`
      +(done?` ${esc(t("acc_only"))} ${esc(done)}.`:"")+`</div>`;
    return;
  }
  const pct=per.gauges?Math.round(per.with_history/per.gauges*100):0;
  el.innerHTML=`<div class="legend" style="margin-bottom:4px">
      <div><span class="d" style="background:#38bdf8"></span>${per.with_history.toLocaleString()} ${
        esc(t("gauges"))} · ${pct}%</div>
      <div><span class="d" style="background:var(--fp2)"></span>${per.prone.toLocaleString()} ${
        esc(t("floodprone"))}</div>
      ${per.predicted?`<div><span class="d" style="background:var(--fp3)"></span>${
        per.predicted.toLocaleString()} ${esc(t("fp_predicted"))}</div>`:""}
    </div>
    <div style="font-size:10px;color:var(--faint);line-height:1.4">${esc(t("fh_note"))}</div>`;
}

function renderAge(){
  const gen=meta?.generated_at?new Date(meta.generated_at):null;
  const mins=gen?(Date.now()-gen.getTime())/60000:null;
  const med=meta?.data_age_minutes?.median;
  const dot=$("live");
  dot.className="live"+(mins==null||mins>180?" dead":mins>75?" stale":"");
  $("age").textContent = gen
    ? `${t("updated")} ${ageText(mins)} ${t("ago")} · ${t("median")} ${ageText(med)}`
    : t("nodata");

  const bad=staleState();
  const el=$("degraded");
  if(!bad || bad.key===staleDismissed){ el.classList.remove("show"); return; }
  const why = bad.key==="offline" ? t("offline")
    : bad.failed ? bad.failed.map(c=>c.detail).join(" · ")
    : `${t("stale_age")} ${ageText(bad.mins)} ${t("ago")}. ${t("stale_why")}`;
  el.classList.add("show");
  el.innerHTML=`<div class="drow"><div style="flex:1">
      <b>⚠ ${esc(bad.key==="offline"?t("degraded"):t("stale_hdr"))}</b><br>${esc(why)}
    </div><button class="dsm" type="button" aria-label="${esc(t("dismiss"))}">✕</button></div>`;
  el.querySelector(".dsm").onclick=()=>{
    staleDismissed=bad.key;
    el.classList.remove("show");
  };
}

function setBasemap(name){
  basemap=name;
  const s=STYLES[name]();
  map.setStyle(s);
  map.once("styledata",()=>{ addLayers(); });
  renderChrome();

(async function(){
  $("bootmsg").textContent=t("loading")+"…";
  if(!(await load())){
    $("boot").classList.add("gone");
    $("degraded").classList.add("show");
    $("degraded").innerHTML=`<b>⚠ ${esc(t("degraded"))}</b>`;
    return;
  }
  const v0=VIEWS[country]||VIEWS.th;
  map=new maplibregl.Map({container:"map",style:satelliteStyle(),
    center:v0.center,zoom:v0.zoom,attributionControl:false,
    maxZoom:16,minZoom:3,
    // Tuned for a phone on a bad connection rather than a demo on a desktop GPU.
    // antialias off is the big one: with 16,000 circles, MSAA costs real frames and
    // buys almost nothing on dots this small.
    antialias:false,
    fadeDuration:120,
    refreshExpiredTiles:false});
  map.addControl(new maplibregl.AttributionControl({compact:true,
    customAttribution:"ThaiWater (HII) · UK Environment Agency (OGL) · "
      +"Rijkswaterstaat · NOAA/NWS · Open-Meteo (CC-BY 4.0) · USGS · RainViewer · Radio Browser · "
      +"Google Flood Hub (CC-BY 4.0) · GDACS · "
      // Named with "no stated licence" rather than left off, because an attribution
      // line that lists only the sources with clean terms quietly implies they all do.
      +"Yala City Municipality CCTV (no stated licence) · "
      +"layers inspired by gods-eye-view (MIT) · SeRAPHIM AGPL-3.0"}));
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),"bottom-right");
  map.addControl(new maplibregl.GeolocateControl({trackUserLocation:true}),"bottom-right");
  map.on("load",()=>{
    addLayers(); renderChrome();
    // ?station=<id> flies to that gauge and opens it, so a link to one river works.
    const want=new URLSearchParams(location.search).get("station");
    if(want) openStationById(want);
    applyTimeline();
    checkWatches();
    pulse();
    try{ if(localStorage.getItem("seraphim_3d")==="1"){ shown.d3=true; setTerrain3D(true); } }catch{}
    // The map has pixels on it; get the splash out of the way. `idle` rather than
    // `load` so the first tiles are actually painted, otherwise the splash fades to
    // reveal a grey rectangle, which is the thing it exists to avoid.
    map.once("idle",()=>$("boot").classList.add("gone"));
    // ...but never hang on a basemap that will not load. The gauges are the point and
    // they are already here.
    setTimeout(()=>$("boot").classList.add("gone"), 2500);
    liveDisclosure();
  });

  /* The sheet opens by tap, and now also by drag.
   *
   * A bottom sheet that only responds to a tap on a 34px handle is a sheet most people
   * never open, and everything below the fold (the forecast timeline, the watch list,
   * the legend, the worst districts) was below that fold. Dragging tracks the finger
   * directly and snaps to the nearest of three heights on release. */
  const sheet=$("sheet");
  const SNAP_COLLAPSED=74;
  const snapHeights=()=>[SNAP_COLLAPSED,
    Math.min(innerHeight*0.62,520), Math.min(innerHeight*0.88,760)];
  // Snap to whichever of the three heights the finger stopped nearest.
  const classFor=(h)=>{
    const [collapsed, open, full]=snapHeights();
    if(h<=(collapsed+open)/2) return "";
    return h<=(open+full)/2 ? "open" : "full";
  };
  let dragY=null, dragH=0, dragMoved=false;

  const onDown=(e)=>{
    dragY=e.clientY; dragH=sheet.getBoundingClientRect().height; dragMoved=false;
    sheet.classList.add("dragging");
    $("grab").setPointerCapture?.(e.pointerId);
  };
  const onMove=(e)=>{
    if(dragY===null) return;
    const dy=dragY-e.clientY;
    if(Math.abs(dy)>4) dragMoved=true;
    const [minH,,maxH]=snapHeights();
    sheet.style.height=Math.max(minH,Math.min(maxH,dragH+dy))+"px";
  };
  const onUp=()=>{
    if(dragY===null) return;
    const h=sheet.getBoundingClientRect().height;
    dragY=null;
    sheet.classList.remove("dragging");
    sheet.style.height="";                      // hand control back to the CSS classes
    if(!dragMoved){                             // a tap, not a drag
      sheet.classList.toggle("open");
      sheet.classList.remove("full");
      return;
    }
    sheet.classList.remove("open","full");
    const c=classFor(h);
    if(c) sheet.classList.add(c);
  };
  $("grab").addEventListener("pointerdown",onDown);
  $("grab").addEventListener("pointermove",onMove);
  $("grab").addEventListener("pointerup",onUp);
  $("grab").addEventListener("pointercancel",onUp);
  $("stats").onclick=()=>{ sheet.classList.remove("full"); sheet.classList.toggle("open"); };

  $("layersbtn").onclick=e=>{ e.stopPropagation(); $("layers").classList.toggle("show"); };
  document.addEventListener("click",e=>{
    if(!$("layers").contains(e.target)&&e.target!==$("layersbtn")) $("layers").classList.remove("show");
  });
  // Escape backs out of whatever is open, innermost first. Without it the only way out
  // of the layers drawer on a desktop is to find somewhere neutral to click.
  document.addEventListener("keydown",e=>{
    if(e.key!=="Escape") return;
    if($("layers").classList.contains("show")){ $("layers").classList.remove("show"); return; }
    if(shown.radio){ shown.radio=false; saveLayers(); applyVisibility(); renderChrome(); return; }
    if(sheet.classList.contains("open")||sheet.classList.contains("full")){
      sheet.classList.remove("open","full");
    }
  });
  document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>{
    LANG=b.dataset.l; localStorage.setItem("seraphim_lang",LANG); renderChrome();
  });
  document.querySelectorAll("#view button").forEach(b=>b.onclick=async ()=>{
    const v=VIEWS[b.dataset.v];
    if(b.dataset.v!=="world"){
      country=b.dataset.v;
      localStorage.setItem("seraphim_country",country);
      const got=await loadCountry(country);
      if(got){
        gj=mergedStations(); areas=mergedAreas();
        if(map.getSource("st")) map.getSource("st").setData(gj);
        if(country==="th"&&!provinces){
          [tide,provinces]=await Promise.all([j("tide.json"), j("provinces.geojson")]);
          addLayers();
        }
      }
    }
    // The world view is about events, not gauges, so it turns the right things on.
    if(b.dataset.v==="world"){ shown.events=true; shown.quakes=true; shown.provinces=false; }
    else { shown.provinces = b.dataset.v==="th"; }
    saveLayers();
    addLayers();          // a country loaded later may bring layers that did not exist
    applyVisibility();
    pulse();
    map.flyTo({center:v.center, zoom:v.zoom});
    $("sheet").classList.remove("open");
    // Each country is live against a different agency, and one of them (NL) has none.
    // Re-arm rather than leave a pulsing badge describing the country we just left.
    if(liveOn) setLive(true); else renderChrome();
  });
  document.querySelectorAll("[data-base]").forEach(el=>el.onclick=()=>setBasemap(el.dataset.base));

  $("rclose").onclick=()=>{ shown.radio=false; saveLayers(); applyVisibility(); renderChrome(); };
  $("rplay").onclick=()=>{
    if(!radioNear.length) refreshDial();
    if(audio&&!audio.paused){ audio.pause(); $("rplay").textContent="▶";
      $("rplay").classList.remove("playing"); }
    else playRadio(radioNear[radioIdx]);
  };
  // Drag the dial like a tuner; also works as a tap anywhere along it.
  let dragging=false;
  const dialPick=(clientX)=>{
    const r=$("dial").getBoundingClientRect();
    const f=Math.max(0,Math.min(1,(clientX-r.left)/r.width));
    tuneTo(Math.floor(f*radioNear.length), false);
  };
  $("dial").addEventListener("pointerdown",e=>{dragging=true;$("dial").setPointerCapture(e.pointerId);dialPick(e.clientX);});
  $("dial").addEventListener("pointermove",e=>{ if(dragging) dialPick(e.clientX); });
  $("dial").addEventListener("pointerup",e=>{ dragging=false; playRadio(radioNear[radioIdx]); });
  map.on("moveend",()=>{
    if(shown.radio) refreshDial();
    // The US feed is scoped to the viewport, so panning is what changes the answer.
    // Debounced, because moveend fires on every flick.
    if(liveOn && liveSource() && country==="us"){
      clearTimeout(window.__liveMove);
      window.__liveMove=setTimeout(refreshLive, 1200);
    }
  });
  // Live is on unless this visitor turned it off; the disclosure above names who is
  // contacted the first time it runs.
  if(liveOn) setLive(true); else renderLiveBar();
  watchVisibility();
  window.addEventListener("resize",()=>{ if(shown.radio) drawDial(); });
  window.addEventListener("online",()=>{ renderAge(); if(liveOn) refreshLive(); });
  window.addEventListener("offline",renderAge);

  // Poll for a newer snapshot and swap the data in place, so a phone left open on a
  // windowsill keeps up without anyone reloading it.
  setInterval(async ()=>{
    const m=await fetch(`${BASE}/meta.json`,{cache:"no-cache"}).then(r=>r.json()).catch(()=>null);
    if(m && m.generated_at !== meta?.generated_at){
      for(const k of Object.keys(loaded)) delete loaded[k];
      await load();
      if(map.getSource("st")) map.getSource("st").setData(gj);
      // A new snapshot replaces every feature object, so the live overlay has to be
      // laid back over it or the map would silently revert to build-time levels.
      if(liveOn) refreshLive(); else applyTimeline();
      checkWatches();
      if(map.getSource("prov")&&provinces) map.getSource("prov").setData(provinces);
      if(map.getSource("quakes")&&quakes) map.getSource("quakes").setData(quakes);
      if(map.getSource("fires")&&fires) map.getSource("fires").setData(fires);
      if(map.getSource("events")&&events) map.getSource("events").setData(events);
      if(map.getSource("terrain")&&terrain) map.getSource("terrain").setData(terrain);
      if(map.getSource("dams")&&dams) map.getSource("dams").setData(dams);
      if(map.getSource("pastfloods")&&pastFloods) map.getSource("pastfloods").setData(pastFloods);
      if(map.getSource("gfh")&&gfh) map.getSource("gfh").setData(gfh);
      // Layers whose data only arrived on a later build (flood history is filled in a
      // few hundred cells at a time) have to be created now, or they never appear
      // until someone reloads.
      addLayers();
      pulse();
      renderChrome();
    } else { renderAge(); }
  },60000);

  // Register, then immediately ask the browser to re-check sw.js. Without the update()
  // the worker script is itself subject to the CDN's 10-minute cache, so a deploy can
  // keep serving the previous worker, which is a confusing way to conclude that a push
  // did not land.
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js")
      .then(r=>{ r.update(); })
      .catch(()=>{});
  }
})();
</script>
</body>
</html>
