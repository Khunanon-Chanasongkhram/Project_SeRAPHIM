name: ingest

# CADENCE NOTE — this is the single most cost-sensitive line in the repo.
# Private repos get 2,000 Actions minutes/month on the Free plan, and every job is
# rounded UP to a whole minute. At */30 that is ~1,440 min/month, which fits.
# At */15 it would be ~2,880 min/month, which does NOT.
# Public repos get unlimited minutes — when this repo goes public, drop to */15 or */10.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["workers/**", ".github/workflows/ingest.yml"]

concurrency:
  # Never let a slow run overlap the next tick.
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install: the project is stdlib-only by design. Nothing to cache,
      # no supply chain, and the job starts in seconds — which is what keeps us
      # inside the free minute budget.
      # Two things must survive between runs, because GitHub runners are ephemeral
      # and data/ is gitignored:
      #
      #   data/cache   - forecasts, which only change every 6-24 hours
      #   data/archive - the gauge history the risk engine fits trends to. WITHOUT
      #                  THIS, every run starts with an empty archive, no trend ever
      #                  spans the 45-minute minimum, and time-to-bank — the headline
      #                  number of the whole project — never appears in production.
      #
      # A unique key always writes a fresh entry; restore-keys pulls the most recent
      # one back. The archive is pruned to a bounded window so the cache cannot grow
      # without limit.
      - name: Restore working state
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/archive
          key: seraphim-state-${{ github.run_id }}
          restore-keys: |
            seraphim-state-

      - name: Tests
        working-directory: workers
        run: python -m unittest discover -s tests -q

      - name: Build snapshot
        working-directory: workers
        run: python -m seraphim.cli build --out ../data --archive-keep-hours 48

      - name: Summary
        run: |
          python - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("data/out/meta.json").read_text(encoding="utf-8"))
          c, a = m["counts"], m["data_age_minutes"]
          out = pathlib.Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          out.write_text(
              f"### SeRAPHIM snapshot\n\n"
              f"- generated: `{m['generated_at']}`\n"
              f"- stations: **{c['stations']}** ({c['with_bank_level']} with bank level)\n"
              f"- at/over bank: **{c['at_or_over_bank']}**\n"
              f"- stale: {c['stale']} | median age: {a['median']} min\n"
              f"- with forecast: {c.get('with_forecast', 0)} | tide points: {c.get('tide_points', 0)}\n"
              + (lambda r: f"- risk 5/4/3: **{r['by_level']['5']}** / {r['by_level']['4']} / {r['by_level']['3']}"
                           f" | time-to-bank on {r['with_time_to_bank']} stations"
                           f" | soonest: {r['soonest_to_bank_hr']} h\n\n")(m.get("risk", {"by_level":{"5":0,"4":0,"3":0},"with_time_to_bank":0,"soonest_to_bank_hr":None}))
              + "\n".join(
                  f"- `{s['source']}` ok={s['ok']} stations={s['stations']}"
                  + (f" error={s['error']}" if s.get("error") else "")
                  + "".join(f"\n  - ⚠️ {w}" for w in s.get("warnings", []))
                  for s in m["sources"]
              ),
              encoding="utf-8",
          )
          PY

      # Publishes only when R2 secrets exist, so the workflow is green from day one
      # and starts publishing the moment Cloudflare is wired up.
      - name: Publish to Cloudflare R2
        if: ${{ env.CF_ACCOUNT_ID != '' }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          BUCKET: ${{ secrets.CF_R2_BUCKET }}
        run: |
          ENDPOINT="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Short max-age so a fresh snapshot is visible quickly, with
          # stale-while-revalidate keeping the map up if a build fails.
          CACHE="public, max-age=60, stale-while-revalidate=1800"

          # Explicit content types. Without these .geojson uploads as
          # application/octet-stream, which blocks Cloudflare's in-transit
          # compression and turns a 130 KB payload into 1.2 MB on the wire.
          aws s3 cp data/out/ "s3://${BUCKET}/latest/" --recursive \
            --endpoint-url "$ENDPOINT" --cache-control "$CACHE" \
            --exclude "*" --include "*.json" --content-type "application/json; charset=utf-8"
          aws s3 cp data/out/ "s3://${BUCKET}/latest/" --recursive \
            --endpoint-url "$ENDPOINT" --cache-control "$CACHE" \
            --exclude "*" --include "*.geojson" --content-type "application/geo+json; charset=utf-8"

          # The archive is fetched rarely and only by the risk engine, so it stays
          # gzipped on disk rather than relying on in-transit compression.
          aws s3 cp data/archive/ "s3://${BUCKET}/archive/" --recursive \
            --endpoint-url "$ENDPOINT" --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" --include "*.json.gz" --content-type "application/gzip"
