name: ingest

# Fetches live data, computes risk, and publishes the whole site (pages + snapshots)
# to GitHub Pages.
#
# Public repo, so Actions minutes are unlimited and the old 2,000 minute budget no
# longer applies. The GitHub Pages "10 builds per hour" limit does not apply either,
# because this is a custom workflow deploying an artifact rather than a Jekyll build.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "web/**"
      - ".github/workflows/ingest.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pages deployments must not overlap, and a slow run must not race the next tick.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Two things must survive between runs, because runners are ephemeral and
      # data/ is gitignored:
      #
      #   data/cache   - forecasts, which only change every 6-24 hours
      #   data/archive - the gauge history the risk engine fits trends to. WITHOUT
      #                  THIS, every run starts with an empty archive, no trend ever
      #                  spans the 45-minute minimum, and time-to-bank never appears.
      - name: Restore working state
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/archive
          key: seraphim-state-${{ github.run_id }}
          restore-keys: |
            seraphim-state-

      # No pip install: the project is stdlib-only by design. Nothing to cache and
      # no supply chain.
      - name: Tests
        working-directory: workers
        run: python -m unittest discover -s tests -q

      - name: Build snapshot
        working-directory: workers
        run: python -m seraphim.cli build --out ../data --archive-keep-hours 48

      # The site and its data ship together, from the same origin. That removes CORS
      # from the picture entirely: there is no cross-origin fetch to configure or to
      # fail silently in someone's browser.
      - name: Assemble site
        env:
          API_BASE: ${{ vars.SERAPHIM_API_BASE }}
        run: |
          mkdir -p _site/data/out
          cp web/*.html web/*.js _site/
          cp -r data/out/. _site/data/out/
          # Stop Jekyll from eating files and directories that start with an underscore.
          touch _site/.nojekyll

          # config.js is generated rather than committed, so the deployed site always
          # points at itself for data and nobody has to remember to edit a file.
          cat > _site/config.js <<EOF
          window.SERAPHIM = {
            dataBase: "./data/out",
            apiBase: ${API_BASE:+\"$API_BASE\"}${API_BASE:-null},
          };
          EOF
          echo "config.js:"; cat _site/config.js

      - name: Summary
        run: |
          python - <<'PY'
          import json, os, pathlib
          m = json.loads(pathlib.Path("data/out/meta.json").read_text(encoding="utf-8"))
          c, a, r = m["counts"], m["data_age_minutes"], m.get("risk", {})
          h = m.get("health", {})
          by = r.get("by_level", {})
          out = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          out.write_text(
              f"### SeRAPHIM snapshot\n\n"
              f"- generated: `{m['generated_at']}`\n"
              f"- health: **{h.get('status', '?')}**\n"
              f"- stations: **{c['stations']}** ({c['with_bank_level']} with bank level)\n"
              f"- at/over bank: **{c['at_or_over_bank']}** | stale: {c['stale']}"
              f" | median age: {a['median']} min\n"
              f"- risk 5/4/3: **{by.get('5', 0)}** / {by.get('4', 0)} / {by.get('3', 0)}\n"
              f"- time-to-bank on **{r.get('with_time_to_bank', 0)}** stations"
              f" (soonest {r.get('soonest_to_bank_hr')} h)\n"
              f"- forecast: {c.get('with_forecast', 0)} | tide points: {c.get('tide_points', 0)}\n\n"
              + "\n".join(f"- ⚠️ {x['detail']}" for x in h.get("checks", [])
                          if x["status"] != "pass"),
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
